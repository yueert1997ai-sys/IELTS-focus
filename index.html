We want to understand that apparent contradiction. There may be something about those seats that makes them unattractive."},{"speaker":2,"text":"So the focus is how space is used, not the size of the collection or the format of the books."}],"explain":"“找不到座位”与某些排仍空着的矛盾，要解释座位选择。","tag":"现象概括"},{"stem":"Why does Luke object to using the entrance counter as the main measure?","options":["It cannot distinguish a short visit from a long stay.","It misses everyone who enters after dark.","It is frequently out of order."],"labels":["不能区分短访和久留","漏记夜间入馆","计数器常坏"],"answer":0,"lines":[{"speaker":0,"text":"The entrance counter gives us a convenient total."},{"speaker":1,"text":"It works reliably, including at night. But someone collecting a reserved book and someone studying for six hours both count as one visitor."},{"speaker":0,"text":"So it does not tell us how much demand each person puts on the study space."},{"speaker":1,"text":"Exactly. We need a measure that captures duration as well."}],"explain":"计数可靠，但没有停留时长，不能反映座位占用需求。","tag":"指标局限"},{"stem":"What was the tutor criticising in the earlier feedback?","options":["The tutor had suggested studying a different building.","The tutor was criticising the way sites had been selected.","The tutor wanted fewer observations."],"labels":["导师要求换楼","导师批评地点选择方式","导师要求减少观察"],"answer":1,"lines":[{"speaker":0,"text":"When you called the sampling weak, I thought you meant we had not watched for long enough."},{"speaker":2,"text":"The hours were sufficient. The problem was choosing only places near the windows."},{"speaker":1,"text":"We left out the darker interior areas."},{"speaker":0,"text":"I see. You were questioning where we observed, not how much observing we did."}],"explain":"纠正误读：导师批评观察位置覆盖，不是数量或时长；题干问此前误解的反馈实际指向什么。","tag":"反馈对象／量与范围"},{"stem":"What do they agree to do about the noisy group-study area?","options":["exclude it from the investigation","assume the noise explains why it is unpopular","check whether the users regard the noise as a problem"],"labels":["排除该区域","直接认定噪音导致不受欢迎","核实使用者是否介意噪音"],"answer":2,"lines":[{"speaker":1,"text":"The group area sounds noisy to me. That must put people off."},{"speaker":0,"text":"Possibly, but people working together may prefer a place where conversation is allowed."},{"speaker":1,"text":"Then we should ask the actual users rather than impose our own preference."},{"speaker":2,"text":"Agreed. Keep the area in the study and test your explanation."}],"explain":"不把研究者的偏好当作用户问题，先核实噪音是否真影响用户。","tag":"推测与证据"}],"multi":{"stem":"Which TWO improvements to the observation method do both students support?","options":["following individual users throughout the day","recording seats rather than only counting people","ignoring seats occupied by personal belongings","observing at a range of times","asking every user to complete a long interview"],"labels":["整天跟踪个人","按座位记录使用状态","忽略被物品占座","覆盖不同时间","人人长访谈"],"answers":[1,3],"lines":[{"speaker":0,"text":"Our sheet just records the number of people. It should show which seats are in use, including those held by bags."},{"speaker":1,"text":"Yes, that will tell us more about the space that is actually available."},{"speaker":0,"text":"We also need mornings and evenings rather than only lunchtime."},{"speaker":1,"text":"Definitely. One time slot could give a misleading picture."},{"speaker":0,"text":"What about following the same individuals?"},{"speaker":1,"text":"That would be intrusive, and we do not need their identities."},{"speaker":0,"text":"So short observations at several times, with a brief optional question rather than a compulsory long interview."}],"explain":"共同认可座位状态记录、跨时段观察。反对跟踪个人和强制长访谈，物品占座也应计入。","tag":"共同决定／测量对象"},"matching":{"stem":"What is the main reason for changing each location in the design proposal?","options":["poor access to power","a lack of storage","uncomfortable lighting","insufficient privacy","an obstructed route","an unsuitable noise level","unclear signs"],"labels":["电源不足","储物不足","照明不适","隐私不足","动线受阻","噪声不合适","标识不清"],"reuse":false,"items":[{"name":"Entrance tables","answer":4,"lines":[{"speaker":0,"text":"The entrance tables are popular, but people waiting for the lift have to squeeze between the chairs."},{"speaker":1,"text":"Then moving the tables would keep the route clear. Their lighting and sockets are adequate."}],"explain":"桌椅挡住去电梯通路，主因是动线。","tag":"空间关系"},{"name":"Window desks","answer":2,"lines":[{"speaker":1,"text":"The window desks look attractive in photographs."},{"speaker":0,"text":"In the afternoon, direct sunlight reflects off laptop screens. People leave even when the room is quiet."}],"explain":"阳光反射使屏幕难看清，对应照明不适。","tag":"具体问题→类别"},{"name":"Interview booths","answer":3,"lines":[{"speaker":0,"text":"The booths have signs and plenty of sockets."},{"speaker":1,"text":"But someone walking past can read the screen and hear a confidential conversation. The partitions need to provide more separation."}],"explain":"路人可见屏幕且听到谈话，属于隐私问题。","tag":"概括"},{"name":"Central benches","answer":0,"lines":[{"speaker":1,"text":"There is room for bags under the central benches."},{"speaker":0,"text":"What drives people away is having to trail a charging cable across the aisle. Very few seats have a socket within reach."}],"explain":"充电接口够不到，重点在电源，不在收纳。","tag":"设施指向"}]}},{"id":"archaeology","title":"考古实习记录","context":"Two archaeology students reflect on a field course and prepare a joint assignment.","speakers":["Iris","Max","Tutor"],"singles":[{"stem":"What do both students value most about the field course?","options":["learning to work without supervision","understanding how interpretations depend on context","handling rare objects"],"labels":["学会脱离监督工作","理解解读依赖出土背景","接触稀有文物"],"answer":1,"lines":[{"speaker":1,"text":"Finding the decorated fragment was exciting."},{"speaker":0,"text":"It was, but the most useful lesson for me was seeing why its position in the soil mattered as much as the object itself."},{"speaker":1,"text":"I agree. Without that context, we could easily tell the wrong story about it."},{"speaker":2,"text":"And the close supervision was part of what made that lesson possible, rather than something you had to do without."}],"explain":"最看重物品位置和环境如何改变解释；稀有物让人兴奋但不是共同认为最有价值的收获。","tag":"最高级限定／价值"},{"stem":"Why was the excavation schedule altered?","options":["An unexpected feature required more detailed recording.","Too few volunteers arrived.","Heavy rain made the site unsafe."],"labels":["意外遗迹需细记","志愿者不足","大雨造成危险"],"answer":0,"lines":[{"speaker":0,"text":"The forecast sounded worrying, but the rain passed north of us."},{"speaker":1,"text":"We actually lost the extra day when a line of post holes appeared. The supervisor wanted every position measured before we continued."},{"speaker":0,"text":"There were plenty of volunteers; the recording simply could not be rushed."},{"speaker":2,"text":"Then explain that the timetable changed because the evidence required a different pace."}],"explain":"进度变慢因意外柱洞遗迹需记录；天气和人数并未造成问题。","tag":"因果／提到不等于原因"},{"stem":"What is Max’s criticism of the training session?","options":["The session was held too late in the course.","The instructor lacked subject knowledge.","The explanation did not match beginners’ needs."],"labels":["开课时间太晚","教师知识不足","讲解未适合初学者"],"answer":2,"lines":[{"speaker":1,"text":"The recording workshop was held at the right point, before we used the forms."},{"speaker":0,"text":"The instructor certainly knew the system."},{"speaker":1,"text":"Yes, but he moved straight into exceptions and abbreviations without showing a complete basic example."},{"speaker":0,"text":"So it assumed experience we did not have."},{"speaker":1,"text":"Exactly. I needed a starting point, not a different expert."}],"explain":"知识和时间都认可，批评讲解默认新手已有经验，缺完整入门例子。","tag":"人能力与教学适配区别"},{"stem":"What will the students do to improve their assignment?","options":["include every object in the catalogue","write separate accounts of each working day","organise the discussion around competing explanations"],"labels":["收录全部物品","逐日记流水账","围绕不同解释组织讨论"],"answer":2,"lines":[{"speaker":0,"text":"Our draft is basically a diary of what happened each day."},{"speaker":1,"text":"The tutor wants an argument, though. We could take the two interpretations of the building and compare the evidence for each."},{"speaker":0,"text":"That would give it a clearer structure. We can use selected finds rather than reproduce the whole catalogue."},{"speaker":2,"text":"Yes. Show how your reasoning develops, not just how the week unfolded."}],"explain":"从工作日记改为对照两种解释及证据，属于论证结构。","tag":"概括／组织方式"}],"multi":{"stem":"Which TWO mistakes do the students admit making during the fieldwork?","options":["ignoring a safety instruction","giving too much weight to an attractive find","refusing to ask for help","discarding material without permission","failing to label a set of photographs immediately"],"labels":["无视安全规定","过分看重漂亮发现","拒绝求助","擅自丢材料","照片未及时标注"],"answers":[1,4],"lines":[{"speaker":1,"text":"I let that decorated piece influence my interpretation far too much."},{"speaker":0,"text":"So did I. It looked important, and we overlooked the less impressive evidence around it."},{"speaker":1,"text":"The photograph labels were another mistake. We assumed we would remember which area each image showed."},{"speaker":0,"text":"Then by evening two sets looked almost identical. We should have labelled them on the spot."},{"speaker":1,"text":"At least we checked before removing any material."},{"speaker":0,"text":"Yes, and asked the supervisor when we were unsure. She never raised a safety concern; the errors were in how we handled evidence and records."}],"explain":"明确承认两错：漂亮文物压过周边证据、照片延迟标注。求助、材料处理和安全没有被承认做错。","tag":"承认错误／主体和范围"},"matching":{"stem":"What does the tutor recommend for each type of evidence?","options":["check its recorded location","obtain permission to reproduce it","improve the image quality","explain why it was excluded","compare it with an external source","reduce the number of examples","state the uncertainty"],"labels":["核对记录位置","获转载许可","提升图像质量","解释剔除原因","比外部来源","减少例子","说明不确定性"],"reuse":false,"items":[{"name":"Pottery group","answer":4,"lines":[{"speaker":0,"text":"We dated the pottery using shapes in our field notes."},{"speaker":2,"text":"Check those against the published regional catalogue. That comparison would strengthen the dating argument."}],"explain":"与出版的区域目录比对，属于外部来源。","tag":"证据动作"},{"name":"Timber sample","answer":6,"lines":[{"speaker":1,"text":"The timber might be from the original building or a later repair."},{"speaker":2,"text":"Do not choose one confidently without further evidence. Make that unresolved possibility visible in your discussion."}],"explain":"保留原建材或后修两种可能，说明不确定。","tag":"置信程度"},{"name":"Aerial photograph","answer":1,"lines":[{"speaker":0,"text":"The aerial photograph belongs to the county archive."},{"speaker":2,"text":"Before you place it in the report, check that the archive allows this use. A citation alone does not necessarily give you that permission."}],"explain":"确认使用许可，不是只改善图像或加引用。","tag":"许可"},{"name":"Loose metal fragment","answer":0,"lines":[{"speaker":1,"text":"The loose metal fragment is marked as coming from the eastern trench."},{"speaker":2,"text":"Your photograph shows a western-trench label beside it. Resolve where it was actually found before relying on it."}],"explain":"两份记录位置冲突，先核出土位置。","tag":"记录冲突"}]}},{"id":"archives","title":"数字档案设计","context":"Two information-science students discuss a prototype archive for a university collection.","speakers":["Tessa","Ryan","Tutor"],"singles":[{"stem":"What is the main aim of the prototype?","options":["making every item publicly downloadable","helping users find connections between different materials","replacing the physical collection entirely"],"labels":["所有材料公开下载","帮助发现材料间关联","完全取代实体收藏"],"answer":1,"lines":[{"speaker":0,"text":"Scanning everything is only one part of the work."},{"speaker":1,"text":"The aim is to let someone move from a letter to a photograph of the event it describes and then to the relevant interview."},{"speaker":2,"text":"So the value lies in relationships between items."},{"speaker":0,"text":"Yes. Some files will still have access restrictions, and the physical originals will remain in the collection."}],"explain":"核心是从信件关联照片再到访谈；数字化不等于全部公开或丢实体。","tag":"功能概括"},{"stem":"Why do the students want to change the search categories?","options":["There are too few documents to justify several categories.","The existing terms reflect the archivists’ organisation rather than users’ questions.","The search software cannot accept long words."],"labels":["文件太少无需分类","分类按馆员体系而非用户提问","软件不能输长词"],"answer":1,"lines":[{"speaker":1,"text":"Our categories follow the boxes in the storeroom."},{"speaker":0,"text":"That makes sense to the archivists, but a student may search for housing conditions without knowing which department produced the records."},{"speaker":1,"text":"We should add routes based on topics people actually investigate."},{"speaker":2,"text":"The software can handle that. This is a question about how users think, not a technical word-length limit."}],"explain":"现有分类适合保管者，未贴合研究者问题。要调整信息组织视角。","tag":"用户视角／主体"},{"stem":"What concerns Tessa about automatic transcription?","options":["It cannot produce text quickly enough.","It requires every recording to be made again.","It may make errors that appear convincing."],"labels":["转写太慢","所有录音须重录","错误看起来很可信"],"answer":2,"lines":[{"speaker":0,"text":"The automatic transcript appears almost immediately, which is useful."},{"speaker":1,"text":"And most of the ordinary speech is correct."},{"speaker":0,"text":"My worry is when an unfamiliar surname becomes a perfectly normal but wrong word. A reader may trust it because the sentence still looks sensible."},{"speaker":2,"text":"Then the danger is not just an obvious gap. It is a plausible mistake that passes unnoticed."}],"explain":"速度快且大部分准确，但“貌似合理的错词”难察觉；担心误导可信度。","tag":"具体例子→概括风险"},{"stem":"What do they decide to test with users first?","options":["how many files users can download in a minute","which colour scheme looks most attractive","whether users can find material for a particular research question"],"labels":["每分钟下载文件量","配色吸引力","能否按研究问题找到资料"],"answer":2,"lines":[{"speaker":1,"text":"We have three colour schemes ready for comparison."},{"speaker":0,"text":"Before that, give users a research question and see whether they can locate suitable sources."},{"speaker":1,"text":"You mean test the route through the collection rather than ask whether it looks good."},{"speaker":0,"text":"Exactly. Download speed matters later, but finding the right material is the first hurdle."}],"explain":"先测任务可完成性，后考虑外观和下载速度。","tag":"优先级／任务成功"}],"multi":{"stem":"Which TWO safeguards do both students consider essential before launch?","options":["a way to trace edited descriptions back to their source","the removal of every disputed date","an explicit record of access permissions","automatic publication of all new uploads","a requirement that all users register with their employer"],"labels":["编辑后描述可追溯来源","删去全部有争议日期","明确访问授权记录","新上传自动公开","所有用户以雇主注册"],"answers":[0,2],"lines":[{"speaker":0,"text":"We cannot launch until each item has a clear permission record. Otherwise a restricted letter could appear in public search."},{"speaker":1,"text":"Absolutely. We also need to keep the source behind every edited description."},{"speaker":0,"text":"Yes. Users should be able to see what we changed and where the information came from."},{"speaker":1,"text":"What about uncertain dates?"},{"speaker":0,"text":"Label them as uncertain rather than removing them all."},{"speaker":1,"text":"And uploads should wait for review, not appear automatically."},{"speaker":0,"text":"Agreed. Requiring an employer account would exclude independent researchers, so that is not our access policy."}],"explain":"必需的是权限记录和来源可追溯。争议日期可标不确定；不自动公开；不要求雇主账号。","tag":"必要条件／否定干扰"},"matching":{"stem":"What problem needs attention in each collection?","options":["unreadable image detail","missing ownership information","poor sound quality","incorrect sequencing","insufficient links to related material","inconsistent naming","incomplete subject coverage"],"labels":["图像细节难辨","权属缺失","声音质量差","顺序错","相关链接不足","命名不一致","主题覆盖不全"],"reuse":false,"items":[{"name":"Student letters","answer":5,"lines":[{"speaker":0,"text":"The student letters use three different forms of the same person’s name."},{"speaker":1,"text":"Then searches return separate groups for one individual. We need a consistent name entry while preserving the original spelling in the transcript."}],"explain":"同一人多种名字形式被分裂，属于命名一致性。","tag":"身份对应"},{"name":"Staff interviews","answer":2,"lines":[{"speaker":1,"text":"The staff interviews have detailed descriptions and permissions."},{"speaker":0,"text":"But a constant hum obscures parts of the speech. We need to improve the recording quality before checking the transcripts."}],"explain":"底噪盖住说话，声音质量问题。","tag":"听音质量"},{"name":"Campus photographs","answer":1,"lines":[{"speaker":0,"text":"The campus photographs are sharp, and the dates are ordered correctly."},{"speaker":1,"text":"Several have no record of who holds the rights, though. That must be established before we decide what can be displayed."}],"explain":"画面与时间序都正常，缺版权归属记录。","tag":"信息类别"},{"name":"Building plans","answer":4,"lines":[{"speaker":1,"text":"The building plans can be found by year or architect."},{"speaker":0,"text":"What is missing is a route from a plan to letters about that building. The materials exist, but nothing connects them in the interface."}],"explain":"资料存在且可搜索，但相互连接不足。","tag":"存在与可关联"}]}},{"id":"food-waste","title":"食堂食物浪费研究","context":"Two environmental-science students prepare a study of food waste in a university canteen.","speakers":["Jade","Oliver","Tutor"],"singles":[{"stem":"What do the students want to distinguish in their study?","options":["food bought locally and food brought from elsewhere","vegetarian meals and meals containing meat","food left by customers and food discarded before serving"],"labels":["本地与外来食材","荤素餐","顾客剩餐与供餐前丢弃"],"answer":2,"lines":[{"speaker":0,"text":"The canteen reports one total for all discarded food."},{"speaker":1,"text":"But unused ingredients in the kitchen and food left on plates have different causes."},{"speaker":0,"text":"We want to separate those streams before making recommendations."},{"speaker":2,"text":"Good. Meal type and sourcing might be relevant background, but that is not the primary distinction in your design."}],"explain":"主轴是浪费发生环节：厨房供餐前、顾客吃后。不是食物类别或产地。","tag":"差异轴"},{"stem":"Why does Oliver think weighing the bins only at closing time is inadequate?","options":["The scales are unavailable then.","It conceals differences between busy and quiet periods.","The bins are too heavy to move."],"labels":["收市时无秤","掩盖不同时段差异","垃圾桶太重"],"answer":1,"lines":[{"speaker":1,"text":"A final weight would be easy to obtain. The equipment is available and the bins are on wheels."},{"speaker":0,"text":"So why measure several times?"},{"speaker":1,"text":"Because an evening total hides whether most waste came from the lunch rush or the quieter later service. Those might require different solutions."},{"speaker":2,"text":"Exactly. Keep the timing information rather than collapsing it all into one number."}],"explain":"收市总量抹掉午高峰与晚间差别，需要时段细分。","tag":"总量与分布"},{"stem":"What is Jade’s attitude to the manager’s explanation?","options":["She considers it plausible but wants independent evidence.","She accepts it as the only possible cause.","She thinks it is deliberately dishonest."],"labels":["看似合理但需独立证据","认定唯一原因","认定故意撒谎"],"answer":0,"lines":[{"speaker":0,"text":"The manager thinks oversized portions explain most plate waste."},{"speaker":1,"text":"That sounds reasonable."},{"speaker":0,"text":"It does, but we should measure portions and ask customers. Some might leave food because they dislike the recipe, not because there is too much."},{"speaker":2,"text":"A reasonable explanation is still something to test. You need not assume the manager is being dishonest to question it."}],"explain":"愿意检验合理解释，没有全盘接受也没有指控动机。","tag":"态度／合理但未证实"},{"stem":"What do the students agree to change after the pilot?","options":["weigh only the most expensive ingredients","ask customers to sort all the waste themselves","use categories that staff can apply consistently"],"labels":["只称贵食材","让顾客全自行分拣","用员工能一致判断的类别"],"answer":2,"lines":[{"speaker":1,"text":"Our categories distinguish seven kinds of vegetable preparation, and staff keep placing the same material in different groups."},{"speaker":0,"text":"Then the categories are too fine for this setting. We should combine some until the distinctions are clear."},{"speaker":1,"text":"Agreed. We need reliable classification, not an elaborate scheme nobody can use."},{"speaker":2,"text":"Keep responsibility with the trained team rather than expecting every customer to do the sorting."}],"explain":"合并过细分类让记录者判断一致；不按价格筛食材、不把工作全推顾客。","tag":"复杂度与可执行性"}],"multi":{"stem":"Which TWO factors do both students think they must account for when comparing days?","options":["the brand name printed on the bins","whether the menu changed","how many meals were served","the age of the kitchen building","the colour of the dining-room walls"],"labels":["垃圾桶品牌","菜单是否变化","供餐数量","厨房楼龄","墙壁颜色"],"answers":[1,2],"lines":[{"speaker":0,"text":"Tuesday produced more waste than Monday, but it also served nearly twice as many meals."},{"speaker":1,"text":"Then totals alone are misleading. We need waste per meal as well."},{"speaker":0,"text":"Yes. And the menus were different; one day included a dish that many people left unfinished."},{"speaker":1,"text":"We should take that into account rather than attributing everything to the day of the week."},{"speaker":0,"text":"The building, wall colours and bins were the same throughout."},{"speaker":1,"text":"So those cannot explain this particular day-to-day comparison."}],"explain":"比较天数要控制供餐量和菜单变化；其他固定因素未解释本次日间差异。","tag":"比较基准／变量"},"matching":{"stem":"What improvement is proposed for each part of the data-collection process?","options":["record the time more precisely","check the instrument regularly","seek additional permission","provide a clearer definition","protect participants’ identities","include a wider range of days","reduce the physical workload"],"labels":["时间更精确","定期核仪器","补许可","定义更清楚","保护身份","增加日期类型","减少体力负担"],"reuse":false,"items":[{"name":"Kitchen waste log","answer":3,"lines":[{"speaker":0,"text":"Staff disagree on whether vegetable peelings count as avoidable waste."},{"speaker":1,"text":"We need to state exactly what each category includes, with an example. More columns will not solve an unclear definition."}],"explain":"对 avoidable 的边界不同，先明确类别定义。","tag":"概念定义"},{"name":"Bin-weighing procedure","answer":1,"lines":[{"speaker":1,"text":"The scale showed a small reading even when it was empty yesterday."},{"speaker":0,"text":"Check and reset it before each session, rather than assuming yesterday’s setting still holds."}],"explain":"每场检查归零，属于定期核仪器。","tag":"操作归类"},{"name":"Customer interviews","answer":4,"lines":[{"speaker":0,"text":"We currently write customers’ names beside their answers."},{"speaker":1,"text":"We do not need those. Assign a code and keep any contact details separately so the comments cannot easily be linked to individuals."}],"explain":"编码与分离联系方式保护个人身份。","tag":"隐私"},{"name":"Observation schedule","answer":5,"lines":[{"speaker":1,"text":"All our observations are from ordinary teaching weekdays."},{"speaker":0,"text":"Add a weekend service and a day during the revision period. Demand may be different then, and the current schedule misses that."}],"explain":"扩充不同日期类型，不只是把每日时间记精确。","tag":"时间维度区分"}]}},{"id":"coast","title":"海岸侵蚀监测","context":"Two geography students review evidence for a coastal change project.","speakers":["Sofia","Ethan","Tutor"],"singles":[{"stem":"Why do the students choose one bay rather than the whole coastline?","options":["The local council has requested a study of that bay.","The bay has experienced the most severe damage.","The available evidence can be compared consistently there."],"labels":["地方部门指定","该湾受损最严重","该处资料可一致比较"],"answer":2,"lines":[{"speaker":1,"text":"The northern cliffs have suffered more dramatic losses, so the bay is not the obvious choice for photographs."},{"speaker":0,"text":"But for this bay we have surveys taken from fixed reference points over several years. Elsewhere the methods keep changing."},{"speaker":2,"text":"That gives you a sound basis for measuring change."},{"speaker":1,"text":"The council is interested, but the decision was ours, based on the records."}],"explain":"选择依据是历年固定参照点资料可比，不是灾情最强或行政要求。","tag":"选题理由／资料可比性"},{"stem":"What does the tutor say about the students’ first graph?","options":["It uses the wrong unit of distance.","It may exaggerate the impression of change.","It contains too many data points."],"labels":["距离单位错","可能夸大变化观感","数据点太多"],"answer":1,"lines":[{"speaker":0,"text":"The graph makes the recent movement look very dramatic."},{"speaker":2,"text":"Partly because the vertical axis begins just below your lowest value. A reader may see a much larger proportional change than the figures justify."},{"speaker":1,"text":"The measurements themselves are correct, then?"},{"speaker":2,"text":"Yes, including the units. Reconsider the scale and make its starting point clear."}],"explain":"数值和单位对，但纵轴截断增强变化观感。区别数据错误和呈现误导。","tag":"图表尺度／程度"},{"stem":"What surprises Ethan about residents’ accounts?","options":["Their memories are identical despite different experiences.","They often describe gradual change as a single dramatic event.","They are less interested in the coast than expected."],"labels":["所有记忆一致","渐变常被叙述成单次大事","比预计更不关心"],"answer":1,"lines":[{"speaker":1,"text":"Several residents spoke as if the entire beach changed during one storm."},{"speaker":0,"text":"Yet the surveys show it had been retreating for years beforehand."},{"speaker":1,"text":"That contrast was unexpected. A memorable event seems to organise the story, even when the process was much longer."},{"speaker":2,"text":"Useful, provided you do not assume every resident remembers it in the same way."}],"explain":"记忆用一次显著事件概括长期过程，意外在叙事与长期记录的差异。","tag":"过程与事件／概括"},{"stem":"What will the students do with the engineering proposal?","options":["leave it out because it was written for the council","use it as proof that the chosen solution will work","evaluate the assumptions on which its prediction depends"],"labels":["因委托来源而排除","当作方案有效的证明","评估预测所依赖假设"],"answer":2,"lines":[{"speaker":0,"text":"The engineering report predicts the barrier will preserve the beach for twenty years."},{"speaker":1,"text":"That is useful, but only under its assumed storm frequency and sediment supply."},{"speaker":0,"text":"Then we should examine those assumptions before treating the prediction as a likely outcome."},{"speaker":2,"text":"Exactly. Its being written for the council is not a reason to discard it; nor does a prediction establish a result."}],"explain":"检验预测条件，既不当保证也不因委托方直接丢弃。","tag":"条件限定／预测与结果"}],"multi":{"stem":"Which TWO sources do the students agree would add useful evidence?","options":["the most widely shared social-media video","a visitor brochure describing local attractions","a second copy of the engineering summary","photographs taken from a consistent position","records of changes in beach material"],"labels":["传播最多的视频","景点宣传册","工程摘要另一副本","固定位置照片","海滩物质变化记录"],"answers":[3,4],"lines":[{"speaker":1,"text":"The viral storm video would make a strong opening."},{"speaker":0,"text":"For an opening, perhaps. But we cannot locate the camera accurately enough to measure anything from it."},{"speaker":1,"text":"The resident who photographs the same view from her balcony each month is different."},{"speaker":0,"text":"Yes. Those images could give us a consistent visual sequence."},{"speaker":1,"text":"The harbour office also records the grain size and amount of material collected from the beach."},{"speaker":0,"text":"That would help us judge what has moved, rather than only where the waterline appears. Ask for those records."},{"speaker":1,"text":"I will. The tourist brochure and duplicate summary do not add that kind of evidence."}],"explain":"双方认可固定位置照片可比较、海滩材料记录能解释物质移动。热门视频适合开场不等于测量证据。","tag":"用途限定／宣传与证据"},"matching":{"stem":"What concern is raised about each proposed fieldwork activity?","options":["it may damage the site","it involves an unclear measurement","it requires conditions that cannot be guaranteed","it needs additional training","it may exclude an important group","it duplicates existing evidence","it uses an unsuitable time interval"],"labels":["可能损害场地","测量定义不清","依赖不确定条件","需额外培训","漏重要人群","重复已有证据","时间间隔不合适"],"reuse":false,"items":[{"name":"Drone photography","answer":2,"lines":[{"speaker":0,"text":"The drone would cover the whole bay quickly."},{"speaker":1,"text":"Only with low wind and good visibility. We have one fieldwork day, so we cannot count on a suitable flying window."}],"explain":"飞行依赖无法保证的天气，不是已经断定不能飞。","tag":"条件限制"},{"name":"Sediment sampling","answer":0,"lines":[{"speaker":1,"text":"Sampling every few metres would give a detailed profile."},{"speaker":0,"text":"But repeated digging in the protected dunes could disturb the plants holding them together. We should reduce the disturbance."}],"explain":"采样动作可能损伤保护地，核心为场地影响。","tag":"副作用"},{"name":"Resident survey","answer":4,"lines":[{"speaker":0,"text":"The online survey should reach the coastal neighbourhood quickly."},{"speaker":1,"text":"It may miss older residents who are not online, including people with the longest experience of the bay."}],"explain":"线上招募漏掉不联网的老居民，属于样本人群遗漏。","tag":"抽样范围"},{"name":"Beach-width record","answer":1,"lines":[{"speaker":1,"text":"The form has a column labelled beach width."},{"speaker":0,"text":"Measured from where to where? Different observers could choose the dune edge, the promenade or the current wet-sand line."}],"explain":"起止点定义不清，不是采样频率问题。","tag":"操作定义"}]}},{"id":"language-app","title":"语言学习应用评估","context":"Two applied-linguistics students discuss a pilot evaluation of a vocabulary app.","speakers":["Mei","Adam","Tutor"],"singles":[{"stem":"What outcome are the students most interested in?","options":["how quickly learners finish an app session","whether learners can use new words outside the app","which screen layout learners prefer"],"labels":["完成一轮的速度","能否在应用外使用新词","界面偏好"],"answer":1,"lines":[{"speaker":0,"text":"The app reports impressive scores, but many exercises involve choosing a word from a familiar list."},{"speaker":1,"text":"We want to know whether the learning carries over when that list is absent, such as in a new conversation."},{"speaker":2,"text":"Then your outcome is transfer beyond the practice format."},{"speaker":0,"text":"Yes. Speed and interface preference alone would not answer that question."}],"explain":"关注应用外新情境能否使用，属于迁移；内部得分和速度未必证明。","tag":"训练表现与迁移"},{"stem":"Why do they decide to delay one of the tests?","options":["They want to measure retention rather than immediate recall alone.","The learners have not completed enough lessons.","The tutor will not be available to mark it."],"labels":["检验保持而非仅当场回忆","课程学得不够","导师无法批改"],"answer":0,"lines":[{"speaker":1,"text":"An immediate test shows what is available just after practice."},{"speaker":0,"text":"But some of that may disappear by the following week. Let us test again after a delay without giving another lesson first."},{"speaker":2,"text":"That will help distinguish a short-lived performance boost from something retained."},{"speaker":1,"text":"We can score it ourselves, so your timetable is not the reason for the delay."}],"explain":"延迟测查记忆是否保留，不是因为课没上完或老师没空。","tag":"即时与长期"},{"stem":"What does Mei think was unfair in the original comparison?","options":["The control group studied for less time.","The two groups were tested on different words.","The app group had a more experienced teacher."],"labels":["对照组学习时间较少","测试词不同","应用组教师更有经验"],"answer":0,"lines":[{"speaker":0,"text":"Both groups saw the same words and took the same test."},{"speaker":1,"text":"And neither had a teacher present."},{"speaker":0,"text":"But the app users practised for twenty minutes, while the worksheet group stopped after ten. We cannot attribute the difference only to the format."},{"speaker":2,"text":"Right. Make the available learning time equivalent before comparing the methods."}],"explain":"公平指比较条件一致：时间一倍差距混入格式效果。不是“所有人完全相同”这类空泛理解。","tag":"unfair／比较基准"},{"stem":"What do the students decide about the app’s reward system?","options":["record its possible influence on learners’ behaviour","assume it improves long-term learning","remove it from the app before testing"],"labels":["记录其对行为的可能影响","认定提高长期学习","测试前移除奖励"],"answer":0,"lines":[{"speaker":1,"text":"Some participants repeated the easiest exercise to keep earning points."},{"speaker":0,"text":"Then the reward system may change what they choose to practise. We should record that behaviour."},{"speaker":1,"text":"We cannot alter the app, and points do not necessarily show learning."},{"speaker":2,"text":"Exactly. Treat the rewards as a factor in the experience, not automatic evidence of educational value."}],"explain":"重复简单练习拿积分要作为行为影响记录，积分不自动等于长期学习。","tag":"功能与效果区分"}],"multi":{"stem":"Which TWO changes do both students support for the next trial?","options":["awarding course credit according to app scores","using unfamiliar contexts in the final test","checking what participants already know","letting app users choose their own study duration","removing all learners with previous language experience"],"labels":["按积分给课程学分","终测用陌生语境","先查原有知识","应用组自定时长","排除一切已有语言经验者"],"answers":[1,2],"lines":[{"speaker":0,"text":"The final test should not repeat the sentences from the lessons."},{"speaker":1,"text":"Agreed. Otherwise people may recognise the examples rather than understand the words in a new setting."},{"speaker":0,"text":"And we need a short check before practice. Some learners already knew half the targets."},{"speaker":1,"text":"Yes. Improvement depends on the starting point."},{"speaker":0,"text":"Should we simply exclude everybody with prior experience?"},{"speaker":1,"text":"That would exclude almost everyone and still would not tell us which words they knew."},{"speaker":0,"text":"Then we measure prior knowledge and keep study time fixed. The reward points will remain separate from their course results."}],"explain":"共同支持新语境检测、前测知识基线；不是排除所有有经验者或按应用积分评课程分。","tag":"双方认可／测量起点"},"matching":{"stem":"What does the tutor identify as the main issue with each task?","options":["it allows too little response time","it measures a different skill","it gives away the answer in the example","it relies too much on recognition","it introduces unfamiliar vocabulary unrelated to the target","it repeats an earlier item","it is difficult to score consistently"],"labels":["回答时间太少","测了另一技能","例子泄露答案","过度依赖认出","引入无关生词","重复前题","难一致评分"],"reuse":false,"items":[{"name":"Picture selection","answer":3,"lines":[{"speaker":1,"text":"The picture-selection task is easy to score."},{"speaker":2,"text":"Yes, but the learner only chooses among pictures seen during practice. That may show familiarity rather than the ability to retrieve the word independently."}],"explain":"可选熟图偏向认出，不足以检验独立提取。","tag":"识别与提取"},{"name":"Open dialogue","answer":6,"lines":[{"speaker":0,"text":"In the open dialogue, we judge whether the word is used naturally."},{"speaker":2,"text":"You need clearer criteria for naturally. Two markers could disagree even when they hear the same response."}],"explain":"评分标准不明确使评分者不一致。","tag":"评价标准"},{"name":"Timed definition","answer":0,"lines":[{"speaker":1,"text":"Learners have two seconds to explain each word."},{"speaker":2,"text":"Even someone who understands it may not formulate a definition that quickly. The deadline is doing too much of the testing."}],"explain":"时限太紧可能挡住真正理解者，问题是响应时间。","tag":"速度与能力"},{"name":"Passage completion","answer":4,"lines":[{"speaker":0,"text":"The passage contains the target verbs and several technical nouns."},{"speaker":2,"text":"Those nouns may block understanding before learners reach the verbs. Simplify the surrounding language so you test the intended words."}],"explain":"无关专业名词增加难度，应简化背景语言。","tag":"目标与附带难度"}]}},{"id":"transport","title":"校园通勤研究","context":"Two planning students discuss interviews and travel-diary data for a transport project.","speakers":["Amira","Leo","Tutor"],"singles":[{"stem":"What do the students want to explain about commuting choices?","options":["why staff travel further than students","why bus fares have risen in every district","why stated preferences do not always match actual journeys"],"labels":["教工路程比学生远","各区票价上涨","口头偏好与实际出行不一致"],"answer":2,"lines":[{"speaker":0,"text":"Many respondents said they preferred public transport, but their diaries showed frequent car journeys."},{"speaker":1,"text":"That gap is what interests us. A preference may be genuine even when practical constraints prevent someone following it."},{"speaker":2,"text":"Then do not assume the survey and diary contradict because one must be dishonest. Look for the conditions surrounding the choice."}],"explain":"研究口头倾向与实际选择的差距及其约束，不预先认定撒谎。","tag":"态度与行为"},{"stem":"Why does Leo want to interview some drivers?","options":["The tutor insists that every travel mode must receive equal time.","They are easier to contact than bus users.","Their reasons may not be captured by the survey categories."],"labels":["导师要求各方式等时","比公交者容易联系","原因可能未被问卷类别覆盖"],"answer":2,"lines":[{"speaker":1,"text":"The questionnaire lets drivers tick convenience or cost."},{"speaker":0,"text":"Those seem fairly broad."},{"speaker":1,"text":"Too broad, perhaps. Convenience could mean collecting a child, carrying equipment or working an unpredictable shift. Interviews could reveal which constraint matters."},{"speaker":2,"text":"Choose them for that explanatory value, not just to make every group equally large."}],"explain":"笼统类别下有具体不同约束，访谈为解释其含义，不是凑平人数。","tag":"上位概括→具体原因"},{"stem":"What do both students think about the proposal to reduce parking?","options":["Its effect may depend on the availability of alternatives.","It is certain to reduce car use immediately.","It is irrelevant to the campus."],"labels":["效果取决于替代交通","必然立即减车","与校园无关"],"answer":0,"lines":[{"speaker":0,"text":"Reducing parking might encourage a change, but only if another workable route exists."},{"speaker":1,"text":"I agree. For someone finishing after the last bus, removing a space does not create a bus service."},{"speaker":2,"text":"So your evaluation should connect the proposal with service availability."},{"speaker":0,"text":"Yes. We should neither promise an immediate reduction nor dismiss parking as irrelevant."}],"explain":"减少车位的效果有条件：可用替代方案存在。晚班没公交的例子说明条件。","tag":"双方观点／条件"},{"stem":"What correction does the tutor ask them to make to the report?","options":["remove all references to walking","distinguish frequency from total travel time","replace the interviews with a larger survey"],"labels":["删步行","分清班次频率和总耗时","用大问卷替代访谈"],"answer":1,"lines":[{"speaker":2,"text":"This paragraph says buses are slow, but your evidence is that services come only twice an hour."},{"speaker":1,"text":"That describes the wait between buses, not necessarily how long a journey takes once aboard."},{"speaker":0,"text":"We have combined different kinds of time."},{"speaker":2,"text":"Exactly. Separate the frequency of the service from the complete journey duration."}],"explain":"半小时一班是发车频率，不自动等于车辆行程慢。需拆清时间维度。","tag":"差异轴／时间维度"}],"multi":{"stem":"Which TWO measures do the students agree should be prioritised in their recommendations?","options":["a publicity campaign before any service changes","free parking for every campus user","secure facilities for bicycles","better connections with late-evening services","a ban on all delivery vehicles"],"labels":["未改服务先宣传","全员免费停车","安全自行车设施","衔接晚间班次","全面禁配送车"],"answers":[2,3],"lines":[{"speaker":1,"text":"A publicity campaign would be visible and fairly cheap."},{"speaker":0,"text":"But telling people about a bus that leaves before their shift ends will not help. I would put evening connections first."},{"speaker":1,"text":"You are right. Solve that gap before spending on promotion."},{"speaker":0,"text":"The diaries also show short trips that could be cycled, but interviewees worry about theft and leaving equipment exposed."},{"speaker":1,"text":"Secure cycle facilities would address that directly. Let us make those a priority too."},{"speaker":0,"text":"We still need access for deliveries. And universal free parking would push the policy in the opposite direction."}],"explain":"Leo 从宣传转而认可先解决晚间连接；两人也支持安全骑行设施。按最终共同优先项作答。","tag":"改口／最终共同决定"},"matching":{"stem":"What is the main limitation of each data source?","options":["It relies on estimates made from memory.","It records intentions rather than actions.","It gives locations too imprecisely.","It excludes certain users.","It covers an unusual period.","It misses part of the journey.","It cannot distinguish repeated visits."],"labels":["依赖回忆估计","记录意图非行为","位置太模糊","漏部分用户","时期不典型","漏部分路程","分不清重复访问"],"reuse":false,"items":[{"name":"Online survey","answer":3,"lines":[{"speaker":0,"text":"The online survey went to students through the course mailing lists."},{"speaker":1,"text":"Then contracted cleaners and catering staff never received it, even though their shifts are important to the transport question."}],"explain":"课程名单发放漏外包职员等人群。","tag":"抽样覆盖"},{"name":"Journey app","answer":5,"lines":[{"speaker":1,"text":"The app logs the bus trip accurately."},{"speaker":0,"text":"But it starts at boarding and ends at getting off. The walk to the stop and the wait beforehand are missing."}],"explain":"漏上下车前后的步行等待，未覆盖全程。","tag":"起止边界"},{"name":"Retrospective interviews","answer":0,"lines":[{"speaker":0,"text":"Interviewees described their usual waiting time last term."},{"speaker":1,"text":"Those numbers are reconstructed now rather than recorded at the stop. A particularly bad experience might dominate what they remember."}],"explain":"事后凭记忆估计，区别实时记录。","tag":"回忆偏差"},{"name":"Traffic count","answer":4,"lines":[{"speaker":1,"text":"The traffic count was carefully conducted for a full week."},{"speaker":0,"text":"Unfortunately that was the week of a rail strike. It may not represent ordinary travel patterns."}],"explain":"测量细致不代表抽样周正常，罢工周不典型。","tag":"时期代表性"}]}},{"id":"festival","title":"艺术节无障碍评估","context":"Two event-management students discuss access to a student arts festival.","speakers":["Beth","Isaac","Tutor"],"singles":[{"stem":"What does Beth think the initial access plan overlooked?","options":["the cost of hiring professional artists","people who needed information in different formats","the number of available performance spaces"],"labels":["专业艺人费用","需要不同信息形式的人","演出场地数量"],"answer":1,"lines":[{"speaker":0,"text":"The plan was detailed about ramps and door widths, which are important."},{"speaker":1,"text":"But access is wider than movement through a building."},{"speaker":0,"text":"Exactly. Someone may be able to enter but be unable to use a small-print programme or follow an uncaptioned video. That part was missing."},{"speaker":2,"text":"Then broaden the plan without treating physical access as unimportant."}],"explain":"遗漏信息可及性，例子是小字节目单和无字幕视频；认可物理通行仍重要。","tag":"概念范围"},{"stem":"Why are the students dissatisfied with the ticket survey?","options":["It asks too many questions about the performances.","It reaches only people who were able to book successfully.","It allows respondents to submit answers anonymously."],"labels":["问演出内容太多","只覆盖成功买票者","允许匿名"],"answer":1,"lines":[{"speaker":1,"text":"The ticket survey has a high response rate."},{"speaker":0,"text":"Among people who completed a booking. We hear nothing from those who abandoned the website because they could not use it."},{"speaker":1,"text":"So the most relevant experiences may be absent even though the percentage looks impressive."},{"speaker":2,"text":"Correct. The anonymity is appropriate; the recruitment route is what limits the evidence."}],"explain":"高回应率建立在已成功购票的人群，漏掉被系统挡住的人；根因抽样入口。","tag":"幸存样本／分母"},{"stem":"What do both students think about the venue manager’s response?","options":["It shows that further consultation is pointless.","It is more constructive than they expected.","It transfers all responsibility to the students."],"labels":["继续咨询没意义","比预期更愿意解决","全甩给学生"],"answer":1,"lines":[{"speaker":0,"text":"I expected a defensive reaction when we listed the problems."},{"speaker":1,"text":"So did I. Instead, she asked us which two changes would have the greatest effect and offered staff time to test them."},{"speaker":0,"text":"That was much more practical than I anticipated."},{"speaker":2,"text":"It sounds like a useful basis for collaboration rather than a reason to stop consulting."}],"explain":"原预计防御性反应，实际主动问优先项并投入人手，评价为更建设性。","tag":"态度／预期反差"},{"stem":"What do they decide to evaluate before changing the booking website?","options":["whether a new logo attracts more attention","where users encounter difficulty in the booking process","which font looks most fashionable"],"labels":["新标志吸引力","预订流程卡在哪","字体时髦程度"],"answer":1,"lines":[{"speaker":1,"text":"We could redesign the whole booking page immediately."},{"speaker":0,"text":"First, watch several users try to buy a ticket and note where they get stuck."},{"speaker":1,"text":"That would tell us whether the problem is the form, the instructions or something else."},{"speaker":2,"text":"Exactly. A visual refresh alone may leave the actual barrier untouched."}],"explain":"先观察任务卡点定位真正障碍，不先以视觉翻新代替问题诊断。","tag":"下一步／问题定位"}],"multi":{"stem":"Which TWO actions do the students agree the volunteers need training in?","options":["handling requests without making assumptions","giving medical treatment independently","asking before providing assistance","repairing the venue’s sound equipment","promising that every access request can be met"],"labels":["不凭假设处理需求","独立医疗处理","协助前先询问","维修音响","保证满足一切请求"],"answers":[0,2],"lines":[{"speaker":0,"text":"One volunteer moved a visitor’s chair without asking because she thought she was helping."},{"speaker":1,"text":"Then asking before acting needs to be explicit in the training."},{"speaker":0,"text":"Agreed. Volunteers should also find out what someone actually needs rather than infer it from appearance."},{"speaker":1,"text":"Yes. Two people with the same visible difficulty may prefer different arrangements."},{"speaker":0,"text":"For medical issues or equipment faults they should contact the appropriate staff."},{"speaker":1,"text":"And explain honestly when a request needs checking. A confident promise is not useful if the venue cannot deliver it."}],"explain":"共同重点：行动前询问、了解个人真实需求而不凭外表推断。不要求代专业人员处理或无条件承诺。","tag":"共同建议／行为主体"},"matching":{"stem":"What is the main problem identified in each part of the festival experience?","options":["the wording is ambiguous","staff give inconsistent advice","the physical route is obstructed","the price is not stated clearly","the available space is insufficient","there is no alternative format","information is provided too late"],"labels":["措辞含糊","员工指引不一","通路受阻","价格不明","空间不足","缺替代形式","信息给得太晚"],"reuse":false,"items":[{"name":"Booking confirmation","answer":6,"lines":[{"speaker":1,"text":"The confirmation explains how to request accessible seating."},{"speaker":0,"text":"But it arrives after payment, when visitors needed that information before choosing a ticket. The instructions themselves are clear."}],"explain":"说明清楚但到得晚；区别时间和措辞。","tag":"时间先后"},{"name":"Venue entrance","answer":2,"lines":[{"speaker":0,"text":"The entrance has a suitable ramp."},{"speaker":1,"text":"During the festival, the queue barriers cross its landing. The access feature exists, but the temporary layout blocks the route."}],"explain":"有坡道却被临时排队栏挡住，通路受阻。","tag":"设施存在与可用"},{"name":"Programme","answer":5,"lines":[{"speaker":1,"text":"The programme lists times and prices accurately."},{"speaker":0,"text":"It is only supplied as a printed booklet with small text. There is no accessible digital or audio version."}],"explain":"缺电子可调或音频等替代形式。","tag":"格式"},{"name":"Information desk","answer":1,"lines":[{"speaker":0,"text":"One helper said a companion needed a separate ticket; another said the opposite."},{"speaker":1,"text":"We need one agreed policy and a way for staff to check it, rather than answer from memory."}],"explain":"员工政策口径矛盾，不是票价本身未列清。","tag":"信息一致性"}]}},{"id":"outreach","title":"科学传播工作坊","context":"Two science-communication students plan a workshop for school visitors.","speakers":["Anya","Finn","Tutor"],"singles":[{"stem":"What do the students want visitors to take away from the workshop?","options":["a detailed history of the laboratory","a list of scientific terms","an understanding of how a claim can be tested"],"labels":["实验室详细历史","科学术语清单","理解如何检验说法"],"answer":2,"lines":[{"speaker":0,"text":"We could introduce several useful terms, but remembering their names is not the main outcome."},{"speaker":1,"text":"I would like visitors to leave asking what evidence would support a claim and how they could check it."},{"speaker":2,"text":"That is a clear learning aim. The laboratory’s history can provide context, but keep the activity focused on testing ideas."}],"explain":"希望带走的是检验说法的思考过程，不是记术语或实验室史。","tag":"教学目标／过程"},{"stem":"Why do they reject the first demonstration?","options":["The materials are too expensive.","The scientific explanation is incorrect.","The result is impressive but leaves visitors passive."],"labels":["材料太贵","科学解释错误","虽惊艳却让观众被动"],"answer":2,"lines":[{"speaker":1,"text":"The first demonstration produces a spectacular colour change with cheap materials."},{"speaker":0,"text":"And the explanation is sound. My concern is that everyone simply watches us do it and applauds."},{"speaker":1,"text":"They never have to make a prediction or decide what to change."},{"speaker":0,"text":"Exactly. It entertains, but it gives them little opportunity to test an idea themselves."}],"explain":"展示便宜且正确，却缺观众预测和操控，偏被动观赏。","tag":"娱乐性与参与性"},{"stem":"What does Finn find difficult about the tutor’s advice?","options":["finding enough specialist vocabulary","arranging a longer teaching period","deciding how much simplification is acceptable"],"labels":["找足够专业词","安排更长时段","把握简化程度"],"answer":2,"lines":[{"speaker":2,"text":"You need language suitable for twelve-year-olds without distorting the science."},{"speaker":1,"text":"That balance is the difficult part for me. If I keep every qualification, the explanation becomes too dense; if I remove them all, it becomes misleading."},{"speaker":0,"text":"We need a short version that preserves the crucial limit."},{"speaker":2,"text":"Yes. More time or more jargon will not automatically solve that problem."}],"explain":"难在简化又不失真，保留关键限定；不是找生词或加时。","tag":"两难／概括"},{"stem":"What do both students decide about questions from visitors?","options":["ask visitors to save all questions until they leave","answer every question immediately","allow time to investigate questions they cannot answer"],"labels":["全部问题离场再问","每问立刻答","留时间探索暂不知答案的问题"],"answer":2,"lines":[{"speaker":0,"text":"What if a visitor asks something we do not know?"},{"speaker":1,"text":"We should not invent an answer just to keep the session moving. Build in time to consider how we might find out."},{"speaker":0,"text":"I like that. It actually models the approach we want them to learn."},{"speaker":2,"text":"Agreed. Questions can become part of the investigation rather than an interruption to be suppressed."}],"explain":"不知就探索求证方法，符合学习目标；不是强行即答或压到最后。","tag":"共同决定／教学方式"}],"multi":{"stem":"Which TWO features of the pilot session do both students want to retain?","options":["awarding prizes only for correct predictions","letting small groups compare different approaches","asking visitors to predict an outcome before the demonstration","using a single volunteer for the entire session","giving the complete explanation before any activity"],"labels":["只奖预测正确者","小组比较不同做法","先预测结果","全程只用一名志愿者","活动前讲完全部原理"],"answers":[1,2],"lines":[{"speaker":1,"text":"The predictions gave people a reason to watch closely, even when their guesses were wrong."},{"speaker":0,"text":"Definitely keep that. We should make it safe to change your mind, rather than reward only the correct guesses."},{"speaker":1,"text":"And when the groups tried different arrangements, comparing them started a useful discussion."},{"speaker":0,"text":"That was worth retaining too. They were using each other’s results as evidence."},{"speaker":1,"text":"The long explanation at the beginning did not work as well."},{"speaker":0,"text":"No. And we should rotate participation rather than let one confident volunteer do everything."}],"explain":"保留预测与小组方法对比；不会只奖励正确，也不让一人包办。","tag":"保留项／已有与拟改"},"matching":{"stem":"Who will take responsibility for each task?","options":["Anya","Anya and Finn together","the laboratory technician","Finn"],"labels":["Anya","两人一起","实验技术员","Finn"],"reuse":true,"items":[{"name":"Preparing the safety checklist","answer":2,"lines":[{"speaker":0,"text":"I drafted a safety checklist, but I am not qualified to approve it."},{"speaker":1,"text":"The laboratory technician said she will complete that and check the materials. We should leave the responsibility with her."}],"explain":"Anya 起草过不等于最终负责；技术员完成核验。","tag":"主体／最终责任"},{"name":"Revising the visitor handout","answer":0,"lines":[{"speaker":1,"text":"I can revise the visitor handout this evening."},{"speaker":0,"text":"You need that time for the equipment diagram. I have the feedback notes, so I will take the handout."},{"speaker":1,"text":"Thanks, then it is yours."}],"explain":"Finn 先提议，随后 Anya 接手并获确认。","tag":"改口／分工"},{"name":"Producing the equipment diagram","answer":3,"lines":[{"speaker":0,"text":"That leaves the equipment diagram with you."},{"speaker":1,"text":"Yes, I will redraw it so the groups can set up independently. Send me the final list of materials when it is checked."}],"explain":"equipment diagram 最终由 Finn 负责。","tag":"对象定位"},{"name":"Running the rehearsal","answer":1,"lines":[{"speaker":1,"text":"Should one of us run the rehearsal while the other watches?"},{"speaker":0,"text":"Let us run it together as we will on the day. We can ask two classmates to observe instead."},{"speaker":1,"text":"Agreed, we both need to practise the handovers."}],"explain":"两人共同排练，观察交给同学；分清运行和观察。","tag":"角色区分"}]}},{"id":"microgrid","title":"校园微电网方案","context":"Two energy-systems students discuss how to evaluate a campus microgrid proposal.","speakers":["Nina","Harry","Tutor"],"singles":[{"stem":"What is the main purpose of the students’ model?","options":["proving that the campus can avoid buying electricity","comparing how different designs cope with interruptions","predicting electricity prices over several decades"],"labels":["证明学校无需购电","比较不同设计应对断供","预测几十年电价"],"answer":1,"lines":[{"speaker":2,"text":"Your title mentions resilience. What does that mean in this project?"},{"speaker":0,"text":"We want to compare designs when the external supply is interrupted, not just on an ordinary day."},{"speaker":1,"text":"The model will show which essential services remain available under each design."},{"speaker":2,"text":"Good. That is more focused than a long-term price forecast or a claim of complete independence from the grid."}],"explain":"核心是断供情况下设计维持关键服务的能力，属于韧性比较。","tag":"研究目标／特殊条件"},{"stem":"Why does Harry question using average daily demand?","options":["It hides brief periods when demand is much higher.","It includes too many buildings.","It overestimates demand throughout the night."],"labels":["掩盖短时峰值","包含楼太多","整夜需求高估"],"answer":0,"lines":[{"speaker":1,"text":"Average demand looks comfortably below the system’s capacity."},{"speaker":0,"text":"That seems reassuring."},{"speaker":1,"text":"Until several laboratories start equipment at the same time. The short peak may exceed capacity even though the daily average is low."},{"speaker":2,"text":"Exactly. Your design needs to handle the pattern, not only the mean."}],"explain":"均值低却可能有短时高峰，须保留需求变化。","tag":"均值与峰值"},{"stem":"What is Nina’s view of the battery supplier’s estimate?","options":["It may be useful if its assumptions are made explicit.","It is irrelevant because the supplier is commercial.","It proves that the cheapest design is best."],"labels":["假设明确才可用","商业来源即无关","证明最便宜设计最好"],"answer":0,"lines":[{"speaker":0,"text":"The supplier’s estimate could be useful, but it assumes a particular charging pattern and replacement interval."},{"speaker":1,"text":"So we should put those assumptions into our model and see how sensitive the result is."},{"speaker":0,"text":"Yes. I would not reject it merely because a company produced it, but neither would I treat it as a guarantee."},{"speaker":2,"text":"That is a reasonable way to use the information."}],"explain":"承认商业估计有用，但条件要透明并测试敏感性。","tag":"有条件认可"},{"stem":"What do the students agree should happen before they rank the designs?","options":["remove the most expensive design from consideration","choose the design with the largest battery","define which services must keep operating"],"labels":["先删最贵方案","先选最大电池","界定哪些服务必须持续"],"answer":2,"lines":[{"speaker":1,"text":"It is tempting to rank them by storage size."},{"speaker":0,"text":"But we have not agreed what must remain running. A freezer containing research samples is different from decorative lighting."},{"speaker":1,"text":"Then first set the critical-load requirement and compare each design against it."},{"speaker":2,"text":"Exactly. Capacity and cost matter after you have defined the job the system must do."}],"explain":"先确定关键负载要求，再谈容量成本排序。","tag":"标准先于比较"}],"multi":{"stem":"Which TWO scenarios do both students think the model should include?","options":["a supply interruption during maximum demand","a permanent closure of every laboratory","an unlimited supply of free batteries","several days with unusually low solar output","a year in which all equipment is replaced at once"],"labels":["峰值需求时断供","实验室全部永久关","无限免费电池","连续低太阳能输出","全年设备同时全换"],"answers":[0,3],"lines":[{"speaker":0,"text":"Testing an interruption on a quiet Sunday would make every design look good."},{"speaker":1,"text":"We should include one when the campus is drawing the most power."},{"speaker":0,"text":"Agreed. I also want a run with several dull days in succession, rather than sunshine returning after one afternoon."},{"speaker":1,"text":"Yes, that tests whether stored energy lasts when generation remains low."},{"speaker":0,"text":"We will use realistic maintenance and purchasing assumptions."},{"speaker":1,"text":"So not a complete campus shutdown or a limitless store of replacement batteries. Those would avoid the actual problem."}],"explain":"一致支持最繁忙时断供与连续低发电两种压力情景，其他是不现实地改变问题边界。","tag":"情景条件"},"matching":{"stem":"What is the main strength of each source the students discuss?","options":["It compares a wide range of technologies.","It reports practical operating experience.","It includes independent verification.","It provides a long-term historical record.","It discusses local regulations.","It explains the underlying method clearly.","It provides detailed time-based measurements."],"labels":["技术类型广","实际运行经验","独立验证","长期历史记录","当地规章","方法说明清楚","细时间粒度测量"],"reuse":false,"items":[{"name":"Campus meter file","answer":6,"lines":[{"speaker":1,"text":"The campus meter file records demand every fifteen minutes."},{"speaker":0,"text":"That is its real value for us. We can see the morning surge rather than reconstruct it from monthly bills."}],"explain":"优势是时间粒度细，可见晨间峰值，不是年份跨度。","tag":"细粒度与长历史"},{"name":"Island case study","answer":1,"lines":[{"speaker":0,"text":"The island study covers only one system."},{"speaker":1,"text":"But it describes faults, maintenance and decisions made during real outages. That operating experience is absent from the supplier brochures."}],"explain":"范围窄但有实际故障维护经验。","tag":"比较／优势"},{"name":"Simulation paper","answer":5,"lines":[{"speaker":1,"text":"The simulation paper is older than the others."},{"speaker":0,"text":"Its step-by-step explanation makes it possible to reproduce the calculations. That clarity is why we should use it."}],"explain":"虽旧但算法步骤明晰，优势是可复现方法。","tag":"评价转折"},{"name":"Independent test report","answer":2,"lines":[{"speaker":0,"text":"The battery figures were checked by a laboratory with no connection to the manufacturer."},{"speaker":1,"text":"That external check gives them a different status from the manufacturer’s own performance claims."}],"explain":"第三方核验带来独立证据，不只是厂商自报。","tag":"证据独立性"}]}},{"id":"sleep","title":"睡眠与记忆实验","context":"Two psychology students discuss a memory study and feedback on their experimental design.","speakers":["Lena","Josh","Tutor"],"singles":[{"stem":"What relationship will the study investigate?","options":["how bedroom design affects sleep duration","how sleep timing relates to retention of newly learned material","how exercise changes people’s preferred bedtime"],"labels":["卧室设计与睡多久","睡眠时间与新学内容保持","运动与睡觉偏好"],"answer":1,"lines":[{"speaker":0,"text":"We are not simply comparing people who sleep more with people who sleep less."},{"speaker":1,"text":"We want to know whether the point at which sleep occurs after learning is related to what people remember later."},{"speaker":2,"text":"Then keep the learning-to-sleep interval central. Bedroom design and exercise may be background factors, but they are not your question."}],"explain":"研究学习后多久睡与保持的关系，区别睡眠总长。","tag":"时间维度／研究问题"},{"stem":"Why does the tutor reject their first grouping method?","options":["It would require too many participants.","It may group together differences in lifestyle and sleep timing.","It relies on equipment the department does not own."],"labels":["需要人数太多","生活方式与睡眠时间混在分组中","院系没有仪器"],"answer":1,"lines":[{"speaker":1,"text":"We planned to compare night-shift workers with students who keep regular hours."},{"speaker":2,"text":"Then occupation, stress and daily routines all differ alongside sleep timing. Which would explain a difference in memory?"},{"speaker":0,"text":"We could not separate them."},{"speaker":2,"text":"Exactly. Numbers and equipment are manageable; the grouping makes the interpretation difficult."}],"explain":"职业压力等同时变化，无法分辨睡眠时点的独立关系。","tag":"分组／混杂因素"},{"stem":"What worries Lena about the memory test?","options":["It is harder to administer online than in person.","It may favour participants who already know the subject.","It contains too few pictures."],"labels":["在线实施更难","有背景知识者占优势","图片太少"],"answer":1,"lines":[{"speaker":0,"text":"The passage is about a topic taught in the first-year course."},{"speaker":1,"text":"That should make it easier to understand."},{"speaker":0,"text":"But some participants may remember it from class rather than retain what they learn in our session."},{"speaker":2,"text":"Then you need material whose content is unfamiliar to the group. More pictures would not remove the prior-knowledge advantage."}],"explain":"题材已学过，回忆可能来自旧知识而非本轮学习，造成背景优势。","tag":"信息来源／旧知识"},{"stem":"How do both students respond to an unexpected result in the pilot?","options":["They treat it as a reason to check the procedure.","They conclude that the hypothesis has been proved wrong.","They decide to remove it from the data."],"labels":["因此检查流程","认定假说已证伪","删异常值"],"answer":0,"lines":[{"speaker":1,"text":"One participant remembered far more than anyone else."},{"speaker":0,"text":"Before interpreting that, we should check whether she had seen the material or received different instructions."},{"speaker":1,"text":"Agreed. An unusual score is a prompt to investigate, not something to delete automatically."},{"speaker":2,"text":"And one pilot result cannot settle the whole hypothesis."}],"explain":"异常触发程序核查，不直接删除也不过度定论。","tag":"异常值／证据态度"}],"multi":{"stem":"Which TWO pieces of background information do both students agree to collect?","options":["which brand of bedding participants use","participants’ favourite school subject","whether participants have encountered the learning material before","the floor on which participants live","participants’ usual sleep schedule"],"labels":["床品品牌","最喜欢学科","此前是否接触材料","居住楼层","平常睡眠时段"],"answers":[2,4],"lines":[{"speaker":0,"text":"We need to check previous exposure to the material, given what happened in the pilot."},{"speaker":1,"text":"Yes. Otherwise we may count old knowledge as new learning."},{"speaker":0,"text":"Would their favourite school subject help?"},{"speaker":1,"text":"It is too indirect. I would rather record when they normally go to bed and wake up."},{"speaker":0,"text":"Agreed. An experimental session at an unusual point in someone’s routine could affect performance."},{"speaker":1,"text":"The accommodation questions can stay out unless we have a specific reason to use them. Collecting extra details just because they are easy is not useful."}],"explain":"两人认可材料接触史与平常作息；偏好学科被认为太间接，其余无明确分析用途。","tag":"相关信息／间接代理"},"matching":{"stem":"What change do the students decide to make to each stage?","options":["make the timing more consistent","provide a clearer explanation","keep the existing procedure","obtain a second assessment","use a different task","add a prior-knowledge check","use an anonymous code"],"labels":["统一时间","讲解更清楚","保留流程","第二次评估","换任务","查先验知识","匿名编码"],"reuse":false,"items":[{"name":"Recruitment","answer":1,"lines":[{"speaker":0,"text":"Two volunteers thought they would have to stay awake overnight."},{"speaker":1,"text":"Our information sheet is not clear enough. Explain exactly what participation involves before people decide whether to join."}],"explain":"招募说明让人误会要求，先清楚解释参与内容。","tag":"误解／说明"},{"name":"Initial learning","answer":0,"lines":[{"speaker":1,"text":"Some participants began the passage immediately; others waited while we solved a technical problem."},{"speaker":0,"text":"We should start the learning period in the same way and allow the same amount of time for everyone."}],"explain":"学习启动和时长不一致，需统一时间。","tag":"操作一致性"},{"name":"Response recording","answer":6,"lines":[{"speaker":0,"text":"The response files are saved under participants’ names."},{"speaker":1,"text":"Replace those with identification numbers and keep the name list elsewhere. The person marking should not know who produced the response."}],"explain":"编码与身份分离，减少识别；不是让第二人评估。","tag":"匿名／盲评"},{"name":"Final scoring","answer":3,"lines":[{"speaker":1,"text":"We have a marking guide, but some responses are borderline."},{"speaker":0,"text":"Ask another person to score a sample independently. Agreement between markers will tell us whether the guide is working."}],"explain":"独立第二评分员检查一致性。","tag":"核验方式"}]}},{"id":"corridors","title":"野生动物通道评估","context":"Two ecology students discuss ways to study animal movement through an urban area.","speakers":["Zara","Peter","Tutor"],"singles":[{"stem":"What is the main question in the students’ project?","options":["whether a strip of habitat connects animal populations in practice","whether residents prefer parks to gardens","whether the city contains more mammals than birds"],"labels":["栖息地带是否实际连通种群","居民公园与花园偏好","哺乳类是否多于鸟"],"answer":0,"lines":[{"speaker":0,"text":"On a map, the green strip looks like a corridor between the two reserves."},{"speaker":1,"text":"But we do not yet know whether animals actually use it to move between them."},{"speaker":2,"text":"So your task is to test functional connection, rather than just identify a continuous-looking shape."},{"speaker":0,"text":"Exactly. Residents’ preferences and broad species totals would answer different questions."}],"explain":"地图看似连通不等于动物实际使用，研究功能连通性；corridor 此处是生态通道。","tag":"表面与功能"},{"stem":"Why do the students decide against relying only on sightings?","options":["A sighting does not show where an animal travelled from or to.","The species can never be seen during daylight.","Residents are unwilling to report animals."],"labels":["目击不说明来去路线","该种绝不白天出现","居民不肯上报"],"answer":0,"lines":[{"speaker":1,"text":"Residents have already sent plenty of sightings, including some made in daylight."},{"speaker":0,"text":"That tells us an animal was present at a point, but not whether it crossed from one reserve to the other."},{"speaker":1,"text":"It might have stayed within a single garden the whole time."},{"speaker":2,"text":"Then presence records are useful background, but not sufficient evidence of movement through the corridor."}],"explain":"在某点出现与穿越连接带不是同一个命题；愿意报告且有白天记录。","tag":"存在与过程"},{"stem":"What do both students think about the council’s proposed interpretation?","options":["It is possible but stronger than the current evidence allows.","It is the only reasonable explanation.","It should be rejected because officials are not researchers."],"labels":["可能成立但现有证据撑不起强结论","唯一合理解释","官员非研究者故应排除"],"answer":0,"lines":[{"speaker":0,"text":"The council describes the corridor as a proven success."},{"speaker":1,"text":"It may be working, but the current records only show animals at each end."},{"speaker":0,"text":"I agree. We should not infer that they travelled between the two points without evidence of the route."},{"speaker":2,"text":"That challenges the strength of the claim, not the council’s right to ask the question."}],"explain":"承认可能有效，但“已证明成功”超过仅两端出现的证据。","tag":"结论强度／证据缺口"},{"stem":"What do the students decide to prioritise in the pilot?","options":["checking that observations from different sites can be linked","obtaining as many photographs as possible","extending the study to every park in the city"],"labels":["不同点观察能否关联","照片数量最多","扩至全市公园"],"answer":0,"lines":[{"speaker":1,"text":"More cameras would give us more photographs."},{"speaker":0,"text":"But if their clocks disagree or we cannot identify which way an animal is moving, the extra images may not answer our question."},{"speaker":1,"text":"Then first check that records from separate points can be connected into a plausible sequence."},{"speaker":2,"text":"Exactly. Establish that before increasing the scale."}],"explain":"先验证时间和方向使多点记录可串成路线，追求数量或扩大范围为后。","tag":"关联而非堆量"}],"multi":{"stem":"Which TWO limitations do both students agree apply to the camera data?","options":["not every animal triggers the camera","the data reveal residents’ private opinions","the cameras provide no information about time","images do not necessarily identify individual animals","no photographs can be taken at night"],"labels":["并非每只动物会触发","会暴露居民私下观点","完全无时间信息","未必能识别个体","夜间无法摄影"],"answers":[0,3],"lines":[{"speaker":0,"text":"The cameras record time and work after dark, so those are useful features."},{"speaker":1,"text":"Still, a small or slow-moving animal may pass without setting one off."},{"speaker":0,"text":"Yes. Absence of a photograph does not prove absence of an animal."},{"speaker":1,"text":"And two similar-looking animals could appear at different points. We cannot always tell whether it is the same individual."},{"speaker":0,"text":"That limits the movement claims as well. We must be careful about both missed detections and uncertain identity."},{"speaker":1,"text":"We will position the cameras away from private areas; opinions would not be visible in photographs in any case."}],"explain":"两项真实局限：漏触发、个体识别不确定。相机有时间且夜间可用。","tag":"未检测≠不存在／身份"},"matching":{"stem":"What do the students decide about each proposed method?","options":["use it as proposed","do not use it in this project","use it after modification"],"labels":["照原方案用","本项目不用","修改后用"],"reuse":true,"items":[{"name":"Scent stations","answer":1,"lines":[{"speaker":1,"text":"Scent stations would attract animals to particular points."},{"speaker":0,"text":"But we want to observe the routes they choose without our intervention. Attracting them could create the very movement we claim to measure."},{"speaker":1,"text":"Then leave that method out of this project."}],"explain":"诱引会改变待研究的自然路线，本项目不用。","tag":"方法干扰"},{"name":"Camera pairs","answer":2,"lines":[{"speaker":0,"text":"Paired cameras at each crossing could show direction."},{"speaker":1,"text":"Use them, but synchronise their clocks first and check that both cover the full width of the route."},{"speaker":0,"text":"Agreed. The current setup needs those changes."}],"explain":"接受方法，但需同步时钟并调整覆盖，属于修改后用。","tag":"有条件采用"},{"name":"Existing habitat map","answer":0,"lines":[{"speaker":1,"text":"The habitat map was updated last month and uses the scale we need."},{"speaker":0,"text":"Then we can use that version directly for planning the observation points. It already meets those requirements."}],"explain":"现有新地图满足规划需要，直接用。","tag":"满足条件"},{"name":"Resident diary","answer":2,"lines":[{"speaker":0,"text":"The resident diary asks people to describe animals whenever they happen to notice them."},{"speaker":1,"text":"Keep the diary, but add agreed observation times and ask them to note when they saw nothing as well."},{"speaker":0,"text":"That will give the absence records some meaning."}],"explain":"保留但加固定观察时段和零记录，与原样用有差别。本组字母可重复。","tag":"修改／零记录"}]}}]}</script>

// The browser supplies voices. Playback errors stop the run rather than creating
// silent wrong answers. Pause resumes the current short utterance from its start.
class VoicePlayer {
 constructor(){this.synth=window.speechSynthesis;this.voices=[];this.assigned=[];this.token=0;this.watch=null;this.gap=null;this.items=[];this.index=0;this.opts=null;this.u=null;this.playing=false;this.update();if(this.synth)this.synth.addEventListener('voiceschanged',()=>{this.update();if(S.visible&&S.view==='home')renderHome();});}
 update(){try{this.voices=(this.synth?.getVoices()||[]).filter(v=>/^en([_-]|$)/i.test(v.lang));}catch(_){this.voices=[];}this.voices.sort((a,b)=>this.rank(b)-this.rank(a)||a.name.localeCompare(b.name));this.assigned=this.autoAssign();}
 rank(v){return (v.localService?7:0)+(/Natural|Premium|Enhanced/i.test(v.name)?7:0)+(/Google/i.test(v.name)?2:0)+(/en-GB/i.test(v.lang)?5:0)+(/en-AU|en-NZ/i.test(v.lang)?3:0)+(/en-US|en-CA/i.test(v.lang)?1:0);}
 available(){return Boolean(this.synth&&window.SpeechSynthesisUtterance&&this.voices.length);}
 genderHint(v,kind){const n=v.name||'';const female=/Sonia|Libby|Hazel|Serena|Samantha|Ava|Karen|Moira|Tessa|Zira|Aria|Jenny|Natasha|Emma|Susan|Female/i.test(n);const male=/Daniel|Ryan|George|Arthur|Oliver|Alex|Guy|David|James|Thomas|Mark|Male/i.test(n);return kind==='female'?(female?5:male?-2:0):(male?5:female?-2:0);}
 speakerScore(v,speaker){let score=this.rank(v);if(speaker===0){score+=this.genderHint(v,'female');if(/en-GB/i.test(v.lang))score+=4;if(/en-AU|en-NZ/i.test(v.lang))score+=2;}else if(speaker===1){score+=this.genderHint(v,'male');if(/en-AU|en-NZ/i.test(v.lang))score+=4;if(/en-GB/i.test(v.lang))score+=3;}else{score+=this.genderHint(v,'male');if(/en-GB/i.test(v.lang))score+=5;if(/en-US|en-CA/i.test(v.lang))score+=1;}return score;}
 autoAssign(){if(!this.voices.length)return [];const manual=[prefs.voiceA,prefs.voiceB,prefs.voiceT].map(n=>this.voices.find(v=>v.name===n)||null);const used=new Set(manual.filter(Boolean).map(v=>v.name));const out=[];for(let speaker=0;speaker<3;speaker++){if(manual[speaker]){out[speaker]=manual[speaker];continue;}const ranked=this.voices.filter(v=>!used.has(v.name)).sort((a,b)=>this.speakerScore(b,speaker)-this.speakerScore(a,speaker));out[speaker]=ranked[0]||this.voices[speaker%this.voices.length];if(out[speaker])used.add(out[speaker].name);}return out;}
 choose(speaker){return this.assigned[speaker]||this.voices[speaker%Math.max(1,this.voices.length)]||null;}
 naturalText(text){let t=String(text||'').trim();const rules=[[/\bdo not\b/gi,"don't"],[/\bdoes not\b/gi,"doesn't"],[/\bdid not\b/gi,"didn't"],[/\bcannot\b/gi,"can't"],[/\bwe are\b/gi,"we're"],[/\bwe have\b/gi,"we've"],[/\bI am\b/g,"I'm"],[/\bit is\b/gi,"it's"],[/\bthat is\b/gi,"that's"],[/\bthere is\b/gi,"there's"],[/\byou are\b/gi,"you're"],[/\bthey are\b/gi,"they're"]];for(const [r,x] of rules)t=t.replace(r,x);t=t.replace(/^(Well|Actually|Right|Exactly|Yes|No|So|I mean|I suppose)\s+(?![,—–])/i,'$1, ');return t;}
 hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
 profile(item){const base=[{rate:1.00,pitch:1.035},{rate:1.025,pitch:.975},{rate:.965,pitch:.94}][item.speaker]||{rate:1,pitch:1};const h=this.hash(item.text);const rateJ=((h%9)-4)*.0027,pitchJ=(((h>>>4)%7)-3)*.004;return {rate:Math.max(.78,Math.min(1.28,(Number(prefs.rate)||1)*(base.rate+rateJ))),pitch:Math.max(.82,Math.min(1.16,base.pitch+pitchJ))};}
 chunks(units){const all=[];for(const u of units){u.lines.forEach((line,li)=>{const text=this.naturalText(line.text);if(text)all.push({text,speaker:line.speaker,unitId:u.id,line:li});});}return all;}
 gapAfter(item,next){if(testing)return 4;if(!next)return 0;const unitChange=item.unitId!==next.unitId;const speakerChange=item.speaker!==next.speaker;const short=/^(Right|Exactly|Yes|No|Okay|OK|Good|True|Agreed)[,.!]?$/i.test(item.text.trim())||item.text.length<28;const q=/\?\s*$/.test(item.text);let ms=95;if(unitChange)ms=380;else if(speakerChange)ms=220;else ms=105;if(q&&speakerChange)ms+=55;if(short)ms=Math.max(90,ms-65);const jitter=(this.hash(item.text+next.text)%91)-45;return Math.max(70,ms+jitter);}
 play(units,opts){this.stop();this.items=this.chunks(units);this.index=0;this.opts=opts;this.playing=true;this.next();}
 next(){if(!this.playing||!this.opts)return;if(this.index>=this.items.length){const done=this.opts.end;this.playing=false;this.u=null;done?.();return;}if(!this.available()){this.fail('no-english-voice');return;}const item=this.items[this.index],t=this.token,u=new SpeechSynthesisUtterance(item.text),p=this.profile(item);this.u=u;u.voice=this.choose(item.speaker);u.lang=u.voice?.lang||'en-GB';u.rate=p.rate;u.pitch=p.pitch;u.volume=1;let started=false,ended=false;
  this.watch=setTimeout(()=>{if(t===this.token&&!started)this.fail('audio-start-timeout');},7000);
  u.onstart=()=>{if(t!==this.token)return;started=true;clearTimeout(this.watch);this.watch=setTimeout(()=>{if(t===this.token&&!ended)this.fail('audio-end-timeout');},Math.max(24000,item.text.length*185));this.opts?.chunk?.(item);};
  u.onend=()=>{if(t!==this.token||ended)return;ended=true;clearTimeout(this.watch);const current=this.items[this.index],next=this.items[this.index+1];this.index++;this.u=null;this.gap=setTimeout(()=>this.next(),this.gapAfter(current,next));};
  u.onerror=e=>{if(t!==this.token)return;this.fail(e.error||'audio-error');};
  try{this.synth.speak(u);}catch(_){this.fail('speech-not-available');}
 }
 fail(code){const fn=this.opts?.error;this.hold();fn?.(code);}
 hold(){this.token++;this.playing=false;clearTimeout(this.watch);clearTimeout(this.gap);try{this.synth?.cancel();}catch(_){}this.u=null;}
 resume(){this.token++;this.playing=true;this.next();}
 stop(){this.hold();this.items=[];this.index=0;this.opts=null;}
}

function goHome(){if(active()&&!confirm('退出当前训练？本轮未完成的答题不会计入完成记录。'))return;dispose();S.view='home';S.visible=true;root.hidden=false;$('#app').hidden=true;renderHome();window.scrollTo(0,0);}
function voiceOptions(selected,offset){return `<option value="">自动选择 · 说话者 ${offset+1}</option>`+audio.voices.map(v=>`<option value="${escape(v.name)}" ${v.name===selected?'selected':''}>${escape(v.name)} · ${escape(v.lang)}${v.localService?' · 本机':' · 可能联网'}</option>`).join('');}
const DIFFICULTY_PACKS={
 easy:['returns','labels','music','gardens','library','food-waste','language-app','transport'],
 normal:['heat','bees','oral-history','packaging','archaeology','coast','festival','outreach'],
