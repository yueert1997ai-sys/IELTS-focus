function activeRun(){return run&&!run.complete&&['stems','read','check','feedback','matchPreview','matchCheck'].includes(page);}
function setPage(p,scroll=true){page=p;render();if(scroll){window.scrollTo(0,0);const h=app.querySelector('h1,h2');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});}}}
function storageNotice(){return storageOK?'':`<div class="notice">浏览器未允许本地存储。页面仍可使用，但新记录可能只保留到关闭页面。</div>`;}
function render(){
 document.querySelectorAll('.navbtn').forEach(el=>el.classList.toggle('active',el.id===`nav-${['history','guide'].includes(page)?page:'home'}`));
 const views={home:renderHome,stems:renderStems,read:renderRead,check:renderCheck,feedback:renderFeedback,matchPreview:renderMatchPreview,matchCheck:renderMatchCheck,review:renderReview,history:renderHistory,guide:renderGuide};
 app.innerHTML=storageNotice()+`<div class="fade">${(views[page]||renderHome)()}</div>`;
}

 const g=chosenGroup(),isSingle=settings.kind==='single',n=isSingle?g.items.length:g.objects.length;

 const seenBefore=seen.includes(`${settings.kind}:${g.id}`);
 const groupOptions=groups().map(x=>`<option value="${esc(x.id)}" ${x.id===g.id?'selected':''}>${esc(x.title)} · ${esc(x.tag)}${seen.includes(`${settings.kind}:${x.id}`)?' · 见过':''}</option>`).join('');
 return `<section class="hero"><div><div class="eyebrow">IELTS LISTENING / SECTION 3</div><h1><span>看懂选项，</span><br>别只划重点。</h1><p>把英文留成清楚的意思。先练限时理解，再练同义表达定位。</p><div class="badges mt12"><span class="badge"><span class="dot"></span>无需打字</span><span class="badge">无音频</span><span class="badge">本地保存</span><span class="badge">140 单选 · 15 匹配组</span></div></div><aside class="hero-side" aria-label="当前训练时限"><div class="eyebrow">READING WINDOW</div><div class="hero-number">${pace}<small>SEC</small></div><p>${isSingle?'每题起始预算':'整组选项预览预算'}<br>只计阅读，不催你打字。</p></aside></section>
 <div class="setup-grid"><section class="panel"><div class="panel-head"><h2>开始一轮</h2><span class="eyebrow">01 / SETUP</span></div>
 <div class="seg" role="group" aria-label="训练类型"><button data-act="kind" data-value="single" aria-pressed="${isSingle}" class="${isSingle?'selected':''}">单选 · 理解核验</button><button data-act="kind" data-value="matching" aria-pressed="${!isSingle}" class="${!isSingle?'selected':''}">匹配 · 快速定位</button></div>
 <div class="field"><label for="group-select">本轮题组</label><div class="select-wrap"><select id="group-select" data-change="group">${groupOptions}</select></div></div>
 ${isSingle?`<div class="field"><div class="field-title">审题顺序</div><div class="seg" role="group" aria-label="审题顺序"><button data-act="mode" data-value="sequential" aria-pressed="${settings.mode==='sequential'}" class="${settings.mode==='sequential'?'selected':''}">按题推进</button><button data-act="mode" data-value="overview" aria-pressed="${settings.mode==='overview'}" class="${settings.mode==='overview'?'selected':''}">先扫全部题干</button></div><p class="hint">${settings.mode==='sequential'?'每题读完就抽查一处含义，再进入下一题。':'先用最多 10 秒扫题干，再逐题读选项并核验。预览耗时会均摊扣回各题预算。'}</p></div>`:''}
 <div class="field"><div class="field-title">${isSingle?'阅读时间 / 每题起始预算':'阅读时间 / 整组 A–G'}</div><div class="pace" role="group" aria-label="阅读时限">${(isSingle?[20,15,12]:[45,35,25]).map((p,i)=>`<button data-act="pace" data-value="${p}" aria-pressed="${pace===p}" class="${pace===p?'selected':''}"><strong>${p} 秒</strong>${['起步','日常','加压'][i]}</button>`).join('')}</div></div>
 <div class="start-zone"><button class="btn primary full" data-act="start"><span>开始${isSingle?'理解核验':'匹配定位'}</span><span aria-hidden="true">↗</span></button><div class="start-meta"><span>${n} ${isSingle?'题':'条线索'} · 总阅读预算 ${isSingle?n*pace:pace} 秒</span><span>${g.custom?'自贴题 · 仅自检':seenBefore?'已见题组 · 重做':'本机未练过'}</span></div></div>
 </section><aside class="panel side-panel"><div class="panel-head"><h2>这一轮怎么练</h2><span class="eyebrow">02 / FLOW</span></div><div class="steps">${isSingle?`
 <div class="step"><span class="step-num">1</span><div><h3>限时默读，不输入</h3><p>看清题干问什么，在脑中留下 ABC 的区别。否定、比较关系不能丢。</p></div></div>
 <div class="step"><span class="step-num">2</span><div><h3>隐藏原文，点一下核验</h3><p>${g.custom?'自贴题只问你是否分清含义，不会假装自动判懂。':'每题抽查一个选项或题干的含义。不要求把整组背下来。'}</p></div></div>
 <div class="step"><span class="step-num">3</span><div><h3>对照原文，修正误读</h3><p>记录读歪、未记住和阅读超时。无积分，也不换算成听力分数。</p></div></div>`:`
 <div class="step"><span class="step-num">1</span><div><h3>先认对象，再看 A–G</h3><p>在脑中分清每个评价的意思，不用死背选项字母。</p></div></div>
 <div class="step"><span class="step-num">2</span><div><h3>读线索，直接选字母</h3><p>英文选项始终可见。出现原创同义表达后，直接定位对应项。</p></div></div>
 <div class="step"><span class="step-num">3</span><div><h3>看正确性，也看查找耗时</h3><p>选择阶段只记录用时，不限时催答。这里不测试音频听辨。</p></div></div>`}</div>
 <div class="mini-sample"><div class="eyebrow">KEEP THE DIFFERENCE</div><p class="sample-eng">More students reached the target.</p><div class="sample-cn"><span aria-hidden="true">↳</span> 达标人数更多</div><p class="sample-rule">比较的是人数，别读成水平更高或速度更快。</p></div></aside></div>
 <div class="underbar"><span>${history.length?`已保存 ${history.length} 轮 · 最近 20 轮留在这个浏览器`:'从第一轮开始，留下可回看的记录。'}</span><button class="textbtn" data-act="history">查看记录 →</button></div>
 <p class="quiet-note">时间档位是训练参数，不是官方审题标准。${isSingle?'两种模式总预算相同，但逐题核验会打断阅读；这是局部能力训练，不模拟整段考试。':'文字匹配只能检查理解和检索，仍需用未做过的 1.0 倍速 P3 验证迁移。'}</p>
 ${isSingle?`<details class="import-box" ${importError?'open':''}><summary>粘贴自己的单选题 · 可选，仅自检</summary><p class="hint" style="margin-bottom:12px">可导入 1–10 题。每题包含题干和 A/B/C；只存本地，不自动生成语义判断。</p><textarea id="custom-input" maxlength="20000" spellcheck="false" aria-label="粘贴自己的题目" placeholder="Q1. What is the tutor’s main concern?&#10;A. The sample is too small&#10;B. The topic is too broad&#10;C. The deadline is too tight">${esc(importText)}</textarea>${importError?`<p class="error-text" role="alert">${esc(importError)}</p>`:''}<div class="row mt12"><button class="btn small" data-act="import">导入为自检题组</button><span class="quiet-note">最多保存 5 组，超出后替换最早导入的一组。</span></div></details>`:''}`;
}
function header(title,sub,count=0,total=0){return `<div class="run-header"><div><div class="eyebrow">${esc(sub)}</div><h1>${esc(title)}</h1>${total?`<div class="progress-dots" aria-label="第 ${count+1} 项，共 ${total} 项">${Array.from({length:total},(_,i)=>`<i class="${i<count?'done':i===count?'now':''}"></i>`).join('')}</div>`:''}</div><button class="btn small ghost" data-act="pause">暂停 <kbd>Esc</kbd></button></div>`;}
function timerHeader(label,tip,seconds){return `<div class="timer-surface"><div class="timer-line"><div><div class="eyebrow accent">${esc(label)}</div><p>${esc(tip)}</p></div><div class="timer-number" aria-label="剩余阅读时间"><span data-timer>${Number(seconds).toFixed(1)}</span><small>秒</small></div></div><div class="timer-track" aria-hidden="true"><div class="timer-fill" data-fill></div></div></div>`;}
function sourceOptions(options,labels=null,target=null){return `<div class="eng-options">${options.map((o,i)=>`<div class="eng-option ${target===letters[i]?'target-option':''}"><span class="letter">${letters[i]}</span><div lang="en">${esc(o)}${labels&&labels[i]?`<div class="label-cn" lang="zh-CN">${esc(labels[i])}</div>`:''}</div></div>`).join('')}</div>`;}
function renderStems(){return `<div class="run-wrap">${header(run.group.title,'OVERVIEW / 先扫题干')}${timerHeader('扫清每题问什么','这段预览也使用本轮阅读预算。',10)}<section class="reading-card"><p class="hint" style="margin:0 0 8px">只认提问对象和维度，不必翻译完整句子。</p><div class="stem-list">${run.group.items.map((q,i)=>`<div class="stem-row"><span class="q-number">${21+i}</span><span lang="en">${esc(q.stem)}</span></div>`).join('')}</div><div class="run-actions"><p>最多 10 秒；提前看完可直接进入选项。</p><button class="btn primary" data-act="finish-read">开始逐题审阅 <kbd>Enter</kbd></button></div></section></div>`;}
function renderRead(){const q=run.group.items[run.index];return `<div class="run-wrap">${header(run.group.title,`${run.mode==='overview'?'先扫全部题干':'按题推进'} / 第 ${run.index+1} 题，共 ${run.group.items.length} 题`,run.index,run.group.items.length)}${timerHeader('默读 → 脑中压缩','保留含义，不用输入中文。',run.perQuestionMs/1000)}<section class="reading-card"><div class="q-number">Q${21+run.index}</div><h2 class="english-stem" lang="en">${esc(q.stem)}</h2>${sourceOptions(q.options)}<div class="run-actions"><p>时间到会隐藏原文，再${run.custom?'自检':'抽查一处含义'}。</p><button class="btn primary" data-act="finish-read">读好了，${run.custom?'自检':'核验'} <kbd>Enter</kbd></button></div></section></div>`;}
function renderCheck(){
 const isCustom=run.custom,p=run.probe;
 const choiceButtons=isCustom?[['self-ok','题干和 ABC 的区别都能说清'],['self-unclear','有选项的意思没读懂或分不清'],['self-slow','没读完，或现在记不清了']].map((x,i)=>`<button class="answer-btn" data-act="self-answer" data-value="${x[0]}"><span class="letter">${i+1}</span><span>${esc(x[1])}</span></button>`).join(''):run.choiceOrder.map((idx,i)=>`<button class="answer-btn" data-act="single-answer" data-value="${idx}"><span class="letter">${i+1}</span><span>${esc(p.choices[idx])}</span></button>`).join('');
 return `<div class="run-wrap">${header(run.group.title,`含义${isCustom?'自检':'核验'} / 第 ${run.index+1} 题`,run.index,run.group.items.length)}<section class="check-card"><div class="check-top"><span class="badge lime">${isCustom?'自贴题 · 不自动判分':`仅抽查${p.target==='题干'?'题干':`选项 ${esc(p.target)}`}，不判原题答案`}</span><span class="badge ${run.currentRead.expired?'orange':''}">${run.currentRead.expired?'阅读时间已到':'主动结束阅读'}</span></div><h2>${isCustom?'原文已隐藏，你分清意思了吗？':p.target==='题干'?'刚才的题干，具体在问什么？':`刚才选项 ${esc(p.target)} 的完整意思是？`}</h2><p class="sub">${isCustom?'按真实感受选择，随后回看原文。':'选意思，不选最短标签。作答不占阅读预算。'}</p><div class="answer-list">${choiceButtons}</div><div class="skip-line"><p class="quiet-note">${isCustom?'这是自报结果，不与内置题的语义核验合并。':'每题只抽查一处，不代表其他选项都已读懂。记不清就如实记录，不必猜。'}</p>${isCustom?'':`<button class="btn ghost small" data-act="single-unknown">没记住 / 没读完 <kbd>0</kbd></button>`}</div></section></div>`;
}
function outcome(r){return ({correct:['答对','lime'],wrong:['答错','red'],unknown:['未记住',''], 'self-ok':['自报看懂',''], 'self-unclear':['自报不清','red'],'self-slow':['自报未完成','red']})[r.status]||['已记录',''];}
function resultSource(r){return `<div class="source-block"><div class="eyebrow">${run?.kind==='matching'?'ORIGINAL OPTIONS':'BACK TO THE ORIGINAL'}</div><p class="english-stem mt12" lang="en">${esc(r.stem)}</p>${sourceOptions(r.options,r.labels,r.target)}<p class="source-caption">${r.custom?'自贴题没有自动语义核验，请自行对照题干与选项。':r.cue?'以上标签是选项含义；本轮匹配关系仅属于这条原创文字线索。':'中文是参考释义，不要求按这个字数记忆，也没有给原题选择 A/B/C 的听力答案。'}</p></div>`;}
function renderFeedback(){
 const r=currentResult,kind=run.kind,label=outcome(r),isSelf=r.status.startsWith('self-');
 const state=isSelf?'unknown':r.status==='correct'?'correct':r.status==='wrong'?'wrong':'unknown';
 const statusText=isSelf?'已记录':r.status==='correct'?'答对了':r.status==='wrong'?'答错了':'没记住';
 const icon=r.status==='correct'?'✓':r.status==='wrong'?'✕':'•';
 const title=isSelf?'自检已记录，回看原文确认。':r.status==='correct'?(kind==='matching'?'这条线索定位正确。':'这处含义理解正确。'):r.status==='unknown'?(kind==='matching'?'这次没定位到，先看差别。':'没记住已单独记录，不算误读。'):'这里读歪了，记住下面这个区别。';
 const lead=isSelf?'自行核对：题干问谁、问哪一阶段？ABC 的否定、比较和对象有没有丢？':r.note;
 const correction=!isSelf&&r.status==='wrong'?`<p class="correct-answer"><strong>正确理解：</strong>${esc(r.correctText)}</p>`:'';
 return `<div class="run-wrap">${header(run.group.title,`本题复盘 / ${run.index+1} / ${kind==='single'?run.group.items.length:run.cues.length}`,run.index,kind==='single'?run.group.items.length:run.cues.length)}<section class="check-card feedback-card ${state}"><div class="feedback-status ${state}"><span class="feedback-icon">${icon}</span><span>${statusText}${kind==='matching'?` · ${sec(r.responseMs)} 秒`:''}</span></div><div class="feedback-label ${r.status==='wrong'?'wrong':r.status==='unknown'?'unknown':''}">${label[0]}</div><h2 class="feedback-summary">${title}</h2>${r.status==='wrong'?`<p class="chosen-wrong"><strong>你选了：</strong>${esc(r.selectedText)}</p>`:''}${correction}${!isSelf&&r.status!=='wrong'?`<p class="feedback-note"><strong style="color:var(--ink)">${esc(r.correctText)}</strong><br>${esc(lead)}</p>`:`${!isSelf?`<p class="feedback-note">${esc(lead)}</p>`:`<p class="feedback-note">${esc(lead)}</p>`}`}${r.cue?`<p class="sample-eng mt20" lang="en">${esc(r.cue)}</p>`:''}${resultSource(r)}<div class="run-actions"><p>${kind==='single'?`本题阅读 ${sec(r.readingMs)} 秒${r.expired?' · 用尽阅读时限':''}`:'只记录文字定位，不代表音频听懂。'}</p><button class="btn primary" data-act="next">${run.index+1>=(kind==='single'?run.group.items.length:run.cues.length)?'查看本轮复盘':'下一题'} <kbd>Enter</kbd></button></div></section></div>`;
}
function objectChips(current=-1){return `<div class="object-grid" aria-label="本组对象">${run.group.objects.map((o,i)=>`<div class="object-chip ${current===i?'current':''}"><small>Q${27+i}</small><span lang="en">${esc(o)}</span></div>`).join('')}</div>`;}
function renderMatchPreview(){return `<div class="run-wrap">${header(run.group.title,'MATCHING / 对象 → A–G')}${timerHeader('先认对象，再分清选项','标签只留在脑中，不用记住字母顺序。',run.pace)}<section class="reading-card matching-preview">${objectChips()}<h2 class="sr-only">匹配选项</h2>${sourceOptions(run.group.options)}<div class="run-actions"><p>随后保留英文 A–G，出现原创文字线索。</p><button class="btn primary" data-act="finish-read">开始匹配 <kbd>Enter</kbd></button></div></section></div>`;}
function renderMatchCheck(){const c=run.cues[run.index];return `<div class="run-wrap">${header(run.group.title,`同义表达定位 / 第 ${run.index+1} 条，共 ${run.cues.length} 条`,run.index,run.cues.length)}${objectChips(c.object)}<div class="match-layout"><section class="cue-card"><div class="eyebrow accent">READ THE CUE</div><h2 class="match-stem" lang="en">${esc(run.group.objects[c.object])}</h2><p class="cue-text" lang="en">${esc(c.phrase)}</p><p class="quiet-note">直接找对应项，不必先完整翻译成中文。选择阶段不限时，只记录点击用时。</p></section><section aria-label="选择对应的英文选项"><div class="match-status"><span>原选项保留可见</span><span>点选或按 A–G</span></div><div class="match-answers">${run.group.options.map((o,i)=>`<button class="answer-btn" data-act="match-answer" data-value="${i}"><span class="letter">${letters[i]}</span><span lang="en">${esc(o)}</span></button>`).join('')}</div><button class="btn ghost small full mt12" data-act="match-unknown">暂时找不到，记录这一条 <kbd>0</kbd></button></section></div></div>`;}
function stat(value,label,cls=''){return `<div class="stat"><div class="value ${cls}">${value}</div><div class="label">${esc(label)}</div></div>`;}
function renderReview(){
 const r=run.record,rs=r.results,correct=rs.filter(x=>x.status==='correct').length,wrong=rs.filter(x=>x.status==='wrong').length,unknown=rs.filter(x=>x.status==='unknown').length,md=median(rs.filter(x=>x.status==='correct').map(x=>x.responseMs));
 const stats=r.kind==='matching'?stat(`${correct}<small>/ ${rs.length}</small>`,'文字线索匹配吻合','lime')+stat(md===null?'—':`${sec(md)}<small>秒</small>`,'正确条目的定位中位用时')+stat(`${sec(r.readingMs)}<small>秒</small>`,'整组预览用时')+stat(`${wrong+unknown}`,'需修正或未定位'):
 r.custom?stat(`${rs.length}`,'完成自检题数','lime')+stat(`${rs.filter(x=>x.status==='self-ok').length}`,'自报看懂')+stat(`${rs.filter(x=>x.status!=='self-ok').length}`,'自报不清或未完成')+stat(`${sec(r.readingMs)}<small>秒</small>`,'本轮实际阅读用时'):
 stat(`${correct}<small>/ ${rs.length}</small>`,'抽查含义吻合','lime')+stat(`${wrong}`,'含义需要修正')+stat(`${unknown}`,'未记住 / 没读完')+stat(`${sec(r.readingMs)}<small>秒</small>`,'含题干预览的阅读用时');
 return `<div class="summary-head"><div class="eyebrow accent">SESSION COMPLETE / 本轮结束</div><h1>看看卡在了哪一步。</h1><p>${esc(r.groupTitle)} · ${r.kind==='matching'?'匹配定位':r.mode==='overview'?'先扫全部题干':'按题推进'} · ${r.pace} 秒档</p><div class="badges mt12"><span class="badge ${r.seenBefore?'orange':'lime'}">${r.seenBefore?'已见题组 · 重做':'本机首次接触'}</span>${r.pauses?`<span class="badge orange">暂停 ${r.pauses} 次 · 不纳入模式对比</span>`:''}${r.custom?'<span class="badge">自报结果，不做客观判断</span>':''}${r.kind==='single'?`<span class="badge">${rs.filter(x=>x.expired).length} 题用尽阅读时限</span>`:''}</div></div>
 <div class="stats">${stats}</div><p class="quiet-note">${r.kind==='matching'?'没有音频。这些结果只说明你对文字线索的理解和选项检索情况，不能换算听力分数。':r.custom?'自检结果不能证明理解正确。自贴题没有内置的语义验证，需自己逐项核对。':'每题只抽查一处含义，未抽查部分不代表已读懂。阅读超时与答错分别记录，不用速度抵消理解错误。'}</p>

function renderGuide(){return `<div class="eyebrow accent">HOW TO USE / 不必先上课</div><h1 class="page-title">练到能用，就够了。</h1><p class="lede">这里练的是选项理解与检索，不提供音频、不测听力分数。每天用一小段时间，别把做工具变成逃避听力。</p><div class="guide-grid"><section class="panel"><h2>单选：脑中压缩，点选核验</h2><p>读题干和 ABC，只留能区分选项的意思。<strong>否定、比较、对象与时间不能丢。</strong>没有字数上限。</p><p>原文隐藏后，每题抽查一处含义；不记得就按“没记住”。之后回看全部选项和参考释义。</p><p>先用 15 秒档。觉得来不及，可用 20 秒；12 秒只作为加压练习，不是合格标准。</p></section><section class="panel"><h2>两种顺序：预算公平，结论克制</h2><p><strong>按题推进：</strong>一题读完并核验，再读下一题。</p><p><strong>先扫题干：</strong>最多先看 10 秒全部题干，实际预览用时均摊扣回各题预算。例如 5 题、15 秒档，共 75 秒；预览用 10 秒，各题剩 13 秒。</p><p>核验和复盘不占阅读预算。这是逐题小练习，不模拟整段考试；不要把它的模式比较当作考场方法定论。</p></section><section class="panel"><h2>匹配：读到意思，直接找字母</h2><p>先认 Q27–Q30 的对象，再看 A–G。文字线索出现后，原英文选项仍可见，直接点对应项。</p><p>不用强行先想起完整中文。程序记录定位时间，但不倒计时催答。</p><p>用未做过的正常语速 P3 检查迁移：选项误读有没有少，找答案是否拖延，下一题是否跟丢。</p></section><section class="panel"><h2>操作与数据</h2><p>全程不用输入答案。只有导入自有题时需要粘贴；自贴题只做自检，不会假装自动理解文本。</p><div class="keyrow"><span><kbd>Enter</kbd> 结束阅读 / 下一题</span><span><kbd>1–3</kbd> 含义核验</span><span><kbd>A–G</kbd> 匹配</span><span><kbd>0</kbd> 未记住 / 未定位</span><span><kbd>Esc</kbd> 暂停</span></div><p>Tab 可切换按钮，Enter 选择聚焦项。离开标签页时自动暂停并隐藏原文；暂停记录不参与模式对比。</p><p>最近 20 轮存本地，可导出 JSON。无登录、无联网请求、无跨设备同步。</p></section></div><button class="btn primary mt28" data-act="home">返回训练</button>`;}

function stopClock(){if(clock?.raf)cancelAnimationFrame(clock.raf);if(clock)clock.active=false;}
function startClock(ms,kind){stopClock();clock={active:true,kind,duration:ms,remaining:ms,deadline:performance.now()+ms,raf:0};clock.raf=requestAnimationFrame(tickClock);}
function clockRemaining(){return clock?Math.max(0,clock.active?clock.deadline-performance.now():clock.remaining):0;}
function tickClock(){if(!clock?.active||paused)return;const rem=clockRemaining();clock.remaining=rem;app.querySelectorAll('[data-timer]').forEach(x=>x.textContent=(rem/1000).toFixed(1));app.querySelectorAll('[data-fill]').forEach(x=>x.style.width=`${Math.max(0,Math.min(100,rem/clock.duration*100))}%`);app.querySelector('.timer-surface')?.classList.toggle('urgent',rem<=5000);if(rem<=0){finishReading(true);return;}clock.raf=requestAnimationFrame(tickClock);}
function startRun(forceGroup=null){
 stopClock();clearPause();const g=forceGroup||chosenGroup();const kind=settings.kind,pace=kind==='single'?settings.singlePace:settings.matchPace;const key=`${kind}:${g.id}`;
 run={id:uid(),kind,group:g,mode:settings.mode,pace,index:0,results:[],startedAt:new Date().toISOString(),seenBefore:seen.includes(key),pauses:0,previewMs:0,readingMs:0,custom:!!g.custom,perQuestionMs:pace*1000,complete:false};
 if(!seen.includes(key)){seen.push(key);seen=seen.slice(-1000);save(KEYS.seen,seen);}
 persistSettings();
 if(kind==='matching'){run.cues=g.cues.map(c=>({...c,phrase:c.phrases[Math.floor(Math.random()*c.phrases.length)]}));setPage('matchPreview');startClock(pace*1000,'matchPreview');}
 else if(run.mode==='overview'){setPage('stems');startClock(Math.min(10000,g.items.length*pace*1000),'stems');}
 else beginRead();
}
function beginRead(){run.currentRead=null;setPage('read');startClock(run.perQuestionMs,'read');}
function finishReading(expired=false){
 if(!run||paused||!clock||!['read','stems','matchPreview'].includes(page))return;
 const phase=page,used=Math.min(clock.duration,Math.max(0,clock.duration-clockRemaining()));stopClock();clock=null;
 if(phase==='stems'){run.previewMs=used;run.readingMs+=used;run.perQuestionMs=Math.max(1000,(run.group.items.length*run.pace*1000-used)/run.group.items.length);beginRead();return;}
 if(phase==='matchPreview'){run.previewMs=used;run.previewExpired=expired;run.readingMs+=used;beginMatch();return;}
 run.currentRead={used,expired};run.readingMs+=used;
 if(!run.custom){const checks=run.group.items[run.index].checks;run.probe=checks[Math.floor(Math.random()*checks.length)];run.choiceOrder=shuffle([0,1,2]);}
 setPage('check');run.responseStart=performance.now();speak(expired?'阅读时间到。原文已隐藏，请核验含义。':'原文已隐藏，请核验含义。');
}
function answerSingle(index){
 if(page!=='check'||run.custom||paused)return;const q=run.group.items[run.index],p=run.probe;
 const status=index===null?'unknown':index===p.correct?'correct':'wrong';
 currentResult={stem:q.stem,options:q.options,labels:q.labels,target:p.target,status,selectedText:index===null?'':p.choices[index],correctText:p.choices[p.correct],note:p.note,readingMs:run.currentRead.used,expired:run.currentRead.expired,responseMs:Math.max(0,performance.now()-run.responseStart),custom:false};
 run.results.push(currentResult);setPage('feedback');speak(outcome(currentResult)[0]);
}
function answerSelf(status){if(page!=='check'||!run.custom||paused)return;const q=run.group.items[run.index];currentResult={stem:q.stem,options:q.options,labels:null,target:null,status,selectedText:({'self-ok':'题干和 ABC 的区别都能说清','self-unclear':'有选项的意思没读懂或分不清','self-slow':'没读完，或现在记不清了'})[status],correctText:'',note:'',readingMs:run.currentRead.used,expired:run.currentRead.expired,responseMs:Math.max(0,performance.now()-run.responseStart),custom:true};run.results.push(currentResult);setPage('feedback');}
function beginMatch(){setPage('matchCheck');run.responseStart=performance.now();}
function answerMatch(index){if(page!=='matchCheck'||paused)return;const c=run.cues[run.index],g=run.group;currentResult={stem:g.objects[c.object],object:c.object,cue:c.phrase,options:g.options,labels:g.labels,target:letters[c.correct],status:index===null?'unknown':index===c.correct?'correct':'wrong',selectedText:index===null?'':`${letters[index]}. ${g.options[index]}`,correctText:`${letters[c.correct]}. ${g.options[c.correct]}`,note:c.note,readingMs:0,expired:false,responseMs:Math.max(0,performance.now()-run.responseStart),custom:false};run.results.push(currentResult);setPage('feedback');speak(outcome(currentResult)[0]);}
function nextQuestion(){if(page!=='feedback'||paused)return;run.index++;if(run.index>=(run.kind==='single'?run.group.items.length:run.cues.length)){completeRun();return;}if(run.kind==='single')beginRead();else beginMatch();}
function completeRun(){stopClock();run.complete=true;run.record={id:run.id,version:APP_VERSION,kind:run.kind,groupId:run.group.id,groupTitle:run.group.title,level:run.group.tag?.startsWith('进阶')?'contrast':'basic',mode:run.mode,pace:run.pace,startedAt:run.startedAt,completedAt:new Date().toISOString(),seenBefore:run.seenBefore,pauses:run.pauses,previewMs:run.previewMs,readingMs:run.readingMs,custom:run.custom,results:run.results};history=[run.record,...history].slice(0,20);save(KEYS.history,history);setPage('review');}
function pauseRun(reason='manual'){
 if(!activeRun()||paused)return;paused=true;run.pauses++;pauseStart=performance.now();lastFocus=document.activeElement;
 if(clock){clock.remaining=clockRemaining();stopClock();}

 document.getElementById('overlay').innerHTML=`<div class="pause-overlay"><section class="pause-modal" role="dialog" aria-modal="true" aria-labelledby="pause-title"><div class="eyebrow accent">PAUSED / 原文已隐藏</div><h2 id="pause-title">${reason==='visibility'?'离开页面，已自动暂停。':'停一下，计时也停了。'}</h2><p>恢复后继续剩余时间。本轮会带暂停标记，不纳入两种模式的比较。</p><button class="btn primary full" data-act="resume" id="resume-btn">继续本轮 <kbd>Esc</kbd></button><button class="btn ghost full small mt12" data-act="abandon">结束并返回首页</button></section></div>`;

function clearPause(){paused=false;document.body.classList.remove('paused');app.inert=false;document.getElementById('overlay').innerHTML='';}

function navigate(dest){if(activeRun()){if(!confirm('本轮尚未完成，返回会放弃本轮结果。确定返回吗？'))return;}stopClock();clearPause();setPage(dest);}
function parseCustom(text){
 if(typeof text!=='string'||!text.trim())throw new Error('先粘贴题目内容。');if(text.length>20000)throw new Error('内容过长，请每次导入 1–10 题。');
 const lines=text.replace(/\r/g,'').split('\n');let current=null,currentOption=-1,items=[];let ignoreExtra=false;
 for(let raw of lines){const line=raw.trim();if(!line)continue;
 const qm=line.match(/^(?:Q\s*)?(\d{1,3})\s*[.．、:：)）]\s*(.+)$/i)||line.match(/^Q\s*(\d{1,3})\s+(.+)$/i);
 if(qm){if(current)items.push(current);current={stem:qm[2].trim(),options:['','',''],labels:null,checks:[]};currentOption=-1;ignoreExtra=false;continue;}
 if(!current)continue;
 const om=line.match(/^([ABC])\s*[.．、:：)）]\s*(.+)$/i)||line.match(/^([ABC])\s+(.+)$/i);
 if(om){currentOption=om[1].toUpperCase().charCodeAt(0)-65;if(current.options[currentOption])throw new Error(`第 ${items.length+1} 题的 ${om[1].toUpperCase()} 选项重复。`);current.options[currentOption]=om[2].trim();ignoreExtra=false;continue;}
 if(/^(参考|参考压缩|标签|轴|答案|解析|answer|reference)\s*[:：]/i.test(line)){ignoreExtra=true;continue;}
 if(ignoreExtra)continue;
 if(currentOption>=0)current.options[currentOption]+=' '+line;else current.stem+=' '+line;
 }
 if(current)items.push(current);
 if(!items.length)throw new Error('没识别到题号。请按 Q1. 题干 / A. … / B. … / C. … 分行粘贴。');
 if(items.length>10)throw new Error(`识别到 ${items.length} 题。每次最多导入 10 题，请分组粘贴。`);
 items.forEach((q,i)=>{const missing=q.options.map((o,j)=>o?'':letters[j]).filter(Boolean);if(missing.length)throw new Error(`第 ${i+1} 题缺少 ${missing.join(' / ')} 选项，请补全再导入。`);if(q.stem.length>1200||q.options.some(o=>o.length>1800))throw new Error(`第 ${i+1} 题内容过长，请检查换行和题号。`);});
 return items;
}
function importQuestions(){try{const items=parseCustom(importText),g={id:'custom-'+uid(),title:`自贴题 ${new Date().toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'})} · ${items[0].stem.slice(0,24)}${items[0].stem.length>24?'…':''}`,tag:`自检 · ${items.length} 题`,custom:true,items};custom=[g,...custom].slice(0,5);save(KEYS.custom,custom);settings.kind='single';settings.singleGroup=g.id;persistSettings();importError='';importText='';render();window.scrollTo(0,0);toast(`已导入 ${items.length} 题。这组只做自检，不自动判断语义。`);}catch(e){importError=e.message;render();app.querySelector('details.import-box')?.scrollIntoView({block:'nearest'});}}

function nextGroup(){settings.kind=run.kind;const all=groups(run.kind),others=all.filter(g=>g.id!==run.group.id);const fresh=others.filter(g=>!seen.includes(`${run.kind}:${g.id}`));const pool=fresh.length?fresh:others;if(!pool.length){toast('目前没有其他题组，请返回首页选择或导入。');return;}const g=pool[Math.floor(Math.random()*pool.length)];if(run.kind==='single')settings.singleGroup=g.id;else settings.matchGroup=g.id;startRun(g);}

document.addEventListener('click',e=>{

 switch(act){

document.addEventListener('keydown',e=>{
 if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||e.isComposing)return;
 if(paused){if(e.key==='Escape'){e.preventDefault();resumeRun();}else if(e.key==='Tab'){const btns=[...document.querySelectorAll('#overlay button')];const first=btns[0],last=btns.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}
 if(['TEXTAREA','INPUT','SELECT'].includes(document.activeElement?.tagName))return;
 if(e.key==='Escape'&&activeRun()){e.preventDefault();pauseRun();return;}
 const k=e.key.toUpperCase();
 if(page==='check'&&['1','2','3'].includes(k)){e.preventDefault();if(run.custom)answerSelf(['self-ok','self-unclear','self-slow'][Number(k)-1]);else answerSingle(run.choiceOrder[Number(k)-1]);return;}
 if(page==='check'&&k==='0'&&!run.custom){e.preventDefault();answerSingle(null);return;}
 if(page==='matchCheck'&&/^[A-G1-7]$/.test(k)){e.preventDefault();answerMatch(/^[1-7]$/.test(k)?Number(k)-1:letters.indexOf(k));return;}
 if(page==='matchCheck'&&k==='0'){e.preventDefault();answerMatch(null);return;}
 if(e.key==='Enter'){
  if(document.activeElement?.tagName==='BUTTON'||document.activeElement?.tagName==='SUMMARY')return;
  if(['stems','read','matchPreview'].includes(page)){e.preventDefault();finishReading(false);}
  else if(page==='feedback'){e.preventDefault();nextQuestion();}
 }
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&activeRun())pauseRun('visibility');});
window.addEventListener('pagehide',()=>{stopClock();});
render();

<script type="application/json" id="preload-data">{"version":"3.2.0","authorship":"Original material written for S3 Focus. Not official IELTS questions. Difficulty and synthetic voices are not calibrated to an IELTS band.","packs":[{"id":"heat","title":"街区降温研究","context":"Two geography students discuss a study of summer temperatures with their tutor.","speakers":["Nora","Sam","Tutor"],"singles":[{"stem":"What is the main purpose of the students’ investigation?","options":["to compare the cost of different cooling measures","to predict how hot the city will become","to explain temperature differences within one neighbourhood"],"labels":["比较降温成本","预测未来高温","解释同区温差"],"answer":2,"lines":[{"speaker":2,"text":"Before you settle on the equipment, remind me what you want the study to establish."},{"speaker":0,"text":"We originally considered forecasting next summer, but that would need data we cannot obtain."},{"speaker":1,"text":"Now we want to understand why two streets a few minutes apart can feel so different on the same afternoon."},{"speaker":2,"text":"Good. You can discuss practical measures later, but an economic comparison would be a separate project."}],"explain":"相邻街道同一时刻却冷热不同，研究要解释这种差异。预测已被放弃；措施成本属于另一个项目。保留“解释”这个动作。","tag":"研究目的／旧计划排除"},{"stem":"Why does the tutor question their first sampling plan?","options":["The sites are unsafe after dark.","There are too many sites to visit.","The selected sites are too similar."],"labels":["夜间不安全","地点数量太多","地点差异不足"],"answer":2,"lines":[{"speaker":0,"text":"We have selected eight streets near the student residences."},{"speaker":2,"text":"Eight is manageable. My concern is that every one has tall buildings and very little vegetation."},{"speaker":1,"text":"So even accurate readings might not tell us what trees contribute?"},{"speaker":2,"text":"Exactly. Include streets with contrasting amounts of shade. You will be taking measurements in daylight, so the evening security issue does not arise."}],"explain":"导师认可八个点的数量，担心全是高楼少绿植，缺乏对比。因此问题在样本差异，不在数量或安全。","tag":"概括／比较维度"},{"stem":"What surprises Sam about the preliminary readings?","options":["The greatest contrast occurs after sunset.","The shaded pavement is warmer than the grass.","The equipment gives inconsistent results."],"labels":["日落后温差最大","阴影路面比草地热","仪器读数不一致"],"answer":0,"lines":[{"speaker":1,"text":"I expected the biggest gap at midday, when the sun was strongest."},{"speaker":0,"text":"The readings from the grass and the pavement were different then, certainly."},{"speaker":1,"text":"Yes, but they separated much more in the evening. One surface was releasing stored heat long after the sun had gone."},{"speaker":2,"text":"That is worth following up. You checked the instruments side by side beforehand, so it is unlikely to be a faulty sensor."}],"explain":"对比的是一天中的时间：原以为正午最大，实际傍晚更大。提到草地和路面只是对比对象，未给出 A 的特定高低关系。","tag":"预期与实际／时间"},{"stem":"What do the students agree to do before collecting more data?","options":["ask residents to record temperatures","change the position of some sensors","borrow more sensitive instruments"],"labels":["让居民记录","调整部分传感器位置","换更灵敏仪器"],"answer":1,"lines":[{"speaker":0,"text":"A resident has offered to keep a diary of how hot her flat feels."},{"speaker":1,"text":"Useful background, but first we need to move the sensors that sit beside air-conditioning outlets."},{"speaker":0,"text":"Agreed. Otherwise we may be measuring the hot air coming from the buildings rather than the street itself."},{"speaker":2,"text":"The instruments are sensitive enough. Correcting where they are placed is your immediate priority."}],"explain":"先把靠近空调排风口的仪器挪开，概括为调整放置位置。居民日记只是背景材料；仪器灵敏度被认可。","tag":"共同决定／优先级"}],"multi":{"stem":"Which TWO limitations do both students accept should be mentioned in their report?","options":["They excluded privately owned gardens.","They could not obtain residents’ permission.","Their sensors were not properly calibrated.","The sample contained no paved surfaces.","They collected data during only one season."],"labels":["未纳入私人花园","未获居民许可","仪器未校准","没测铺装地面","只测一个季节"],"answers":[0,4],"lines":[{"speaker":0,"text":"We should be quite open about the limits of the study. We only worked in late summer."},{"speaker":1,"text":"Yes. We cannot say that the pattern holds in winter as well."},{"speaker":0,"text":"And the green spaces were all public ones. We had no measurements from people’s back gardens."},{"speaker":1,"text":"That matters too. Those could behave differently from the park."},{"speaker":0,"text":"Shall we mention calibration? I worried about it initially."},{"speaker":1,"text":"The laboratory checked every sensor before we started, so I would not call that a limitation."},{"speaker":0,"text":"True. We also had permission for every location we used, and plenty of paved areas."},{"speaker":1,"text":"Then let us concentrate on the seasonal coverage and the missing type of green space."}],"explain":"两人明确共同认可：只覆盖夏末、没有私人花园。校准和许可均已解决，铺装地面实际包含在样本内。两个答案各有独立证据。","tag":"双方同意／已解决干扰"},"matching":{"stem":"What change does the tutor recommend for each part of the presentation?","options":["shorten it","make the terminology simpler","add a comparison","include a visual explanation","remove it completely","identify a limitation","move it to a later point"],"labels":["缩短","简化术语","补对比","加图示","删除","指出局限","后移"],"reuse":false,"items":[{"name":"Introduction","answer":1,"lines":[{"speaker":0,"text":"For the introduction, we have a slide defining the urban heat island."},{"speaker":2,"text":"Keep the idea, but imagine explaining it to someone outside geography. Expressions such as thermal inertia will lose them immediately."},{"speaker":1,"text":"So ordinary language rather than more definitions."}],"explain":"内容保留，换成非专业听众能懂的话。不是删掉引言或简单压缩时长。","tag":"具体例子→概括"},{"name":"Methods","answer":3,"lines":[{"speaker":1,"text":"The methods slide is a paragraph about the sensor positions."},{"speaker":2,"text":"A simple street cross-section would let the audience see the height and distance at once. The paragraph can then become your speaking notes."},{"speaker":0,"text":"We will draw that rather than add more text."}],"explain":"用街道剖面图说明传感器位置，对应图示说明。","tag":"建议／呈现方式"},{"name":"Results","answer":2,"lines":[{"speaker":0,"text":"Our results show the temperature curve for the square."},{"speaker":2,"text":"On its own, that is difficult to interpret. Put the curve from the tree-lined street beside it, using the same scale."},{"speaker":1,"text":"Then people can see the contrast directly."}],"explain":"两条曲线并排且用同一刻度，概括为增加比较。","tag":"关系概括"},{"name":"Recommendations","answer":5,"lines":[{"speaker":1,"text":"We finish by recommending more trees throughout the city."},{"speaker":2,"text":"You can make that suggestion, but be clear about how little area you actually studied. The evidence does not cover every district."},{"speaker":0,"text":"We should state how far the findings can reasonably be applied."}],"explain":"强调证据的适用范围有限，对应指出局限；导师没有要求删建议。","tag":"范围限定"}]}},{"id":"returns","title":"服装退货调查","context":"Two business students review research on clothing returns for a coursework report.","speakers":["Leah","Ben","Tutor"],"singles":[{"stem":"Why did Leah and Ben decide to investigate clothing returns?","options":["They had noticed a mismatch between sales and customer satisfaction.","There was little published research on clothing retailers.","Their employer asked them to do it."],"labels":["销售与满意度不一致","相关研究很少","雇主安排"],"answer":0,"lines":[{"speaker":1,"text":"My manager was happy to share figures, but she did not suggest the project."},{"speaker":0,"text":"It came from that puzzle in our seminar. A retailer can sell more garments while receiving more complaints and returns."},{"speaker":1,"text":"Exactly. We wanted to understand why higher sales do not necessarily mean happier customers."},{"speaker":0,"text":"There is actually a substantial literature, so we have enough to compare our findings with."}],"explain":"销量增长不等于客户更满意，这个矛盾触发选题。经理只同意分享资料；文献不少。","tag":"选题原因／词汇 garments"},{"stem":"What was the main problem with their first questionnaire?","options":["It took customers too long to complete.","It assumed that every return was caused by a fault.","It did not ask where the garments had been bought."],"labels":["填写过久","预设退货都是质量问题","漏问购买渠道"],"answer":1,"lines":[{"speaker":2,"text":"Did the pilot questionnaire work?"},{"speaker":0,"text":"People completed it quickly, and everyone gave the store or website they had used."},{"speaker":1,"text":"But our first question asked what was wrong with the item. Some customers said nothing was wrong; they had ordered several sizes on purpose."},{"speaker":2,"text":"Then your wording has already decided the explanation. Make room for reasons that have nothing to do with defective goods."}],"explain":"问“商品哪里有问题”预设了缺陷，漏掉主动买多码再退的情况。根因是问题带假设；用时和渠道信息正常。","tag":"措辞偏差／概括"},{"stem":"What does Ben find most useful about the interviews?","options":["They confirm that the shop records are accurate.","They provide a larger sample.","They reveal the sequence of customers’ decisions."],"labels":["证明店铺数据准确","扩大样本","揭示决策先后过程"],"answer":2,"lines":[{"speaker":1,"text":"The interviews involve far fewer people than the survey, but I would not drop them."},{"speaker":0,"text":"Is that because we can check the shop’s figures?"},{"speaker":1,"text":"Not really. They let us follow what a customer was thinking before ordering, on receiving the parcel, and when deciding to send it back."},{"speaker":2,"text":"That process could explain patterns that a single tick on a form cannot."}],"explain":"访谈价值在追踪购买前、收货后、退货时的决策过程，不能概括成样本更多或核验统计。","tag":"具体过程→概括"},{"stem":"What do they agree about the tutor’s criticism of their draft?","options":["It points to a genuine weakness in their argument.","It overlooks evidence they included.","It is too severe for a preliminary report."],"labels":["指出论证真实缺陷","忽略已有证据","对初稿过于苛刻"],"answer":0,"lines":[{"speaker":0,"text":"When she said our conclusion went beyond the evidence, I thought she was being harsh."},{"speaker":1,"text":"I did too at first. But we interviewed customers from just one chain and wrote as if every retailer worked that way."},{"speaker":0,"text":"Reading it again, that is exactly what we did. Her point is fair, even if it was uncomfortable to hear."},{"speaker":1,"text":"We should narrow the claim rather than defend it."}],"explain":"最初觉得 harsh，后来承认概括过度，最终认可批评。题问共同最终看法，不能锁在最初的不满。","tag":"态度变化／harsh 与 fair"}],"multi":{"stem":"Which TWO changes do the students agree to make to their analysis?","options":["compare online and in-store purchases separately","distinguish intended returns from unplanned returns","exclude customers who returned more than one item","calculate the profit of each retailer","combine all reasons for returning clothing into one category"],"labels":["网购实体分开比较","区分计划内外退货","排除退多件顾客","计算各店利润","合并全部退货原因"],"answers":[0,1],"lines":[{"speaker":0,"text":"We currently put purchases from websites and physical shops into one table."},{"speaker":1,"text":"Separate those. The chance to try something on beforehand changes the decision."},{"speaker":0,"text":"Yes, I agree. We should also separate people who always intended to send some sizes back from people who changed their minds later."},{"speaker":1,"text":"Definitely. Otherwise two quite different behaviours look identical."},{"speaker":0,"text":"Would removing customers with several returns make the figures cleaner?"},{"speaker":1,"text":"Cleaner perhaps, but misleading. They are part of what we are studying."},{"speaker":0,"text":"And profits?"},{"speaker":1,"text":"We do not have reliable cost data. Keep the individual reasons for return, but leave profitability for another study."}],"explain":"共同决定：按购买渠道拆开、按是否预先计划退货拆开。多次退货者要保留，退货原因不合并，也不做利润分析。","tag":"双方认可／分类维度"},"matching":{"stem":"What issue do the students identify with each source of information?","options":["It is difficult to obtain.","It uses a narrow definition.","It contains conflicting figures.","It gives no explanation of how data were collected.","It covers too short a period.","It is no longer current.","It describes a different market."],"labels":["难取得","定义过窄","数字冲突","未交代收集方法","时间跨度短","资料过时","市场不同"],"reuse":false,"items":[{"name":"Trade association report","answer":1,"lines":[{"speaker":0,"text":"The trade association has a large sample."},{"speaker":1,"text":"Yes, but it counts a return only when the customer receives cash. Exchanges and store credit disappear from its totals."},{"speaker":0,"text":"That definition is too restrictive for our question."}],"explain":"只把现金退款计为退货，定义过窄；样本大不能补这个缺陷。","tag":"范围限定"},{"name":"Shop transaction file","answer":4,"lines":[{"speaker":1,"text":"The shop sent us the transaction file without any trouble."},{"speaker":0,"text":"Unfortunately it contains only the fortnight before a public holiday. We cannot tell whether those weeks were typical."},{"speaker":1,"text":"We need a longer view."}],"explain":"容易获得，但只有假日前两周的数据，问题在时间跨度。","tag":"时间范围"},{"name":"Consumer blog","answer":3,"lines":[{"speaker":0,"text":"The consumer blog has striking percentages about unwanted clothes."},{"speaker":1,"text":"But there is no survey description, no recruitment information, nothing explaining where the numbers came from."},{"speaker":0,"text":"So we cannot assess the basis for them."}],"explain":"没有解释数据如何产生，对应方法不透明，不等于已证实数字互相冲突。","tag":"证据来源"},{"name":"International study","answer":6,"lines":[{"speaker":1,"text":"The international study is recent and very detailed."},{"speaker":0,"text":"Its shoppers pay a fee for every return, though. Here most returns are free, which changes the incentives completely."},{"speaker":1,"text":"We should not assume the behaviour transfers directly."}],"explain":"另一市场的退货收费制度不同，可比性受限；不是时间过时。","tag":"背景条件对比"}]}},{"id":"bees","title":"校园传粉昆虫调查","context":"Two biology students discuss a fieldwork project and feedback from their supervisor.","speakers":["Aisha","Tom","Supervisor"],"singles":[{"stem":"What are the students mainly trying to find out?","options":["which flower species attract the widest range of pollinators","how many bee colonies live on campus","whether students can identify insects accurately"],"labels":["花种与访花昆虫多样性","校园蜂群数量","学生识虫准确性"],"answer":0,"lines":[{"speaker":2,"text":"What will you count during the survey?"},{"speaker":0,"text":"Visits to different flowers, but not simply the total number of insects."},{"speaker":1,"text":"We want to know which plantings draw a more varied set of visitors, including species other than bees."},{"speaker":2,"text":"Good. You are not estimating colony numbers, and training observers is preparation rather than the research question."}],"explain":"研究对象是不同花种吸引的访客多样性；不是蜂群总数或观察员培训效果。","tag":"目的／数量与种类"},{"stem":"Why do they decide to change the observation times?","options":["Their supervisor is unavailable in the morning.","The campus closes earlier than expected.","Weather conditions need to be more comparable."],"labels":["导师早晨无空","校园关门早","天气条件更可比"],"answer":2,"lines":[{"speaker":0,"text":"Last week I watched the flower beds on a bright morning and you went out during an overcast afternoon."},{"speaker":1,"text":"That makes the counts difficult to compare. The insects may have reacted to the conditions rather than the flowers."},{"speaker":0,"text":"Let us both go out in the same time window and record cloud cover as well."},{"speaker":2,"text":"Sensible. Access is available all day, and you do not need me beside you for every count."}],"explain":"统一时段并记录云量是为了减少环境条件差异；门禁和导师时间均不是原因。","tag":"因果／控制变量"},{"stem":"How does Aisha feel about using photographs to identify insects?","options":["annoyed that the necessary equipment is expensive","concerned that photography may alter what they observe","confident that photographs will solve every identification problem"],"labels":["器材太贵而不满","拍摄可能改变观察对象行为","照片能解决全部识别问题"],"answer":1,"lines":[{"speaker":1,"text":"We could photograph anything we cannot name and identify it later."},{"speaker":0,"text":"That would help, and our phones are good enough. I am just worried we may lean so close that the insects leave the flower."},{"speaker":1,"text":"So taking a picture could change the visit we are trying to record."},{"speaker":0,"text":"Exactly. Useful, but we need to keep our distance."}],"explain":"她认可照片用途且手机够用，担心靠近会吓走昆虫。因此是观察本身干扰行为，不是设备成本。","tag":"态度／保留意见"},{"stem":"What does the supervisor advise them to do first?","options":["practise applying the same recording rules","begin writing the final discussion","collect another week of field observations"],"labels":["先统一记录规则","开始写讨论","再测一周"],"answer":0,"lines":[{"speaker":2,"text":"Before you expand the survey, watch a short patch together and record independently."},{"speaker":1,"text":"To increase the sample?"},{"speaker":2,"text":"No. Compare what each of you counted as a separate visit. If your rules differ, more data will simply give you more inconsistency."},{"speaker":0,"text":"Then we should resolve those differences before going out separately again."}],"explain":"共同观察再比记录，目的是统一“单次访问”的判断标准。增加数据量是后续，不能把手段误读成增样本。","tag":"建议／动作目的"}],"multi":{"stem":"Which TWO findings do both students regard as unexpected?","options":["The largest flowers received the most visits.","No insects visited in cloudy weather.","A less colourful planting attracted more types of insect.","Some small insects stayed longer than bees.","The busiest flower bed contained only native plants."],"labels":["大花访问最多","阴天完全无访客","不艳丽花坛虫种更多","部分小虫停留比蜂久","最繁忙花坛只有本地植物"],"answers":[2,3],"lines":[{"speaker":0,"text":"I assumed bees would spend the longest on each flower."},{"speaker":1,"text":"So did I. Several of those tiny flies remained there well after the bees had moved on."},{"speaker":0,"text":"That really surprised me. The other thing was the plain-looking bed beside the laboratory."},{"speaker":1,"text":"Yes, it supported more different kinds of visitor than the bright display near the gate. I would have predicted the opposite."},{"speaker":0,"text":"The big flowers had plenty of visits, but that was what we expected."},{"speaker":1,"text":"And we still counted insects under cloud, just fewer of them."},{"speaker":0,"text":"We cannot call the busy bed entirely native either. It included plants from several regions."}],"explain":"两人明确意外的是小虫停留更久、朴素花坛吸引更多种类。大花客流多符合预期；阴天零访客和全本地植物均不成立。","tag":"共同惊讶／数量与多样性"},"matching":{"stem":"What action is agreed for each element of the project?","options":["exclude the data","keep it unchanged","seek specialist advice","simplify the instructions","increase the sample","repeat a reliability check","replace the equipment"],"labels":["剔除数据","保持不变","问专家","简化说明","增加样本","重做一致性检查","换器材"],"reuse":true,"items":[{"name":"Insect identification guide","answer":2,"lines":[{"speaker":0,"text":"Two flies look identical in our guide."},{"speaker":1,"text":"Guessing would be risky. Dr Patel works on that family, so let us ask her to confirm the features."},{"speaker":0,"text":"Agreed, we need someone who knows that group."}],"explain":"识别问题请专业人员判断，对应寻求专家意见。","tag":"同义概括"},{"name":"Volunteer instruction sheet","answer":3,"lines":[{"speaker":1,"text":"The volunteers struggled with our instruction sheet."},{"speaker":0,"text":"The procedure itself is straightforward. We should replace the technical terms and split the long sentences."},{"speaker":1,"text":"Yes, there is no need to change the procedure."}],"explain":"改词句降低阅读难度，不改调查程序。","tag":"措辞与内容区分"},{"name":"West lawn observations","answer":0,"lines":[{"speaker":0,"text":"The west lawn was sprayed while the observations were taking place."},{"speaker":1,"text":"Then those counts cannot be treated like the others. Leave that set out of the comparison."},{"speaker":0,"text":"We will explain why in the methods section."}],"explain":"喷洒作业影响观察，整组排除并解释原因。","tag":"排除决定"},{"name":"Rare insect record","answer":2,"lines":[{"speaker":1,"text":"One photograph might show a species not previously recorded here."},{"speaker":0,"text":"Before we make that claim, send it to the county entomologist."},{"speaker":1,"text":"Yes. An expert should verify it, just as with the difficult flies."}],"explain":"又一次专家核验；本组允许字母重复，不能因为前面用过就排除。","tag":"匹配可重复"}]}},{"id":"oral-history","title":"社区口述史项目","context":"Two history students plan interviews with former workers and discuss the structure of their project.","speakers":["Ella","Marcus","Tutor"],"singles":[{"stem":"Why have the students narrowed the period covered by their project?","options":["The tutor has reduced the permitted word count.","They want accounts that can be compared more closely.","The archive contains nothing from earlier years."],"labels":["字数限制减少","叙述便于互相比较","早期资料缺失"],"answer":1,"lines":[{"speaker":0,"text":"We first planned to cover the factory’s entire history, from opening to closure."},{"speaker":1,"text":"But someone who worked there in the sixties experienced a different workplace from someone who joined thirty years later."},{"speaker":0,"text":"By focusing on the final decade, we can compare accounts of the same events."},{"speaker":2,"text":"Good. The word limit has not changed, and the archive does have older material. This is a decision about comparability."}],"explain":"缩短历史区间使受访者谈论同一批事件；档案缺失和字数变化都被排除。","tag":"研究范围／原因"},{"stem":"What is Marcus’s concern about the first interview?","options":["The recording was too quiet to understand.","The participant could not remember important dates.","Ella introduced interpretations before the participant had finished."],"labels":["录音太轻","受访者记不清日期","访谈者过早引导解释"],"answer":2,"lines":[{"speaker":1,"text":"The recording is clear, and Mr Ward was remarkably precise about dates."},{"speaker":0,"text":"I thought it went well overall."},{"speaker":1,"text":"It did, but when he described the closure you suggested that he must have felt betrayed. He had not said that himself."},{"speaker":0,"text":"So I gave him an interpretation instead of leaving space for his own."},{"speaker":1,"text":"That is the bit we should avoid next time."}],"explain":"访谈者先抛出“被背叛”的解释，可能引导回答。受访者日期准确、录音清楚。","tag":"主体／引导性措辞"},{"stem":"What do both students think about conflicting memories?","options":["They make the interviews unsuitable as evidence.","They may reveal differences in how events were experienced.","They should be corrected using the most detailed account."],"labels":["冲突使访谈不可用","反映事件经历不同","用最详尽叙述纠正"],"answer":1,"lines":[{"speaker":0,"text":"Two workers describe the same meeting in completely different ways."},{"speaker":1,"text":"That does not necessarily mean one account is useless. One was a manager and the other was about to lose his job."},{"speaker":0,"text":"So the contrast may tell us how their positions shaped the experience."},{"speaker":1,"text":"Exactly. We should examine it, not silently replace the shorter account with the longer one."}],"explain":"两人认为叙述冲突可能反映身份和经历差异，应分析，不应抹掉或只留最长版本。","tag":"双方态度／解释层次"},{"stem":"What will Ella do immediately after the meeting?","options":["contact a potential interviewee","prepare a public exhibition","revise the consent form"],"labels":["联系受访者","准备公开展览","修改知情同意书"],"answer":2,"lines":[{"speaker":2,"text":"Have you considered how the recordings might be used after marking?"},{"speaker":0,"text":"We would like an exhibition eventually, but the form only mentions the coursework."},{"speaker":1,"text":"Then people have not agreed to public use."},{"speaker":0,"text":"I will correct the paperwork first and send it to you. I can contact the next participant once that is approved."}],"explain":"先修改授权用途的表格，再联系下一位受访者；展览是远期可能，题问紧接着做什么。","tag":"时间顺序／立即行动"}],"multi":{"stem":"Which TWO benefits of working with the local archive do the students agree on?","options":["It will carry out all the interviews for them.","It can introduce them to people they would otherwise miss.","It can help them interpret unfamiliar workplace terms.","It removes the need for participants’ consent.","It guarantees that all memories are accurate."],"labels":["档案馆代做全部访谈","找到原本接触不到的人","解释行业旧术语","省去受访者同意","保证所有记忆准确"],"answers":[1,2],"lines":[{"speaker":0,"text":"The archivist knows retired workers who are not in the online community group."},{"speaker":1,"text":"That is a real advantage. Otherwise our recruitment would miss them entirely."},{"speaker":0,"text":"She also understood the old workshop expressions that puzzled us."},{"speaker":1,"text":"Yes, she can explain what those jobs and machines were. That will help us understand the accounts."},{"speaker":0,"text":"But she cannot verify every memory just because she knows the factory."},{"speaker":1,"text":"No, and we still have to conduct the interviews ourselves."},{"speaker":0,"text":"We will also obtain consent from each person, even when the archive makes the introduction."}],"explain":"共同支持招募补盲区与解释旧行业术语。档案馆不能保证记忆完全准确，也不代替访谈或授权。","tag":"共同认可／绝对化干扰"},"matching":{"stem":"What does the tutor recommend for each section of the report?","options":["separate description from interpretation","include a contrasting account","reduce the amount of detail","explain an ethical decision","give more historical context","add quantitative evidence","move material to an appendix"],"labels":["分清描述和解读","加对照叙述","减少细节","解释伦理决定","补历史背景","加量化证据","移到附录"],"reuse":false,"items":[{"name":"Recruitment","answer":3,"lines":[{"speaker":0,"text":"In recruitment, we say we did not approach two workers suggested by the manager."},{"speaker":2,"text":"Explain that you wanted to avoid making anyone feel pressured to participate. Readers need to understand the reason for that choice."}],"explain":"解释不接触某些人的自愿参与考量，属于伦理决定。","tag":"决定背后的理由"},{"name":"Factory closure","answer":1,"lines":[{"speaker":1,"text":"The closure section uses the manager’s interview."},{"speaker":2,"text":"Put a shop-floor worker’s description beside it. The difference in viewpoint is central to your project, so readers should see both."}],"explain":"同一事件补上另一立场叙述，属于对照。","tag":"立场比较"},{"name":"Daily routines","answer":2,"lines":[{"speaker":0,"text":"Daily routines currently runs to six pages."},{"speaker":2,"text":"The minute-by-minute account is more than the argument needs. Keep one representative example and cut the repeated descriptions."}],"explain":"保留一个例子减少重复细节；没有要求移到附录。","tag":"缩减与移动区分"},{"name":"Memories of supervision","answer":0,"lines":[{"speaker":1,"text":"We describe supervisors as hostile throughout this section."},{"speaker":2,"text":"Show which words come from the workers and which are your own conclusions. At present the evidence and your reading of it are mixed together."}],"explain":"受访者说法与作者解读混在一起，需要区分描述证据和解释。","tag":"主体归属"}]}},{"id":"labels","title":"博物馆标签改写","context":"Two design students evaluate exhibition labels as part of a visitor-experience project.","speakers":["Ruth","Daniel","Tutor"],"singles":[{"stem":"What led the students to question the existing labels?","options":["Visitors complained mainly about the size of the print.","Visitors spent little time looking at the objects.","Visitors could read the labels but often misunderstood their point."],"labels":["主要抱怨字号小","观众看展品时间短","读得出却误解重点"],"answer":2,"lines":[{"speaker":0,"text":"We initially assumed that making the lettering bigger would solve the problem."},{"speaker":1,"text":"But most visitors could read the words. When we asked what a label was telling them, their explanations often missed the main idea."},{"speaker":0,"text":"Some stayed with an object for several minutes, so it was not simply a lack of attention."},{"speaker":2,"text":"Then your project should address understanding, rather than treating this as a printing problem."}],"explain":"能辨认文字，却解释不出重点，问题是理解。看得久和读得清都不等于懂标签。","tag":"现象→概括／理解与识字"},{"stem":"What does the tutor dislike about their first revision?","options":["It removes an important uncertainty.","It uses too many quotations.","It gives too much information about the artist."],"labels":["删掉关键不确定性","引用太多","艺术家信息过量"],"answer":0,"lines":[{"speaker":1,"text":"Our new label says the bowl was used in a religious ceremony."},{"speaker":2,"text":"Does the evidence establish that?"},{"speaker":0,"text":"The original says it may have been used that way. We removed may because the sentence sounded cleaner."},{"speaker":2,"text":"That changes the claim. Simpler language must not make a possibility sound like a fact. The short quotation and artist details can remain."}],"explain":"删除 may 把可能变成确定，导师反对的是抹掉不确定性；不是反对引用或作者资料。","tag":"程度限定／可能与确定"},{"stem":"What surprised Daniel during the visitor trial?","options":["Children rejected all the interactive elements.","Experts needed longer explanations than other visitors.","Adults preferred labels intended for younger visitors."],"labels":["儿童拒绝互动","专家需要更长解释","成人更偏爱儿童版"],"answer":2,"lines":[{"speaker":1,"text":"The label we wrote for school groups was the one most adults chose as well."},{"speaker":0,"text":"I did not expect that either. They said it got to the point without assuming they knew the technical vocabulary."},{"speaker":1,"text":"The children enjoyed the interactive elements, as we had hoped."},{"speaker":2,"text":"Interesting. You did not recruit enough specialists to make a separate claim about experts."}],"explain":"意外在成人偏爱原本面向学生的版本。儿童喜欢互动符合预期；专家样本不够。","tag":"意外结果／对象"},{"stem":"How will the students measure the success of the revised labels?","options":["by counting how many labels visitors read","by asking staff which wording they prefer","by checking what visitors can explain afterwards"],"labels":["统计阅读标签数","询问员工措辞偏好","检查读后能解释什么"],"answer":2,"lines":[{"speaker":0,"text":"We could count how many people stop at each label."},{"speaker":1,"text":"That tells us it attracts attention, not whether it communicates the idea."},{"speaker":0,"text":"Then let us ask visitors to explain one point in their own words after they have moved on."},{"speaker":2,"text":"That fits your aim. Staff preferences may be useful feedback, but they are not your main success measure."}],"explain":"读后用自己的话解释，直接检验理解；停留次数检验吸引力，员工喜好也不等于理解效果。","tag":"评价标准／不同指标"}],"multi":{"stem":"Which TWO principles do both students want to follow when rewriting the labels?","options":["keep every label to exactly the same length","avoid mentioning disagreement among researchers","connect unfamiliar ideas with everyday experience","replace all technical vocabulary with pictures","make the relationship between objects clear"],"labels":["标签字数完全相同","避谈研究分歧","陌生概念联系日常经验","全部术语用图替换","说明展品之间关系"],"answers":[2,4],"lines":[{"speaker":1,"text":"For unfamiliar processes, an everyday comparison would help. We could relate casting to pouring something into a mould at home."},{"speaker":0,"text":"Yes, as long as the comparison is accurate."},{"speaker":1,"text":"And the labels should explain why neighbouring objects are displayed together."},{"speaker":0,"text":"I agree. At present each reads as though it belongs in a separate room."},{"speaker":1,"text":"Would identical lengths make the design cleaner?"},{"speaker":0,"text":"Perhaps, but some ideas need more explanation than others."},{"speaker":1,"text":"So we keep useful technical terms and explain them, rather than replacing everything with images."},{"speaker":0,"text":"And where researchers disagree, we should say so briefly instead of pretending the issue is settled."}],"explain":"一致认可日常类比和展品间关联。拒绝所有标签同字数、全用图代替术语和掩盖分歧。","tag":"双方赞同／绝对词"},"matching":{"stem":"What is the main weakness of each trial label?","options":["too much repeated information","missing chronological information","unclear reference to an object","an unsupported claim","poor visual contrast","unexplained specialist language","an unsuitable tone"],"labels":["信息重复","缺时间顺序","展品指代不明","断言无依据","视觉对比不足","专业词未解释","语气不合适"],"reuse":false,"items":[{"name":"Bronze mirror","answer":2,"lines":[{"speaker":0,"text":"The mirror label says this item was copied widely, but two objects sit directly underneath it."},{"speaker":1,"text":"So people cannot tell which one this item refers to. The wording needs to identify the mirror precisely."}],"explain":"this item 指哪件不清楚；不是事实错误或字号问题。","tag":"代词指向"},{"name":"Weaving tools","answer":5,"lines":[{"speaker":1,"text":"The weaving label uses warp and weft without explanation."},{"speaker":0,"text":"Those are useful terms, but someone new to the subject cannot follow the process unless we define them."}],"explain":"问题是专业词缺解释。","tag":"术语缺口"},{"name":"Ceramic vessel","answer":3,"lines":[{"speaker":0,"text":"This label calls the vessel the first of its kind in the region."},{"speaker":1,"text":"Yet the catalogue only calls it an early example. We do not have evidence for the stronger claim."}],"explain":"early 被夸成 first，超出证据。","tag":"程度升级"},{"name":"Workshop photograph","answer":1,"lines":[{"speaker":1,"text":"The photograph label mentions the workshop opening, moving and closing."},{"speaker":0,"text":"But without dates, visitors cannot work out the order. A short timeline would fix that."}],"explain":"关键缺年代和先后，图表是解决手段，不是主问题。","tag":"时间线"}]}},{"id":"music","title":"背景音乐与学习","context":"Two psychology students discuss a classroom experiment with their supervisor.","speakers":["Mina","Alex","Supervisor"],"singles":[{"stem":"What question is the experiment designed to answer?","options":["whether background music affects different kinds of task differently","whether older students study for longer periods","which music students enjoy most while studying"],"labels":["音乐对不同任务影响是否不同","年长学生是否学更久","最喜欢哪种学习音乐"],"answer":0,"lines":[{"speaker":2,"text":"Are you simply comparing music with silence?"},{"speaker":0,"text":"That is part of it, but our main interest is whether the effect changes with the task."},{"speaker":1,"text":"Someone might solve a visual puzzle comfortably with music but struggle to remember a spoken passage."},{"speaker":2,"text":"Good. Preferences and study duration can be background information; they are not your main comparison."}],"explain":"重点是音乐效果是否随任务类型而变；不是音乐偏好或学习时长。","tag":"差异轴／任务类型"},{"stem":"Why are the students changing the order of the tasks?","options":["They need to separate practice effects from music effects.","The first task proved too difficult.","Participants asked to choose their own order."],"labels":["分开练习效应和音乐效应","首项过难","参与者想自选顺序"],"answer":0,"lines":[{"speaker":1,"text":"Everyone did the quiet condition first in the pilot."},{"speaker":0,"text":"So when scores improved in the music condition, they might simply have been getting used to the task."},{"speaker":1,"text":"We should give half the participants the conditions in the opposite order."},{"speaker":2,"text":"Exactly. The difficulty was suitable, and letting people choose would introduce another source of variation."}],"explain":"后做得好可能是熟练了，调换顺序为了区分练习与音乐影响。","tag":"解释原因／混杂因素"},{"stem":"What is Mina’s view of the preliminary results?","options":["They justify a general recommendation to play music.","They are interesting but cannot yet support a strong conclusion.","They show that the experiment should be abandoned."],"labels":["足以普遍建议放音乐","有意思但结论暂不宜太强","应放弃实验"],"answer":1,"lines":[{"speaker":0,"text":"The difference is larger than I expected, which is encouraging."},{"speaker":1,"text":"Can we say music improves concentration, then?"},{"speaker":0,"text":"Not yet. We only tested twelve people, and several already knew the puzzle. I would treat it as a reason to investigate further."},{"speaker":2,"text":"That is a sensible level of caution. Nothing here requires you to abandon the study."}],"explain":"结果鼓舞人但样本小且熟题，Mina 建议继续研究，不支持普遍结论，也不放弃。","tag":"态度／有限支持"},{"stem":"What do they decide about the recordings used in the experiment?","options":["remove instrumental music from the test","keep the volume consistent across conditions","use music selected separately by each participant"],"labels":["删去器乐","各条件音量一致","各人自选音乐"],"answer":1,"lines":[{"speaker":1,"text":"Should people bring their own tracks? That might feel more natural."},{"speaker":0,"text":"But preferences would vary along with the sound. Let us use the same recordings, including the instrumental piece."},{"speaker":1,"text":"And make sure one track is not louder than the other."},{"speaker":0,"text":"Yes. Otherwise a volume difference could be mistaken for an effect of the music itself."}],"explain":"共同决定控制音量并使用统一曲目；自带曲目只是被否定的提议，器乐保留。","tag":"建议被否／最终决定"}],"multi":{"stem":"Which TWO practical problems do both students say remain unresolved?","options":["recruiting enough people who have not tried the puzzle","deciding how to anonymise completed records","obtaining permission to recruit students","preventing participants from hearing the instructions early","finding a room with sufficiently low background noise"],"labels":["招够没做过拼图的人","确定匿名方式","取得学生招募许可","防止提前听说明","找足够安静的房间"],"answers":[0,4],"lines":[{"speaker":0,"text":"We have approval to recruit, and the supervisor accepted our numbering system for anonymous records."},{"speaker":1,"text":"Good. The room is still a problem, though. Traffic outside was audible even with the windows shut."},{"speaker":0,"text":"Yes, we need somewhere quieter. There is also the question of finding enough people who have never seen the puzzle."},{"speaker":1,"text":"That is still difficult. Too many volunteers took the introductory class where it was used."},{"speaker":0,"text":"At least instructions will now play through individual headphones."},{"speaker":1,"text":"So nobody can overhear them before their turn. The location and the unfamiliar participants are the two things left to sort out."}],"explain":"题问仍未解决：场地噪音与没接触过任务的参与者不足。许可、匿名编号、提前听说明均已解决。","tag":"未解决限定／问题状态"},"matching":{"stem":"What does the supervisor suggest doing with each part of the experiment?","options":["remove it","leave it as planned","test it with a small group first","make the scoring more objective","record additional background information","add a control measure","shorten it"],"labels":["删除","按原计划","先小规模试测","评分更客观","补背景信息","加控制措施","缩短"],"reuse":false,"items":[{"name":"Written instructions","answer":2,"lines":[{"speaker":0,"text":"We have rewritten the written instructions."},{"speaker":2,"text":"Before the main experiment, give them to three people who know nothing about the task. Check that they all interpret them as you intend."}],"explain":"先让少数新人试读，属于小规模试测。","tag":"试测"},{"name":"Free-response task","answer":3,"lines":[{"speaker":1,"text":"We planned to rate the free responses as good, average or poor."},{"speaker":2,"text":"That depends too much on your impression. Specify which points earn marks so that another marker could obtain the same score."}],"explain":"制定可重复评分标准，对应提高客观性。","tag":"标准与印象"},{"name":"Participant form","answer":4,"lines":[{"speaker":0,"text":"The form records age and course."},{"speaker":2,"text":"Also ask about musical training. A person who has studied an instrument may respond differently, and you will want to know that later."}],"explain":"增补音乐训练经历是参与者背景变量。","tag":"信息归类"},{"name":"Break between tasks","answer":1,"lines":[{"speaker":1,"text":"The five-minute break seems generous. Should we cut it?"},{"speaker":2,"text":"No. It worked in the pilot and allows people to reset. Keep that interval exactly as you proposed."}],"explain":"明确保留原间隔；不能被学生的 cut 提议带走。","tag":"建议归属"}]}},{"id":"packaging","title":"可持续包装设计","context":"Two engineering students review a packaging prototype with their tutor.","speakers":["Clara","Jules","Tutor"],"singles":[{"stem":"What was the students’ original priority in designing the package?","options":["making it look expensive","making it easy to reuse","reducing the amount of material"],"labels":["显得高档","易重复使用","减少材料用量"],"answer":2,"lines":[{"speaker":2,"text":"Take me back to your first design brief."},{"speaker":0,"text":"We began by trying to use as little material as possible while still protecting the contents."},{"speaker":1,"text":"Reuse became important later, after the customer interviews. Appearance was never our main concern."},{"speaker":2,"text":"Then distinguish the starting priority from the goals you added as the project developed."}],"explain":"original 限定最初：减材料。再利用是后来加入的目标，不要拿最终版本回答最初目标。","tag":"最初与后来"},{"stem":"Why did the first prototype fail the transport test?","options":["The outer material absorbed water.","The package was heavier than allowed.","The internal supports moved out of position."],"labels":["外壳吸水","超重","内部支撑移位"],"answer":2,"lines":[{"speaker":1,"text":"The outer shell stayed dry throughout the test, and the total weight was comfortably within the limit."},{"speaker":0,"text":"But the folded inserts slipped sideways when the box was shaken. The product could then strike the wall."},{"speaker":2,"text":"So the weakness was how the contents were held in place, not the shell itself."},{"speaker":0,"text":"Exactly. We need the supports to remain fixed."}],"explain":"内衬侧滑导致物品失去固定，映射到内部支撑移位；外壳和重量正常。","tag":"部件主体"},{"stem":"What does Clara find surprising about the customer feedback?","options":["Customers pay most attention to colour.","Customers prefer a simpler opening mechanism.","Customers want a larger package."],"labels":["颜色最受关注","更偏爱简单开法","想要更大包装"],"answer":1,"lines":[{"speaker":0,"text":"I thought people would appreciate the clever locking tabs."},{"speaker":1,"text":"They certainly noticed them."},{"speaker":0,"text":"Yes, but they preferred the version with one plain flap. Several said they should not need to work out how to open a box."},{"speaker":2,"text":"So technical ingenuity was not what they valued there."},{"speaker":1,"text":"And they did not ask for extra space or different colours."}],"explain":"注意到巧妙锁扣不等于喜欢，用户反而更爱单翻盖。","tag":"关注与认可区分"},{"stem":"What do the students agree to do next?","options":["test the revised supports before changing the exterior","redesign the exterior and interior simultaneously","order materials for a large production run"],"labels":["先测新支撑再改外观","内外同时重做","订大批材料"],"answer":0,"lines":[{"speaker":1,"text":"We could redesign the outside while we fix the inserts."},{"speaker":0,"text":"Then if performance changes, we will not know which alteration caused it."},{"speaker":1,"text":"Fair point. Let us keep the shell and trial the new supports first."},{"speaker":2,"text":"That is a controlled next step. A large material order would be premature until you have those results."}],"explain":"先单独测内部改动，避免同时改变太多因素。大批量采购太早。","tag":"行动顺序／控制变量"}],"multi":{"stem":"Which TWO environmental claims do both students think their evidence supports?","options":["The package can be recycled in every country.","The package produces no carbon emissions.","The new design uses less material per package.","The new design reduces empty space during delivery.","The material breaks down rapidly in seawater."],"labels":["全球都能回收","零碳排放","每件材料更少","运输空隙更少","海水中快速降解"],"answers":[2,3],"lines":[{"speaker":0,"text":"We can demonstrate a reduction in material because we weighed both designs for the same product."},{"speaker":1,"text":"Yes, that claim is solid. And the revised shape lets us fit more units into the same shipping container."},{"speaker":0,"text":"So less of the load is empty space. We can support that with the packing trial."},{"speaker":1,"text":"The supplier calls the material recyclable, but local facilities differ."},{"speaker":0,"text":"Then we cannot say everywhere. Nor have we measured total carbon emissions."},{"speaker":1,"text":"Certainly not zero. And a soil-composting result tells us nothing about how it behaves in the sea."}],"explain":"可支持材料减量、运输空间效率。可回收范围、全生命周期碳排放、海水降解都无足够证据。","tag":"证据边界／绝对化"},"matching":{"stem":"What is the tutor’s main comment on each section of the report?","options":["The illustrations are unnecessary.","The claim needs qualifying.","The figures need checking.","The method needs explaining.","The section is complete.","The comparison is unfair.","The sequence needs changing."],"labels":["插图多余","结论需限定","数字需核对","方法需解释","本节完成","比较不公平","顺序需改"],"reuse":false,"items":[{"name":"Material testing","answer":3,"lines":[{"speaker":0,"text":"The testing section lists the maximum load for each sample."},{"speaker":2,"text":"Readers also need to know how you applied that load and how long it was maintained. The numbers alone do not make the test reproducible."}],"explain":"只有结果无施加载荷方法，需要交代操作。","tag":"方法与结果"},{"name":"Cost evaluation","answer":5,"lines":[{"speaker":1,"text":"Our design appears cheaper than the commercial package."},{"speaker":2,"text":"But you priced yours at ten thousand units and theirs at a hundred. Compare them at an equivalent production scale."}],"explain":"批量不同使成本比较不公平。","tag":"比较基准"},{"name":"Transport savings","answer":2,"lines":[{"speaker":0,"text":"The transport table shows an eighteen percent saving."},{"speaker":2,"text":"When I total the rows, I get a different result. Recalculate those entries before you interpret them."}],"explain":"合计不一致，先核数字，不是直接否定研究方法。","tag":"数字核验"},{"name":"Environmental conclusion","answer":1,"lines":[{"speaker":1,"text":"We call it an environmentally harmless alternative."},{"speaker":2,"text":"That goes much further than your measurements. State the particular improvements you tested and avoid implying there are no other impacts."}],"explain":"无害过于绝对，需要限制结论范围。","tag":"概括程度"}]}},{"id":"gardens","title":"学校菜园评估","context":"Two education students plan an evaluation of a school gardening programme.","speakers":["Priya","Nathan","Tutor"],"singles":[{"stem":"What aspect of the gardening programme will the students focus on?","options":["its effect on pupils’ willingness to try unfamiliar food","its effect on parents’ gardening skills","its contribution to the school’s food budget"],"labels":["学生尝试陌生食物的意愿","家长种植技能","学校伙食预算"],"answer":0,"lines":[{"speaker":2,"text":"The school has suggested several possible outcomes. Which one have you chosen?"},{"speaker":0,"text":"We are interested in whether growing vegetables makes pupils more willing to taste something unfamiliar."},{"speaker":1,"text":"We will not calculate financial savings. The harvest is small, and that is not why the school introduced the garden."},{"speaker":2,"text":"Good. Parents may help, but their gardening skills are outside your research question."}],"explain":"目标是尝新食物的意愿，不能被菜园成本或家长参与带偏。","tag":"研究重点"},{"stem":"Why do the students reject a comparison with another school?","options":["The travelling time would be excessive.","Differences between the schools would make interpretation difficult.","The other school has refused to participate."],"labels":["路程过长","校间差异妨碍解释","另一校拒绝"],"answer":1,"lines":[{"speaker":1,"text":"The nearby school is willing to help, and it is only a short walk away."},{"speaker":0,"text":"But its pupils already have cooking lessons twice a week. Ours do not."},{"speaker":1,"text":"So any difference in food choices might come from the cooking lessons rather than the garden."},{"speaker":0,"text":"Exactly. We need a comparison that does not introduce such a large difference at the outset."}],"explain":"另一校已有额外烹饪课程，难分辨菜园效果；许可和距离都没问题。","tag":"混杂原因"},{"stem":"How does Priya respond to the head teacher’s enthusiasm?","options":["She doubts the head teacher understands gardening.","She thinks it makes further evaluation unnecessary.","She welcomes it but wants to avoid pressure for positive findings."],"labels":["怀疑校长不懂园艺","无需再评估","欢迎支持但防止只报喜"],"answer":2,"lines":[{"speaker":0,"text":"It is useful that the head teacher is so supportive. Access should be straightforward."},{"speaker":1,"text":"He sounded certain the programme would be a success."},{"speaker":0,"text":"That is the part we need to handle carefully. We must be able to report no change as well as improvement."},{"speaker":2,"text":"Yes. Support is welcome, but it should not determine the result in advance."}],"explain":"欢迎协助，同时保持可报告无效结果的独立性。不是反对支持或质疑园艺水平。","tag":"态度／双面评价"},{"stem":"What will Nathan change in the observation plan?","options":["the number of observers present","the way pupils’ reactions are recorded","the location where tasting takes place"],"labels":["观察员数量","记录反应的方法","试吃地点"],"answer":1,"lines":[{"speaker":1,"text":"Our notes currently say things like seemed interested or looked unhappy."},{"speaker":0,"text":"Those could mean different things to different observers."},{"speaker":1,"text":"I will replace them with actions we can actually count, such as touching the food or taking a bite."},{"speaker":2,"text":"Good. Keep the same classroom and the same two observers. It is the recording system that needs revision."}],"explain":"将主观印象改为可观察行为，修改的是记录办法，地点和人数不变。","tag":"方法概括"}],"multi":{"stem":"Which TWO difficulties do both students expect when collecting data?","options":["separating the effects of activities outside school","getting children to describe their preferences consistently","finding teachers willing to supervise the garden","keeping the plants alive during the winter","obtaining enough gardening tools"],"labels":["区分校外活动影响","儿童偏好表达不稳定","无人监督","冬季植物存活","园艺工具不足"],"answers":[0,1],"lines":[{"speaker":0,"text":"Some children may start cooking more at home during the same period."},{"speaker":1,"text":"Yes, distinguishing that influence from the school programme will be difficult."},{"speaker":0,"text":"There is also the language children use. A child may call the same food nice one day and strange the next without actually changing their preference."},{"speaker":1,"text":"Agreed. We need more than a single question to interpret their answers consistently."},{"speaker":0,"text":"The staff have enough tools and a supervision rota already."},{"speaker":1,"text":"And our study ends in June, so winter plant care is not a data-collection problem for us."}],"explain":"困难是校外活动影响与儿童自述不稳定。工具、监管已就绪，冬季也不在研究期间。","tag":"双方预期／范围限定"},"matching":{"stem":"What do the students decide about each proposed measure?","options":["repeat it at a later date","use it only as background information","replace it with direct observation","make it shorter","use it without changes","leave it out entirely","ask permission before using it"],"labels":["以后复测","只作背景","改直接观察","缩短","直接沿用","完全不采用","先取得许可"],"reuse":false,"items":[{"name":"Parent questionnaire","answer":3,"lines":[{"speaker":0,"text":"The parent questionnaire runs to four pages."},{"speaker":1,"text":"Many parents will not finish that. Keep the questions relevant to home food habits and remove the rest."},{"speaker":0,"text":"So we still use it, but in a much briefer form."}],"explain":"保留但缩短，不能选全部不用。","tag":"程度区别"},{"name":"Classroom photographs","answer":6,"lines":[{"speaker":1,"text":"Photographs would help us record the tasting sessions."},{"speaker":0,"text":"But the existing school permission does not cover our university report. We must obtain agreement for this particular use first."}],"explain":"现有授权未覆盖研究用途，需要先获许可。","tag":"使用范围"},{"name":"School attendance figures","answer":1,"lines":[{"speaker":0,"text":"We can get attendance figures easily."},{"speaker":1,"text":"They may tell us who missed the sessions, but they cannot establish whether anyone became more willing to try food."},{"speaker":0,"text":"Then they provide context rather than our main outcome measure."}],"explain":"易获得但不能直接证明目标效果，只作背景。","tag":"指标功能"},{"name":"Food preference cards","answer":0,"lines":[{"speaker":1,"text":"The preference cards worked well in the initial session."},{"speaker":0,"text":"Use the same set after the programme ends. We need to see whether the choices last, not just what happens on the first day."}],"explain":"用同样卡片在结束后再测，属于后续复测。","tag":"时间／复测"}]}},{"id":"library","title":"图书馆空间观察","context":"Two architecture students discuss how students use a university library.","speakers":["Hana","Luke","Tutor"],"singles":[{"stem":"What do the students want their study to explain?","options":["why students prefer electronic books","why some available seats are rarely used","why the library needs a larger collection"],"labels":["偏爱电子书的原因","有空座却少人用的原因","需要更大藏书的原因"],"answer":1,"lines":[{"speaker":0,"text":"At busy times, people say they cannot find a place to study, yet whole rows remain empty."},{"speaker":1,"text":"
