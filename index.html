function difficultyName(v){return {easy:'基础上膛',normal:'雅思正常',hard:'干扰强化'}[v]||v;}
function difficultyPacks(level=prefs.difficulty){const ids=new Set(DIFFICULTY_PACKS[level]||DIFFICULTY_PACKS.easy);return DB.packs.filter(p=>ids.has(p.id));}
function difficultyNote(v){return {easy:'优先常见词和直白语义，先把“切题→扫 ABC→带选项听”练成动作。',normal:'接近常规 P3：保留学术语境和同义替换，但不故意堆专业词。',hard:'专业词和概括更绕，只适合动作已经稳定后做。'}[v]||'';}
function renderHome(){if(!S.visible)return;S.view='home';const completedTopics=new Set(records.filter(r=>r.complete).flatMap(r=>r.packIds||[])).size;
root.innerHTML=`<div class="exam-homebar"><div><strong>S3 Focus</strong><span class="exam-version">v4.0</span></div>${button('records','Records','btn small ghost')}</div>
<section class="pl-panel exam-setup"><div class="exam-section-title">IELTS Listening · Part 3</div>

<div class="pl-section"><span class="pl-label">Difficulty</span><div class="pl-tiles">${[['easy','基础'],['normal','正常'],['hard','强化']].map(([v,t])=>button('difficulty',`<strong>${t}</strong>`,'pl-tile '+(prefs.difficulty===v?'selected':''),`data-value="${v}" aria-pressed="${prefs.difficulty===v}"`)).join('')}</div></div>
<div class="pl-section"><span class="pl-label">Question type</span><div class="pl-tiles">${[['single','三选一'],['multi','五选二'],['matching','匹配'],['mixed','完整讨论']].map(([v,t])=>button('type',`<strong>${t}</strong>`,'pl-tile '+(prefs.type===v?'selected':''),`data-value="${v}" aria-pressed="${prefs.type===v}"`)).join('')}</div></div>

<div class="pl-section"><span class="pl-label">Topics / round</span><select class="pl-select" id="pl-count" data-pref="count">${optSelect([[1,'1'],[2,'2'],[3,'3']],prefs.count)}</select></div>

<div class="pl-section"><span class="pl-label">Speed</span><select class="pl-select" id="pl-rate" data-pref="rate">${optSelect([[0.9,'0.9×'],[1,'1.0×'],[1.05,'1.05×']],prefs.rate)}</select></div>
</div>
<div class="exam-audio-row">${button('test',S.testBusy?'Playing…':'Test audio','btn small',S.testBusy?'disabled':'')}<label class="exam-heard"><input id="pl-heard" type="checkbox" data-pref="heard" ${S.voiceOK?'checked':''} ${!S.testDone?'disabled':''}> Heard audio</label><span class="pl-note">${completedTopics}/20 topics</span></div>
${S.audioMessage?`<div class="pl-alert ${!S.testDone&&!S.testBusy?'error':''}" role="status">${escape(S.audioMessage)}</div>`:''}
${button('start','Start','btn primary exam-start',!S.voiceOK||!audio.available()?'disabled':'')}
</section>`;
}
function choosePacks(){let pool=difficultyPacks().slice();let chosen=[];if(prefs.topic!=='fresh'){const first=pool.find(p=>p.id===prefs.topic);if(first)chosen.push(first);else prefs.topic='fresh';}pool=pool.filter(p=>!chosen.includes(p));const fresh=pool.filter(p=>!seen.has(p.id+':'+prefs.type));const old=pool.filter(p=>seen.has(p.id+':'+prefs.type));function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}chosen.push(...shuffle(fresh),...shuffle(old));return chosen.slice(0,Math.max(1,Math.min(3,Number(prefs.count)||1)));}
function unit(data,id,num,kind,pack,options=data.options,labels=data.labels){const opts=clone(options);return {id,num,kind,packId:pack.id,packTitle:pack.title,stem:data.stem||data.name,options:opts,labels:clone(labels),correct:data.answers?clone(data.answers):[data.answer],lines:clone(data.lines),explain:data.explain,tag:data.tag,selected:[],readyAt:null,readySeconds:null,audioStart:null,answerAt:null,changes:0,locked:false,assisted:false,probe:null,selfTags:[],marks:{stem:[],options:opts.map(()=>[])}};}
function buildBlocks(list,type){const blocks=[];for(const p of list){if(['single','mixed'].includes(type)){blocks.push({id:p.id+'-single',kind:'single',packId:p.id,title:p.title,context:p.context,speakers:p.speakers,stem:'Choose the correct answer, A, B or C.',units:p.singles.map((q,i)=>unit(q,p.id+'-s'+i,String(21+i),'single',p))});}if(['multi','mixed'].includes(type)){blocks.push({id:p.id+'-multi',kind:'multi',packId:p.id,title:p.title,context:p.context,speakers:p.speakers,stem:'Choose TWO letters, A–E.',units:[unit(p.multi,p.id+'-multi','25–26','multi',p)]});}if(['matching','mixed'].includes(type)){const m=p.matching;blocks.push({id:p.id+'-matching',kind:'matching',packId:p.id,title:p.title,context:p.context,speakers:p.speakers,stem:m.stem,reuse:m.reuse,options:m.options,labels:m.labels,optionMarks:m.options.map(()=>[]),units:m.items.map((it,i)=>unit(it,p.id+'-m'+i,String(27+i),'matching',p,m.options,m.labels))});}}return blocks;}
function start(selectedPacks=null){if(!S.voiceOK||!audio.available()){notify('先试听并确认听到了声音。');return;}audio.stop();const list=selectedPacks||choosePacks();S.run={id:'pl-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),version:DB.version,startedAt:new Date().toISOString(),mode:prefs.mode,type:prefs.type,settings:clone(prefs),packIds:list.map(p=>p.id),packTitles:list.map(p=>p.title),seenBefore:list.some(p=>seen.has(p.id+':'+prefs.type)),complete:false,interruptions:[],blocks:buildBlocks(list,prefs.type),probeCount:0};S.block=0;S.unit=0;S.focus=0;S.showHooks.clear();S.marker=false;S.markDrag=null;S.paused=false;S.view='run';beginBlock();}
function block(){return S.run.blocks[S.block];}
function focusUnit(){return block().units[S.focus];}
function allUnits(r=S.run){return r.blocks.flatMap(b=>b.units);}
function beginBlock(){S.unit=0;S.focus=0;S.probe=null;S.showHooks.clear();S.marker=false;S.markDrag=null;S.phase='preview';S.blockOpened=now();renderRun();window.scrollTo(0,0);setTimer(Number(S.run.settings.preview),finishPreview);}
function finishPreview(){if(!active()||S.paused)return;stopTimer();if(S.run.mode==='guide')beginActivation(0);else playBlock();}
function beginActivation(index){S.unit=index;S.focus=index;S.phase='activate';S.activationStart=now();renderRun();focusCard(index,true);setTimer(Number(S.run.settings.reactivate),finishActivation);}
function finishActivation(){if(S.phase!=='activate'||S.paused)return;stopTimer();const u=block().units[S.unit];const globalIndex=allUnits().indexOf(u);if(S.run.settings.probe&&globalIndex%3===2){beginProbe(u);return;}playOne();}
function beginProbe(u){S.phase='probe';const target=Math.floor(Math.random()*u.options.length);let candidates=u.labels.map((t,i)=>({t,i}));if(candidates.length>3){const other=candidates.filter(c=>c.i!==target).sort(()=>Math.random()-.5).slice(0,2);candidates=[{t:u.labels[target],i:target},...other];}candidates.sort(()=>Math.random()-.5);S.probe={id:u.id,target,candidates,selected:null,started:now()};u.assisted=true;renderProbe();setTimer(5,()=>finishProbe(null));}
function renderProbe(){const p=S.probe;root.innerHTML=`<div class="pl-runhead"><div><div class="eyebrow accent">随机含义抽查 · 仅动作建立</div><h1>刚才的选项，真的留下来了吗？</h1></div>${button('pause','暂停','btn small')}</div><div class="pl-player"><div><div class="pl-stage">原文暂时隐藏</div><div class="pl-now">抽查不会计入听力原始分，也不会当场报正误。</div></div><div class="pl-clock"><span id="pl-clock">5</span><small> 秒</small></div><div class="pl-meter"><span id="pl-clock-bar"></span></div></div><section class="pl-probe"><div class="eyebrow">ONE OPTION / MEANING CHECK</div><h2>刚才 ${ABC[p.target]} 的意思是？</h2><div class="pl-options">${p.candidates.map((c,i)=>button('probe',`<span class="pl-letter">${i+1}</span><span>${escape(c.t)}</span>`,'pl-opt',`data-value="${c.i}"`)).join('')}</div><p class="pl-note" style="margin-top:14px">${button('probe-unknown','没记清','btn small ghost')} 正式听音时，全部选项会恢复显示。</p></section>`;}
function finishProbe(value){if(S.phase!=='probe'||S.paused)return;stopTimer();const u=block().units[S.unit];u.probe={target:S.probe.target,selected:value,correct:value===S.probe.target,responseMs:Math.round(now()-S.probe.started),timeout:value===null};S.run.probeCount++;S.probe=null;playOne();}
function playbackChunk(item){if(!active()||S.paused)return;const b=block(),idx=b.units.findIndex(u=>u.id===item.unitId);if(idx>=0){const u=b.units[idx];if(u.audioStart===null)u.audioStart=now();S.unit=idx;}const who=b.speakers[item.speaker]||'Speaker';const el=$('#pl-now');if(el)el.textContent=`${who} 正在说话 · 不显示字幕`;if(S.run.mode==='guide')updateReadyBadges();}
function playbackError(code){pauseSession('audio',audioErrorText(code));}
function playOne(){S.marker=false;S.markDrag=null;S.phase='audio';renderRun();const u=block().units[S.unit];audio.play([u],{chunk:playbackChunk,end:()=>{if(!active()||S.paused)return;S.phase='answer';renderRun();setTimer(3,finishOne);},error:playbackError});}
function finishOne(){if(!active()||S.paused)return;stopTimer();block().units[S.unit].locked=true;const next=S.unit+1;if(next<block().units.length)beginActivation(next);else finishBlock();}
function playBlock(){S.marker=false;S.markDrag=null;S.phase='audio';S.focus=0;S.unit=0;renderRun();audio.play(block().units,{chunk:playbackChunk,end:()=>{if(!active()||S.paused)return;S.phase='answer';renderRun();setTimer(4,finishBlock);},error:playbackError});}
function finishBlock(){if(!active()||S.paused)return;stopTimer();audio.stop();block().units.forEach(u=>u.locked=true);S.block++;if(S.block>=S.run.blocks.length){complete();return;}beginBlock();}
function setTimer(seconds,fn){stopTimer();const ms=Math.max(0,seconds*1000*timeScale);S.clock={deadline:now()+ms,total:ms,callback:fn};tick();}
function tick(){if(!S.clock||S.paused)return;const left=Math.max(0,S.clock.deadline-now());const text=$('#pl-clock'),bar=$('#pl-clock-bar');if(text)text.textContent=Math.max(0,Math.ceil(left/(1000*timeScale)));if(bar)bar.style.width=(S.clock.total?left/S.clock.total*100:0)+'%';if(left<=0){const fn=S.clock.callback;stopTimer();fn();}else S.raf=requestAnimationFrame(tick);}
function stopTimer(){if(S.raf)cancelAnimationFrame(S.raf);S.raf=null;S.clock=null;}
function markReady(index){if(!active()||S.paused||S.phase==='probe')return;const b=block(),u=b.units[index];if(!u||u.locked)return;if(S.run.mode==='guide'&&(S.phase!=='activate'||index!==S.unit)){notify('在该题的重扫窗口确认；听音时继续跟住证据。');return;}const t=now();if(u.readyAt!==null){notify('已记录这次自报，继续听证据。');return;}u.readyAt=t;u.readySeconds=Math.max(0,(t-(S.run.mode==='guide'?S.activationStart:S.blockOpened))/1000);updateReadyBadges();}
function choose(index,value){if(!active()||S.paused||!['audio','answer'].includes(S.phase))return;const b=block(),u=b.units[index];if(!u||u.locked)return;if(S.run.mode==='guide'&&index!==S.unit){notify('动作建立按当前题推进；连续迁移可以自行切题。');return;}if(u.kind==='multi'){if(u.selected.includes(value))u.selected=u.selected.filter(v=>v!==value);else if(u.selected.length<2)u.selected.push(value);else {notify('已经选了两项。先取消一项，再替换。');return;}}else u.selected=[value];u.answerAt=now();u.changes++;if(S.run.mode==='flow'&&u.kind==='single'&&index<b.units.length-1){S.focus=index+1;}else if(u.kind==='matching'&&S.run.mode==='flow'&&index<b.units.length-1){S.focus=index+1;}else S.focus=index;updateChoices();if(S.run.mode==='flow'&&S.focus!==index)focusCard(S.focus,true);}
function setFocus(index){if(!active()||S.paused)return;const u=block().units[index];if(!u||u.locked)return;if(S.run.mode==='guide'&&S.phase!=='preview'&&index!==S.unit)return;S.focus=index;updateChoices();focusCard(index,false);}
function focusCard(index,scroll){root.querySelectorAll('[data-card]').forEach(el=>el.classList.toggle('focus',Number(el.dataset.card)===index));if(scroll){const card=block().kind==='matching'&&window.innerWidth<=590?root.querySelector('.pl-matchbank'):root.querySelector(`[data-card="${index}"]`);if(card){const r=card.getBoundingClientRect();if(r.top<100||r.bottom>window.innerHeight-40)card.scrollIntoView({block:'start',behavior:'auto'});}}}
function updateReadyBadges(){if(!active())return;const b=block();root.querySelectorAll('[data-ready]').forEach(el=>{const u=b.units[Number(el.dataset.ready)];if(!u)return;el.classList.toggle('marked',u.readyAt!==null);el.innerHTML=u.readyAt!==null?'✓ 已自报'+(u.audioStart!==null&&u.readyAt>u.audioStart?' · 晚于音频开始':''):'差异已装入 '+keyBadge('空格');});}
function updateChoices(){if(!active())return;const b=block();root.querySelectorAll('[data-choice]').forEach(el=>{const [i,v]=el.dataset.choice.split(':').map(Number),u=b.units[i];el.classList.toggle('sel',u.selected.includes(v));el.setAttribute('aria-pressed',String(u.selected.includes(v)));});root.querySelectorAll('[data-card]').forEach(el=>{const i=Number(el.dataset.card),u=b.units[i];el.classList.toggle('focus',i===S.focus);const ans=el.querySelector('[data-answerpill]');if(ans)ans.textContent=u.selected.length?u.selected.map(v=>ABC[v]).sort().join(' / '):'—';});if(b.kind==='matching'){const title=$('#pl-bank-target');if(title)title.textContent=`给 Q${b.units[S.focus].num} · ${b.units[S.focus].stem} 选择字母`;const target=$('#pl-match-select');if(target)target.value=String(S.focus);const ready=$('#pl-bank-ready');if(ready)ready.innerHTML=readyButton(b.units[S.focus],S.focus);root.querySelectorAll('[data-bank-value]').forEach(el=>{const v=Number(el.dataset.bankValue);el.classList.toggle('sel',b.units[S.focus].selected.includes(v));el.setAttribute('aria-pressed',String(b.units[S.focus].selected.includes(v)));});}const count=$('#pl-multi-count');if(count)count.textContent=`已选 ${b.units[0].selected.length} / 2`;updateReadyBadges();}
function toggleHook(index){if(!active()||S.paused||S.run.mode!=='guide'||S.phase!=='activate')return;const u=block().units[index];if(index!==S.unit)return;u.assisted=true;if(S.showHooks.has(u.id))S.showHooks.delete(u.id);else S.showHooks.add(u.id);renderRun();}
function optionButtons(u,i,disabled){return `<div class="pl-options">${u.options.map((o,j)=>button('choice',`<span class="pl-letter">${ABC[j]}</span><span>${markText(o,u.marks?.options?.[j]||[],`data-mark-kind="option" data-mark-unit="${i}" data-mark-opt="${j}"`)}</span>`,'pl-opt '+(u.selected.includes(j)?'sel':''),`data-value="${i}:${j}" data-choice="${i}:${j}" aria-pressed="${u.selected.includes(j)}" ${disabled?'aria-disabled="true" data-locked-choice="1" tabindex="-1"':''}`)).join('')}</div>`;}
function readyButton(u,i){const guide=S.run.mode==='guide';const enabled=!u.locked&&(guide?(S.phase==='activate'&&i===S.unit):['preview','audio','answer'].includes(S.phase));return button('ready',(u.readyAt!==null?'✓ 已自报':'差异已装入 '+keyBadge('空格')),'pl-ready '+(u.readyAt!==null?'marked':''),`data-value="${i}" data-ready="${i}" ${!enabled?'disabled':''}`);}
function hookView(u){return S.showHooks.has(u.id)?`<div class="pl-hook">参考压缩（辅助，不是答案）：<br>${u.labels.map((l,j)=>`${ABC[j]} ${escape(l)}`).join(' ／ ')}</div>`:'';}
function card(u,i,b){const disable=!['audio','answer'].includes(S.phase)||u.locked||(S.run.mode==='guide'&&i!==S.unit);return `<section class="pl-qcard ${S.focus===i?'focus':''} ${u.locked?'locked':''}" data-card="${i}"><div class="pl-qtop"><span class="pl-qnum">${button('focus','Q'+u.num,'',`data-value="${i}" style="border:0;background:none;padding:0;color:inherit;font:inherit"`)}</span><span class="pl-answerpill" data-answerpill>${u.selected.length?u.selected.map(v=>ABC[v]).sort().join(' / '):'—'}</span></div><h2 class="pl-qstem">${markText(u.stem,u.marks?.stem||[],`data-mark-kind="stem" data-mark-unit="${i}"`)}</h2>${b.kind==='matching'?'':optionButtons(u,i,disable)}<div class="pl-actionrow">${readyButton(u,i)}${S.run.mode==='guide'&&S.phase==='activate'&&i===S.unit?button('hook','卡住了？看参考压缩','pl-hintbtn',`data-value="${i}"`):''}${u.locked?'<span class="pl-status-text">本题已结束；一轮后统一复盘</span>':''}</div>${hookView(u)}</section>`;}
function renderRun(){if(!active())return;S.view='run';const b=block();let phaseName={preview:'初读本题组',activate:'重新扫选项差异',audio:S.run.mode==='guide'?'带着差异听完整证据':'对话连续播放 · 音频不等作答',answer:S.run.mode==='guide'?'落答案，即将进入下一题':'落答案，即将进入下一题组'}[S.phase]||'';

const instructions=b.kind==='matching'?`Choose the correct letter, A–${ABC[b.options.length-1]}. ${b.reuse?'You may use any letter more than once.':'Use each letter no more than once.'}`:b.stem;
const step=b.kind==='single'?'Read → Listen → Answer':b.kind==='multi'?'Read A–E → Listen → Choose TWO':'Read options → Listen → Match';
root.innerHTML=`<div class="pl-runhead"><div><div class="eyebrow accent">${modeName(S.run.mode)} / ${typeName(b.kind)} / ${S.block+1} OF ${S.run.blocks.length}</div><h1>${escape(b.title)}</h1></div><div class="pl-run-tools">${button('clear-marks','清除标记','btn small ghost',`${!['preview','activate'].includes(S.phase)?'disabled':''}`)}${button('pause','暂停 '+keyBadge('Esc'),'btn small ghost')}</div></div><p class="pl-context">${escape(b.context)}</p>
<div class="pl-player"><div><div class="pl-stage">${phaseName}</div><div class="pl-now" id="pl-now">${S.phase==='audio'?'Listening…':S.phase==='activate'?'Re-scan options':S.phase==='preview'?'Read questions':'Choose and move on'}</div></div><div class="pl-clock"><span id="pl-clock">${playerClock}</span><small>${S.phase==='audio'?' 播放中':' 秒'}</small></div><div class="pl-meter"><span id="pl-clock-bar"></span></div></div>
<div class="pl-flowline"><span class="on">${step}</span><span>本轮 ${scorePoints} 个得分点</span>${S.run.seenBefore?'<span>包含已练主题 · 重做</span>':'<span>本题型优先未练主题</span>'}</div>
${S.phase==='preview'?`<div class="pl-boundary">${S.run.mode==='flow'?'连续档：本组音频一旦开始，会完整往前播放。作答后会把视线焦点移到下一题，但音频不会跳句或停下来。':'动作档：先整体读清，随后每题再给重扫窗口。点击确认不会提前跳过阅读时间，也不等于已掌握。'}</div>`:''}
<div class="pl-bank-head">${b.kind==='matching'?`<strong>${escape(b.stem)}</strong>`:''}${escape(instructions)}${b.kind==='multi'?'<span class="badge" id="pl-multi-count" style="margin-left:9px">已选 0 / 2</span>':''}</div>
${b.kind==='matching'?`<div class="pl-matchlayout"><div>${b.units.map((u,i)=>card(u,i,b)).join('')}</div><aside class="pl-matchbank"><h3 id="pl-bank-target">给 Q${b.units[S.focus].num} · ${escape(b.units[S.focus].stem)} 选择字母</h3><div class="pl-matchtools"><label for="pl-match-select" class="pl-note">当前作答对象</label><select id="pl-match-select" ${S.run.mode==='guide'&&S.phase!=='preview'?'disabled':''}>${b.units.map((u,i)=>`<option value="${i}" ${i===S.focus?'selected':''} ${u.locked?'disabled':''}>Q${u.num} · ${escape(u.stem)}</option>`).join('')}</select><div id="pl-bank-ready">${readyButton(b.units[S.focus],S.focus)}</div></div><div class="pl-options">${b.options.map((o,j)=>button('bank',`<span class="pl-letter">${ABC[j]}</span><span>${markText(o,b.optionMarks?.[j]||[],`data-mark-kind="bank" data-mark-opt="${j}"`)}</span>`,'pl-opt',`data-value="${j}" data-bank-value="${j}" ${!['audio','answer'].includes(S.phase)?'aria-disabled="true" data-locked-choice="1" tabindex="-1"':''}`)).join('')}</div><p class="pl-note" style="margin-top:11px">${b.reuse?'本组允许重复用字母。':'本组每个字母最多用一次。'}<br>用上方菜单或题号切换对象；共享选项始终保留。</p></aside></div>`:b.units.map((u,i)=>card(u,i,b)).join('')}
<div class="pl-controls"><p class="pl-note">${S.phase==='preview'?'读完可以提前进入；不必等倒计时归零。':'A–'+(b.kind==='matching'?ABC[b.options.length-1]:b.kind==='multi'?'E':'C')+' 选答案；空格自报上膛；Esc 暂停。'}<br>${['preview','activate'].includes(S.phase)?'拖选文字 → 松开 → Highlight。标记会保留到听音和作答阶段。':'你刚才划的重点会继续保留；现在别再整理题面，跟住证据。'}<br>练习档加了提示与停顿，不用于推算考试分数。</p>${S.phase==='preview'?button('preview-done','读完，进入训练 →','btn primary'):button('quit','结束本轮','btn small ghost')}</div>`;updateChoices();}
function pauseSession(reason='manual',message=''){if(!active()||S.paused)return;const clock=S.clock?{remaining:Math.max(0,S.clock.deadline-now()),total:S.clock.total,callback:S.clock.callback}:null;S.held={phase:S.phase,clock,audio:S.phase==='audio'};stopTimer();audio.hold();S.paused=true;S.run.interruptions.push({at:new Date().toISOString(),reason,block:S.block,unit:S.unit});root.inert=true;modalRoot.innerHTML=`<div class="pl-modalback"><section class="pl-modal" role="dialog" aria-modal="true" aria-labelledby="pl-pause-title"><div class="eyebrow accent">PAUSED / 已标记中断</div><h2 id="pl-pause-title">${reason==='audio'?'先解决声音问题。':reason==='visibility'?'离开页面，自动暂停。':'暂停一下。'}</h2><p>${escape(message||'计时已停，原题被遮住。恢复后正在播放的短句会从头重播；本轮会带中断标记，不伪装成一次干净的连续训练。')}</p>${button('resume','恢复本轮','btn primary full','id="pl-resume"')}${button('quit','退出本轮，回到设置','btn ghost full')}</section></div>`;$('#pl-resume').focus();}
function resumeSession(){if(!S.paused||!active())return;if(S.held?.audio&&!audio.available()){notify(audioErrorText('no-english-voice'));return;}const held=S.held;S.paused=false;S.held=null;modalRoot.innerHTML='';root.inert=false;if(S.phase==='probe')renderProbe();else renderRun();if(held.clock){S.clock={deadline:now()+held.clock.remaining,total:held.clock.total,callback:held.clock.callback};tick();}if(held.audio)audio.resume();}
function score(r){const units=allUnits(r);let earned=0,total=0,ready=0,probeN=0,probeOK=0,assisted=0;for(const u of units){total+=u.correct.length;earned+=u.selected.filter(x=>u.correct.includes(x)).length;if(u.readyAt!==null&&u.audioStart!==null&&u.readyAt<=u.audioStart)ready++;if(u.probe){probeN++;if(u.probe.correct)probeOK++;}if(u.assisted)assisted++;}return {earned,total,ready,unitCount:units.length,probeN,probeOK,assisted};}
function complete(){stopTimer();audio.stop();S.run.complete=true;S.run.completedAt=new Date().toISOString();S.run.score=score(S.run);S.run.packIds.forEach(id=>seen.add(id+':'+S.run.type));save(KEY+'-seen',[...seen]);records.unshift(clone(S.run));if(records.length>300){records=records.slice(0,300);notify('本地保留最近 300 轮；可导出保存长期记录。');}save(KEY+'-records',records);S.review=records[0];S.run=null;S.phase='idle';renderReview(S.review);window.scrollTo(0,0);}
function renderReview(r){S.view='review';S.review=r;const m=score(r),units=allUnits(r);const title=r.packTitles.join(' / ');root.innerHTML=`<div class="pl-topline"><span class="pl-version">SESSION COMPLETE / ${date(r.completedAt)}</span>${button('home','返回设置','btn small ghost')}</div><div class="pl-runhead"><div><div class="eyebrow accent">${modeName(r.mode)} · ${typeName(r.type)}${r.seenBefore?' · 重做含已见题':''}</div><h1>${escape(title)}</h1></div><div class="pl-scorelarge">${m.earned}<small> / ${m.total}</small></div></div>
<div class="pl-statrow pl-four"><div class="pl-stat"><strong>${Math.round(m.earned/m.total*100)}%</strong><span>答案得分率</span></div><div class="pl-stat"><strong>${m.ready}/${m.unitCount}</strong><span>音频前确认 · 自报</span></div><div class="pl-stat"><strong>${m.probeN?m.probeOK+'/'+m.probeN:'—'}</strong><span>单项含义抽查</span></div><div class="pl-stat"><strong>${r.interruptions.length}</strong><span>中断次数</span></div></div>
<p class="pl-note">确认按钮只能记录动作自报，不能检测视线或证明脑内理解。抽查也只验证抽到的一项。${m.assisted?'本轮有 '+m.assisted+' 个题/组使用参考压缩或抽查辅助。':''}这份成绩不换算 IELTS Band。</p>${r.interruptions.length?'<div class="pl-alert">本轮有中断或语音重启，保留原始结果，但不与无中断的连续档直接比较。</div>':''}
<div class="pl-next-card"><strong>先看三个问题</strong><p class="pl-note" style="margin-top:7px">有没有在答案段开始前把差异带回来？听到的具体意思为什么能对应这个概括？上一题没确定时，下一题还能不能正常进入？错因标签由你复盘选择，系统不擅自诊断。</p></div>
${units.map((u,index)=>{const correctCount=u.selected.filter(x=>u.correct.includes(x)).length;const exact=correctCount===u.correct.length&&u.selected.length===u.correct.length;const b=r.blocks.find(x=>x.units.some(q=>q.id===u.id));return `<section class="pl-reviewitem ${exact?'ok':''}"><div class="pl-qtop"><span class="pl-qnum">Q${u.num} · ${escape(u.packTitle)}</span><span class="pl-verdict ${exact?'ok':''}">${exact?'✓ 正确':u.selected.length?'× '+(u.kind==='multi'?'命中 '+correctCount+' / 2':'答错'):'× 未作答'}</span></div><h2 class="pl-qstem">${escape(u.stem)}</h2>${u.kind==='matching'?`<p class="pl-note">${escape(b.stem)} · ${b.reuse?'可重复用字母':'每项最多一次'}</p>`:''}<div class="pl-answerline ${exact?'right':''}">你的选择：${u.selected.length?u.selected.map(i=>`${ABC[i]} · ${escape(u.options[i])}`).join('<br>'):'未作答'}</div>${exact?'':`<div class="pl-answerline right">正确：${u.correct.map(i=>`${ABC[i]} · ${escape(u.options[i])}`).join('<br>')}</div>`}<div class="pl-hook">差异压缩：${u.labels.map((l,i)=>`${ABC[i]} ${escape(l)}`).join(' ／ ')}</div><p class="pl-explain"><strong>对应关系：</strong>${escape(u.explain)}</p><p class="pl-note">${escape(u.tag)} · ${u.readyAt===null?'未做上膛自报':u.audioStart!==null&&u.readyAt<=u.audioStart?'音频前已确认（自报）':'音频开始后才确认'}${u.probe?' · 含义抽查 '+(u.probe.correct?'正确':'未通过'):''}${u.assisted?' · 有辅助':''}</p><details style="margin-top:13px"><summary class="pl-note" style="cursor:pointer">展开完整原创对话与复听</summary><div class="pl-transcript">${u.lines.map(l=>`<p><b>${escape(b.speakers[l.speaker])}</b>${escape(l.text)}</p>`).join('')}${button('replay','▷ 复听这一段','btn small',`data-value="${index}"`)} ${button('stop-audio','停止声音','btn small ghost')}</div></details><div class="pl-tags" style="margin-top:13px">${['忘了重扫','概括没对上','句意没听懂','选项词义不清','关键词诱导','上一题残留'].map(t=>button('tag',escape(t),'pl-tag '+(u.selfTags.includes(t)?'selected':''),`data-unit="${index}" data-value="${escape(t)}"`)).join('')}</div></section>`;}).join('')}
<div class="pl-controls">${button('next-fresh','换未练主题 →','btn primary')}${button('records','查看记录','btn')}${button('export','导出记录','btn ghost')}</div>`;}
function renderRecords(){audio.stop();S.view='records';root.innerHTML=`<div class="pl-topline"><span class="pl-version">PRELOAD HISTORY / 本浏览器</span>${button('home','返回训练','btn small ghost')}</div><h1 style="font-size:30px">上膛训练记录</h1><p class="pl-note" style="margin:12px 0 18px">原压缩训练记录仍在顶部「压缩记录」。这里区分动作档、连续档、已见题与中断。最多保留最近 300 轮。</p><div class="pl-inline">${button('export','导出 JSON','btn small')}${button('import','导入记录','btn small ghost')}<input type="file" accept="application/json,.json" id="pl-import-file" hidden></div>${records.length?records.map((r,i)=>{const m=score(r);return `<section class="pl-historycard"><div class="pl-inline"><div><h3>${escape(r.packTitles.join(' / '))}</h3><p class="pl-note">${date(r.completedAt)} · ${modeName(r.mode)} · ${typeName(r.type)}${r.seenBefore?' · 已见题':''}${r.interruptions.length?' · 有中断':''}</p></div><div><strong style="font-size:24px">${m.earned}/${m.total}</strong> ${button('view-record','复盘','btn small ghost',`data-value="${i}"`)}</div></div><p class="pl-note" style="margin-top:8px">音频前自报 ${m.ready}/${m.unitCount} · 抽查 ${m.probeN?m.probeOK+'/'+m.probeN:'未启用'} · ${m.assisted} 次辅助</p></section>`;}).join(''):'<p class="pl-empty">还没有完成记录。先用一组题把动作跑起来。</p>'}`;}
function replay(index){const r=S.review,u=allUnits(r)[index];if(!u)return;if(!audio.available()){notify(audioErrorText('no-english-voice'));return;}const b=r.blocks.find(b=>b.units.some(x=>x.id===u.id));audio.play([u],{chunk:item=>notify('复听 · '+(b.speakers[item.speaker]||'Speaker')),end:()=>notify('复听结束；不覆盖首遍成绩。'),error:c=>notify(audioErrorText(c))});}
function setTag(index,t){const r=S.review,u=allUnits(r)[index];if(!u)return;u.selfTags=u.selfTags.includes(t)?u.selfTags.filter(x=>x!==t):[...u.selfTags,t];const i=records.findIndex(x=>x.id===r.id);if(i>=0)records[i]=r;save(KEY+'-records',records);root.querySelectorAll(`[data-pl="tag"][data-unit="${index}"]`).forEach(el=>el.classList.toggle('selected',u.selfTags.includes(el.dataset.value)));}
function exportData(){const data={app:'S3 Focus Preload',version:DB.version,exportedAt:new Date().toISOString(),note:'Original practice and self-reported preparation. No IELTS band conversion.',prefs,seen:[...seen],records};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});const href=URL.createObjectURL(blob),a=document.createElement('a');a.href=href;a.download='s3-focus-preload-records-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),1000);}
async function importData(file){if(!file)return;try{if(file.size>8*1024*1024)throw new Error('文件太大，请使用本页导出的记录文件。');const d=JSON.parse(await file.text());if(d.app!=='S3 Focus Preload'||!Array.isArray(d.records))throw new Error('这不是选项上膛记录文件；旧压缩记录请保留原导出。');const safe=[];for(const r of d.records){if(!['guide','flow'].includes(r.mode)||!['single','multi','matching','mixed'].includes(r.type)||typeof r.id!=='string'||!Array.isArray(r.blocks)||!r.blocks.length||!Array.isArray(r.packTitles)||!Array.isArray(r.packIds)||!Array.isArray(r.interruptions)||!r.complete)throw new Error('记录结构不完整。');for(const b of r.blocks){if(!Array.isArray(b.units)||!b.units.length||!Array.isArray(b.speakers))throw new Error('题组结构不完整。');for(const u of b.units){if(!Array.isArray(u.options)||!Array.isArray(u.labels)||!Array.isArray(u.correct)||!Array.isArray(u.selected)||!Array.isArray(u.lines)||!Array.isArray(u.selfTags))throw new Error('题目结构不完整。');if([...u.correct,...u.selected].some(i=>!Number.isInteger(i)||i<0||i>=u.options.length))throw new Error('答案索引无效。');if(new Set(u.selected).size!==u.selected.length||u.selected.length>u.correct.length)throw new Error('答案数量无效。');}}safe.push(r);}const merged=new Map(records.map(r=>[r.id,r]));for(const r of safe)if(!merged.has(r.id))merged.set(r.id,r);records=[...merged.values()].sort((a,b)=>String(b.completedAt).localeCompare(String(a.completedAt))).slice(0,300);for(const r of records)for(const id of r.packIds)seen.add(id+':'+r.type);save(KEY+'-records',records);save(KEY+'-seen',[...seen]);renderRecords();notify('记录已合并，同一轮不会重复计数。');}catch(e){notify('未导入：'+e.message);}}

// Capture keys before the older module's listeners. No guessing whether the
// user actually looked at an option; only declared actions are recorded.
document.addEventListener('mouseup',e=>{if(!S.visible||!markablePhase())return;if(e.button!==0)return;setTimeout(()=>{const tokens=selectedMarkTokens();if(!tokens.length){hideHighlightMenu();return;}const sel=window.getSelection?.();let x=e.clientX+6,y=e.clientY+8;try{if(sel&&sel.rangeCount){const r=sel.getRangeAt(0).getBoundingClientRect();if(r.width||r.height){x=r.left+Math.min(r.width,120);y=r.bottom+6;}}}catch(_){ }showHighlightMenu(x,y,tokens);},0);},true);

document.addEventListener('click',e=>{hideHighlightMenu();const old=e.target.closest('[data-act]');if(old&&S.visible){safeNavigateOld(e);return;}const b=e.target.closest('[data-pl]');if(!b||b.disabled)return;const act=b.dataset.pl,val=b.dataset.value;if(S.paused&&!['resume','quit'].includes(act))return;
 switch(act){
 case 'home':if(S.visible)goHome();else open();break;
 case 'mode':prefs.mode=val;persist();renderHome();break;
 case 'difficulty':prefs.difficulty=val;prefs.topic='fresh';persist();renderHome();break;
 case 'type':prefs.type=val;persist();renderHome();break;
 case 'test':testAudio();break;
 case 'refresh-voices':audio.update();renderHome();break;
 case 'start':start();break;
 case 'clear-marks':clearMarks();break;
 case 'ready':markReady(Number(val));break;
 case 'choice':{const [i,v]=val.split(':').map(Number);choose(i,v);break;}
 case 'bank':choose(S.focus,Number(val));break;
 case 'focus':setFocus(Number(val));break;
 case 'hook':toggleHook(Number(val));break;
 case 'probe':finishProbe(Number(val));break;
 case 'probe-unknown':finishProbe(null);break;
 case 'preview-done':finishPreview();break;
 case 'pause':pauseSession();break;
 case 'resume':resumeSession();break;
 case 'quit':if(confirm('结束本轮？未完成轮次不会写入完成记录。'))goHomeAfterConfirm();break;
 case 'records':if(active())return;renderRecords();window.scrollTo(0,0);break;
 case 'view-record':renderReview(records[Number(val)]);window.scrollTo(0,0);break;
 case 'replay':replay(Number(val));break;
 case 'stop-audio':audio.stop();break;
 case 'tag':setTag(Number(b.dataset.unit),val);break;
 case 'next-fresh':prefs.topic='fresh';persist();goHome();break;
 case 'export':exportData();break;
 case 'import':$('#pl-import-file')?.click();break;
 }
},true);
function goHomeAfterConfirm(){dispose();S.view='home';renderHome();window.scrollTo(0,0);}
document.addEventListener('change',e=>{const el=e.target;if(el.id==='pl-match-select'){setFocus(Number(el.value));return;}if(el.id==='pl-import-file'){importData(el.files[0]);return;}const key=el.dataset?.pref;if(!key)return;if(key==='heard'){S.voiceOK=el.checked&&S.testDone;renderHome();return;}let val=el.type==='checkbox'?el.checked:el.value;if(['count','preview','reactivate','rate'].includes(key))val=Number(val);prefs[key]=val;persist();if(key.startsWith('voice')||key==='rate'){S.voiceOK=false;S.testDone=false;S.audioMessage='语音设置已改变，请重新试听。';}renderHome();},true);
document.addEventListener('keydown',e=>{if(!S.visible||e.repeat||e.ctrlKey||e.metaKey||e.altKey||e.isComposing)return;if(S.paused){if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();resumeSession();}if(e.key==='Tab'){const bs=[...modalRoot.querySelectorAll('button')];if(e.shiftKey&&document.activeElement===bs[0]){e.preventDefault();bs.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===bs.at(-1)){e.preventDefault();bs[0].focus();}}return;}if(!active())return;if(['INPUT','TEXTAREA','SELECT','SUMMARY'].includes(document.activeElement?.tagName))return;
 if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();pauseSession();return;}
 if(S.phase==='probe'){if(/^[1-3]$/.test(e.key)){e.preventDefault();e.stopImmediatePropagation();const c=S.probe.candidates[Number(e.key)-1];if(c)finishProbe(c.i);}else if(e.key==='0'){e.preventDefault();e.stopImmediatePropagation();finishProbe(null);}return;}
 if(e.code==='Space'){e.preventDefault();e.stopImmediatePropagation();markReady(S.focus);return;}
 const v=/^[1-8]$/.test(e.key)?Number(e.key)-1:ABC.indexOf(e.key.toUpperCase());if(v>=0&&v<focusUnit().options.length&&['audio','answer'].includes(S.phase)){e.preventDefault();e.stopImmediatePropagation();choose(S.focus,v);return;}
 if(e.key==='Enter'&&S.phase==='preview'&&document.activeElement?.tagName!=='BUTTON'){e.preventDefault();e.stopImmediatePropagation();finishPreview();}
},true);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&active())pauseSession('visibility');});
window.addEventListener('pagehide',()=>{if(active()){pauseSession('visibility');audio.hold();}else audio.stop();stopTimer();});
window.addEventListener('beforeunload',e=>{if(active()){e.preventDefault();e.returnValue='';}});
if(testing)window.__preloadTest={get state(){return S;},get records(){return records;},get prefs(){return prefs;},get bank(){return DB;},score,buildBlocks,markReady,choose,finishPreview,finishActivation,finishProbe,finishOne,finishBlock,pauseSession,resumeSession,start,renderRun,audio,complete,goHome};
open();
})();

</script>

<script id="mobile-v38m-js">
(()=>{
  const coarse=()=>window.matchMedia&&window.matchMedia('(pointer: coarse)').matches;
  const setAppHeight=()=>document.documentElement.style.setProperty('--app-height',`${window.innerHeight}px`);
  setAppHeight(); window.addEventListener('resize',setAppHeight,{passive:true});
  document.addEventListener('touchend',()=>{
    if(!coarse())return;
    setTimeout(()=>{
      try{
        if(typeof S==='undefined'||!S.visible||typeof markablePhase!=='function'||!markablePhase())return;
        const tokens=typeof selectedMarkTokens==='function'?selectedMarkTokens():[];
        if(tokens.length&&typeof showHighlightMenu==='function')showHighlightMenu(innerWidth/2,innerHeight-88,tokens);
      }catch(_){ }
    },220);
  },true);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)setAppHeight();});
})();
</script>
