name: Restore full source and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ielts-focus-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Restore and verify complete v4.0
        run: python3 scripts/restore.py
      - name: Publish plain full source to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch app.js data.js style.css
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Restore complete v4.0 index.html; remove obsolete Lite runtime'
            git push origin HEAD:main
          fi
      - name: Upload verified website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure existing Pages site
        uses: actions/configure-pages@v5
      - name: Deploy complete website
        id: deployment
        uses: actions/deploy-pages@v4
